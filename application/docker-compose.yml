version: '2.1'

networks:
  fabric_network:
    external:
      name: fabric_network # 已经存在的外部网络

services:
  # MySQL 数据库
  mysql:
    image: mysql:5.7
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: fabric_mims
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fabric_network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # 后端
  fabric-mims.server:
    # 改动代码后需要编译镜像（进入 server 执行 ./build.sh）
    image: fabric-mims.server:latest
    container_name: fabric-mims.server
    ports:
      - "8888:8888"
    volumes:
      - /usr/share/zoneinfo/Asia/Shanghai:/usr/share/zoneinfo/Asia/Shanghai
      - ./../network/crypto-config:/network/crypto-config
    networks:
      - fabric_network
    depends_on:
      - mysql
    restart: on-failure

  # 前端
  fabric-mims.web:
    # 改动代码后需要编译镜像（进入 web 执行 ./build.sh）
    image: fabric-mims.web:latest
    container_name: fabric-mims.web
    ports:
      - "8000:80"
    networks:
      - fabric_network
    depends_on:
      - fabric-mims.server

volumes:
  mysql_data: