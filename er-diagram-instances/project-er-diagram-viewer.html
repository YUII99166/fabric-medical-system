<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>项目模块 ER 图查看器</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --line: #d9dfeb;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2f6fed;
      --accent: #10b981;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background:
        radial-gradient(circle at top left, #ffffff 0%, #f4f6fb 38%, #edf2fb 100%);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    .topbar,
    .wrap,
    .hint {
      max-width: 1600px;
      margin-left: auto;
      margin-right: auto;
    }

    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
    }

    .topbar label {
      font-weight: 700;
    }

    select, button {
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      padding: 10px 12px;
      font-size: 14px;
      background: #fff;
    }

    select {
      min-width: 260px;
    }

    button {
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(47, 111, 237, 0.12);
    }

    #downloadBtn {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .wrap {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 16px 42px rgba(15, 23, 42, 0.08);
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
      background: #fff;
    }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>

    function reset() {
      g.fillStyle = '#ffffff';
      g.fillRect(0, 0, W, H);
    }

    function drawPanel(x, y, w, h, title, text) {
      g.fillStyle = '#f8fafc';
      g.strokeStyle = '#d6dee9';
      g.lineWidth = 1.5;
      g.beginPath();
      g.roundRect(x, y, w, h, 16);
      g.fill();
      g.stroke();

      drawText(title, x + 20, y + 22, 18, 'bold', '#1f2937', 'left');
      drawParagraph(text, x + 20, y + 54, w - 40, 26, 14, '#4b5563');
    }

    function drawRect(x, y, w, h, fill = '#ffffff', stroke = '#1f2937', lineW = 2, radius = 14) {
      g.fillStyle = fill;
      g.strokeStyle = stroke;
      g.lineWidth = lineW;
      g.beginPath();
      g.roundRect(x, y, w, h, radius);
      g.fill();
      g.stroke();
    }

    function drawEllipse(cx, cy, rx, ry, fill = '#ffffff', stroke = '#475569', lineW = 1.6) {
      g.fillStyle = fill;
      g.strokeStyle = stroke;
      g.lineWidth = lineW;
      g.beginPath();
      g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      g.fill();
      g.stroke();
    }

    function drawText(text, x, y, size = 14, weight = 'normal', color = '#111827', align = 'center') {
      g.fillStyle = color;
      g.font = `${weight} ${size}px "Microsoft YaHei", "PingFang SC", Arial, sans-serif`;
      g.textAlign = align;
      g.textBaseline = 'middle';
      g.fillText(text, x, y);
    }

    function drawParagraph(text, x, y, maxWidth, lineHeight, size = 14, color = '#374151') {
      g.fillStyle = color;
      g.font = `${size}px "Microsoft YaHei", "PingFang SC", Arial, sans-serif`;
      g.textAlign = 'left';
      g.textBaseline = 'top';
      const chars = [...text];
      let line = '';
      let cy = y;
      chars.forEach((ch) => {
        const test = line + ch;
        if (g.measureText(test).width > maxWidth && line) {
          g.fillText(line, x, cy);
          line = ch;
          cy += lineHeight;
        } else {
          line = test;
        }
      });
      if (line) g.fillText(line, x, cy);
    }

    function drawLine(x1, y1, x2, y2, lineW = 1.8, stroke = '#334155') {
      g.strokeStyle = stroke;
      g.lineWidth = lineW;
      g.beginPath();
      g.moveTo(x1, y1);
      g.lineTo(x2, y2);
      g.stroke();
    }

    function drawArrowHead(x1, y1, x2, y2, color = '#334155') {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const len = 10;
      g.fillStyle = color;
      g.beginPath();
      g.moveTo(x2, y2);
      g.lineTo(x2 - len * Math.cos(angle - Math.PI / 6), y2 - len * Math.sin(angle - Math.PI / 6));
      g.lineTo(x2 - len * Math.cos(angle + Math.PI / 6), y2 - len * Math.sin(angle + Math.PI / 6));
      g.closePath();
      g.fill();
    }

    function pointOnRectEdge(rect, target) {
      const cx = rect.x + rect.w / 2;
      const cy = rect.y + rect.h / 2;
      const dx = target.x - cx;
      const dy = target.y - cy;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);

      if (absDx === 0 && absDy === 0) return { x: cx, y: cy };

      if (absDx * rect.h > absDy * rect.w) {
        const sign = dx >= 0 ? 1 : -1;
        const x = rect.x + (sign > 0 ? rect.w : 0);
        const t = (x - cx) / dx;
        return { x, y: cy + dy * t };
      }

      const sign = dy >= 0 ? 1 : -1;
      const y = rect.y + (sign > 0 ? rect.h : 0);
      const t = (y - cy) / dy;
      return { x: cx + dx * t, y };
    }

    function attrText(attrName) {
      return COLUMN_LABELS[attrName] || attrName;
    }

    function drawEntityBox(entityKey, box, focus = false) {
      const entity = DATA.ENTITIES[entityKey];
      const fill = focus ? '#eef4ff' : '#ffffff';
      const stroke = focus ? '#2f6fed' : '#1f2937';
      const headerFill = focus ? '#2f6fed' : '#e9eef6';

      drawRect(box.x, box.y, box.w, box.h, fill, stroke, focus ? 2.8 : 2);
      drawRect(box.x, box.y, box.w, 38, headerFill, stroke, focus ? 2.8 : 2, 14);
      drawText(entity.label, box.x + box.w / 2, box.y + 20, 18, 'bold', focus ? '#ffffff' : '#111827');
      drawText(entity.table, box.x + box.w / 2, box.y + 58, 13, 'normal', '#64748b');

      const previewAttrs = entity.attrs.slice(0, 5);
      previewAttrs.forEach((attr, index) => {
        const y = box.y + 84 + index * 16;
        const prefix = attr.key ? 'PK ' : '   ';
        drawText(`${prefix}${attrText(attr.name)}`, box.x + 18, y, 12, attr.key ? 'bold' : 'normal', '#334155', 'left');
      });

      if (entity.attrs.length > previewAttrs.length) {
        drawText(`... 共 ${entity.attrs.length} 个字段`, box.x + 18, box.y + box.h - 16, 12, 'normal', '#94a3b8', 'left');
      }
    }

    function drawRelationLine(fromBox, toBox, label, fromCard, toCard) {
      const start = pointOnRectEdge(fromBox, { x: toBox.x + toBox.w / 2, y: toBox.y + toBox.h / 2 });
      const end = pointOnRectEdge(toBox, { x: fromBox.x + fromBox.w / 2, y: fromBox.y + fromBox.h / 2 });
      const midX = (start.x + end.x) / 2;
      const midY = (start.y + end.y) / 2;

      drawLine(start.x, start.y, end.x, end.y, 2.2, '#64748b');
      drawArrowHead(start.x, start.y, end.x, end.y, '#64748b');

      drawRect(midX - 82, midY - 18, 164, 36, '#ffffff', '#cbd5e1', 1.3, 10);
      drawText(label, midX, midY, 12, 'bold', '#334155');
      drawText(fromCard, start.x + (start.x < end.x ? 18 : -18), start.y - 12, 12, 'bold', '#0f172a');
      drawText(toCard, end.x + (end.x < start.x ? 18 : -18), end.y - 12, 12, 'bold', '#0f172a');
    }

    function drawDiamond(cx, cy, w, h, fill = '#ffffff', stroke = '#111827', lineW = 2) {
      g.fillStyle = fill;
      g.strokeStyle = stroke;
      g.lineWidth = lineW;
      g.beginPath();
      g.moveTo(cx, cy - h / 2);
      g.lineTo(cx + w / 2, cy);
      g.lineTo(cx, cy + h / 2);
      g.lineTo(cx - w / 2, cy);
      g.closePath();
      g.fill();
      g.stroke();
    }

    function drawFeature(featureKey) {
      const view = FEATURE_VIEWS[featureKey];
      if (!view) return;

      reset();

      const leftBox = { x: 120, y: 300, w: 420, h: 200 };
      const rightBox = { x: 1260, y: 300, w: 420, h: 200 };
      const diamondX = 900;
      const diamondY = 400;
      const diamondW = 240;
      const diamondH = 140;

      drawText(`图：${view.title} 功能 ER 图`, W / 2, 50, 26, 'bold', '#0f172a');
      drawText(`关系：${view.left} ${view.leftCard} — ${view.relation} — ${view.right} ${view.rightCard}`, W / 2, 80, 14, 'normal', '#6b7280');

      // Entities (只显示主体矩形 + 内部椭圆属性，贴近你截图的样式)
      drawRect(leftBox.x, leftBox.y, leftBox.w, leftBox.h, '#ffffff', '#111827', 2, 0);
      drawText(DATA.ENTITIES[view.left].label, leftBox.x + leftBox.w / 2, leftBox.y + 30, 20, 'bold', '#111827');

      drawRect(rightBox.x, rightBox.y, rightBox.w, rightBox.h, '#ffffff', '#111827', 2, 0);
      drawText(DATA.ENTITIES[view.right].label, rightBox.x + rightBox.w / 2, rightBox.y + 30, 20, 'bold', '#111827');

      // Diamond relation
      drawDiamond(diamondX, diamondY, diamondW, diamondH, '#ffffff', '#111827', 2.2);
      drawText(view.relation, diamondX, diamondY + 2, 14, 'bold', '#111827');

      // Connector lines
      const leftEdge = pointOnRectEdge(leftBox, { x: diamondX, y: diamondY });
      const rightEdge = pointOnRectEdge(rightBox, { x: diamondX, y: diamondY });
      drawLine(leftEdge.x, leftEdge.y, diamondX, diamondY, 2.2, '#111827');
      drawLine(rightEdge.x, rightEdge.y, diamondX, diamondY, 2.2, '#111827');

      // Cardinalities
      drawText(view.leftCard, leftEdge.x - 18, leftEdge.y - 10, 14, 'bold', '#111827');
      drawText(view.rightCard, rightEdge.x + 18, rightEdge.y - 10, 14, 'bold', '#111827');

      function pickAttrs(entityKey, wantNames) {
        const ent = DATA.ENTITIES[entityKey];
        if (!ent) return [];
        const list = [];
        wantNames.forEach((n) => {
          const a = ent.attrs.find((x) => x.name === n);
          if (!a) return;
          list.push(a);
        });
        // 补足至少 6 个字段，避免太空
        if (list.length < 6) {
          ent.attrs.filter(a => a.key).forEach(a => {
            if (!list.some(x => x.name === a.name)) list.push(a);
          });
        }
        return list;
      }

      function drawAttrs(box, entityKey, attrs, side) {
        const cxE = box.x + box.w / 2;
        const cyE = box.y + box.h / 2;
        const r = 280;
        const rx = 58;
        const ry = 28;

        const angleStart = side === 'left' ? 0.75 * Math.PI : -0.5 * Math.PI;
        const angleEnd = side === 'left' ? 1.25 * Math.PI : 0.5 * Math.PI;

        const n = attrs.length;
        attrs.forEach((a, i) => {
          const t = n === 1 ? 0.5 : i / (n - 1);
          const angle = angleStart + (angleEnd - angleStart) * t;
          const ex = cxE + r * Math.cos(angle);
          const ey = cyE + r * Math.sin(angle);

          const pOn = pointOnRectEdge(box, { x: ex, y: ey });
          drawLine(pOn.x, pOn.y, ex, ey, 1.5, '#111827');

          // 保持与论文示例一致：椭圆描边全用黑色；主键仅用更粗线宽/更粗字体突出
          const stroke = '#111827';
          const lineW = a.key ? 2.6 : 1.7;
          drawEllipse(ex, ey, rx, ry, '#ffffff', stroke, lineW);
          const txt = attrText(a.name);
          drawText(txt, ex, ey + 1, 12, a.key ? 'bold' : 'normal', '#111827');
        });
      }

      const leftAttrs = pickAttrs(view.left, view.leftAttrs).slice(0, 11);
      const rightAttrs = pickAttrs(view.right, view.rightAttrs).slice(0, 11);
      drawAttrs(leftBox, view.left, leftAttrs, 'left');
      drawAttrs(rightBox, view.right, rightAttrs, 'right');

      drawText('提示：无显式外键约束，关系按字段引用逻辑推断（字段名来自 `init_complete.sql`）', W / 2, H - 32, 13, 'normal', '#6b7280');
    }

    function getRelationsForEntities(entityKeys) {
      const set = new Set(entityKeys);
      return DATA.RELATIONS.filter((r) => set.has(r.from) && set.has(r.to));
    }

    function drawModule(viewKey) {
      const view = MODULE_VIEWS[viewKey];
      if (!view) return;

      reset();
      drawText(view.title, W / 2, 42, 24, 'bold', '#0f172a');
      drawText('项目实体关系按业务模块拆分展示', W / 2, 76, 14, 'normal', '#64748b');

      drawPanel(70, 110, 470, 130, '模块说明', view.desc);
      drawPanel(1260, 110, 470, 130, '模块实体', view.entities.map((key) => `${DATA.ENTITIES[key].label}（${DATA.ENTITIES[key].table}）`).join('、'));

      view.entities.forEach((key) => {
        drawEntityBox(key, view.layout[key], key === view.focus);
      });

      const relations = getRelationsForEntities(view.entities);
      relations.forEach((rel) => {
        drawRelationLine(view.layout[rel.from], view.layout[rel.to], rel.label, rel.fromCard, rel.toCard);
      });

      drawText('说明：蓝色实体为当前模块中的核心实体，连线标签表示主要关联字段。', W / 2, H - 34, 14, 'normal', '#6b7280');
    }

    function drawGlobal() {
      reset();
      drawText('项目全局 ER 图', W / 2, 42, 24, 'bold', '#0f172a');
      drawText('用于总览所有核心实体及其主要关系', W / 2, 76, 14, 'normal', '#64748b');

      Object.keys(GLOBAL_LAYOUT).forEach((key) => {
        drawEntityBox(key, GLOBAL_LAYOUT[key], key === 'PRESCRIPTIONS');
      });

      DATA.RELATIONS.forEach((rel) => {
        drawRelationLine(GLOBAL_LAYOUT[rel.from], GLOBAL_LAYOUT[rel.to], rel.label, rel.fromCard, rel.toCard);
      });
    }

    function drawEntityDetail(entityKey) {
      const entity = DATA.ENTITIES[entityKey];
      if (!entity) return;

      reset();
      drawText(`${entity.label} 实体详图`, W / 2, 44, 24, 'bold', '#0f172a');
      drawText(`${entity.table} 字段结构展示`, W / 2, 78, 14, 'normal', '#64748b');

      const centerBox = { x: 660, y: 390, w: 480, h: 150 };
      drawRect(centerBox.x, centerBox.y, centerBox.w, centerBox.h, '#eef4ff', '#2f6fed', 2.6);
      drawText(entity.label, centerBox.x + centerBox.w / 2, centerBox.y + 42, 24, 'bold', '#0f172a');
      drawText(entity.table, centerBox.x + centerBox.w / 2, centerBox.y + 82, 14, 'normal', '#64748b');

      const radiusX = 520;
      const radiusY = 320;
      const attrs = entity.attrs;
      const step = (2 * Math.PI) / attrs.length;
      const startAngle = -Math.PI / 2;

      attrs.forEach((attr, index) => {
        const angle = startAngle + step * index;
        const ex = centerBox.x + centerBox.w / 2 + radiusX * Math.cos(angle);
        const ey = centerBox.y + centerBox.h / 2 + radiusY * Math.sin(angle);
        const p = pointOnRectEdge(centerBox, { x: ex, y: ey });

        drawLine(p.x, p.y, ex, ey, 1.4, '#94a3b8');
        drawEllipse(ex, ey, 74, 28, '#ffffff', attr.key ? '#2f6fed' : '#64748b', attr.key ? 2.2 : 1.5);
        drawText(attrText(attr.name), ex, ey, 12, attr.key ? 'bold' : 'normal', '#111827');
      });
    }

    function exportPNG() {
      const a = document.createElement('a');
      a.download = `${document.getElementById('mode').value}.png`;
      a.href = canvas.toDataURL('image/png', 1.0);
      a.click();
    }

    function buildSummary(mode) {
      if (mode === 'global') {
        return [
          '全局 ER 图',
          ...DATA.RELATIONS.map((r) => `${DATA.ENTITIES[r.from].label}(${r.fromCard}) -> ${DATA.ENTITIES[r.to].label}(${r.toCard})，关联字段：${r.label}`)
        ].join('\n');
      }

      if (mode.startsWith('entity_')) {
        const entityKey = mode.replace('entity_', '');
        const entity = DATA.ENTITIES[entityKey];
        return [
          `${entity.label}（${entity.table}）`,
          `字段数量：${entity.attrs.length}`,
          `字段：${entity.attrs.map((attr) => `${attr.key ? '[PK] ' : ''}${attrText(attr.name)}`).join('、')}`
        ].join('\n');
      }

      if (mode.startsWith('feature_')) {
        const featureKey = mode;
        const view = FEATURE_VIEWS[featureKey];
        if (!view) return '';
        return [
          `功能图：${view.title}`,
          `关系：${DATA.ENTITIES[view.left].label}(${view.leftCard}) -- ${view.relation} -- ${DATA.ENTITIES[view.right].label}(${view.rightCard})`,
          `左实体字段：${view.leftAttrs.map(attrText).join('、')}`,
          `右实体字段：${view.rightAttrs.map(attrText).join('、')}`
        ].join('\n');
      }

      const view = MODULE_VIEWS[mode];
      if (!view) return '';
      const relations = getRelationsForEntities(view.entities);
      return [
        view.title,
        `模块说明：${view.desc}`,
        `核心实体：${DATA.ENTITIES[view.focus].label}`,
        `包含实体：${view.entities.map((key) => DATA.ENTITIES[key].label).join('、')}`,
        `主要关系：${relations.map((r) => `${DATA.ENTITIES[r.from].label}(${r.fromCard}) -> ${DATA.ENTITIES[r.to].label}(${r.toCard}) [${r.label}]`).join('；')}`
      ].join('\n');
    }

    function copySummary() {
      const text = buildSummary(document.getElementById('mode').value);
      navigator.clipboard.writeText(text)
        .then(() => alert('模块摘要已复制到剪贴板'))
        .catch(() => alert('复制失败，请检查浏览器剪贴板权限'));
    }

    function render() {
      const mode = document.getElementById('mode').value;
      if (mode === 'global') {
        drawGlobal();
      } else if (mode.startsWith('entity_')) {
        drawEntityDetail(mode.replace('entity_', ''));
      } else if (mode.startsWith('feature_')) {
        drawFeature(mode);
      } else {
        drawModule(mode);
      }
    }

    document.getElementById('mode').addEventListener('change', render);
    document.getElementById('downloadBtn').addEventListener('click', exportPNG);
    document.getElementById('copySummaryBtn').addEventListener('click', copySummary);

    // 支持通过 URL 参数直接打开指定模式（例如：?mode=module_prescription）
    const params = new URLSearchParams(window.location.search);
    const modeFromQuery = params.get('mode');
    if (modeFromQuery) {
      const el = document.getElementById('mode');
      if (el && Array.from(el.options).some(o => o.value === modeFromQuery)) {
        el.value = modeFromQuery;
      }
    }

    render();
  </script>
