<script>
const c = document.getElementById('c');
const g = c.getContext('2d', { alpha: false });

g.imageSmoothingEnabled = false;
g.fillStyle = '#fef8e8';
g.fillRect(0, 0, 1200, 800);

function box(x, y, w, h, dash, fillColor, strokeColor) {
    g.save();
    g.fillStyle = fillColor || 'white';
    g.strokeStyle = strokeColor || 'black';
    g.lineWidth = 2;
    if (dash) g.setLineDash([5, 5]);
    g.beginPath();
    const r = 10;
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
    g.fill();
    g.stroke();
    g.restore();
}

function txt(s, x, y) {
    g.save();
    g.fillStyle = 'black';
    g.font = 'normal 16px SimSun';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    const px = Math.round(x);
    const py = Math.round(y);
    g.fillText(s, px, py);
    g.restore();
}

function arrow(x1, y1, x2, y2, dash, color) {
    g.save();
    g.strokeStyle = color || 'black';
    g.fillStyle = color || 'black';
    g.lineWidth = 2;
    if (dash) g.setLineDash([8, 8]);
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x2, y2);
    g.stroke();
    const a = Math.atan2(y2 - y1, x2 - x1);
    g.setLineDash([]);
    g.beginPath();
    g.moveTo(x2, y2);
    g.lineTo(x2 - 10 * Math.cos(a - 0.5), y2 - 10 * Math.sin(a - 0.5));
    g.lineTo(x2 - 10 * Math.cos(a + 0.5), y2 - 10 * Math.sin(a + 0.5));
    g.closePath();
    g.fill();
    g.restore();
}

function save() {
    const scale = 3;
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = c.width * scale;
    tempCanvas.height = c.height * scale;
    const tempCtx = tempCanvas.getContext('2d', { alpha: false });
    tempCtx.scale(scale, scale);
    tempCtx.drawImage(c, 0, 0);
    
    const a = document.createElement('a');
    a.download = '区块链架构图.png';
    a.href = tempCanvas.toDataURL('image/png', 1.0);
    a.click();
}

async function copy() {
    try {
        const scale = 3;
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = c.width * scale;
        tempCanvas.height = c.height * scale;
        const tempCtx = tempCanvas.getContext('2d', { alpha: false });
        tempCtx.scale(scale, scale);
        tempCtx.drawImage(c, 0, 0);
        
        const b = await new Promise(r => tempCanvas.toBlob(r, 'image/png', 1.0));
        await navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
        alert('已复制');
    } catch(e) {
        alert('复制失败');
    }
}
