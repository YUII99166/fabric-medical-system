<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户认证与权限管理模块流程图</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        #canvas-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        canvas {
            display: block;
            width: 900px;
            height: 950px;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 10px;
        }
        button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="authCanvas" width="2250" height="2375"></canvas>
    </div>
    <div class="controls">
        <button onclick="downloadImage()">下载为PNG图片</button>
        <button onclick="copyToClipboard()">复制到剪贴板</button>
    </div>

    <script>
        const canvas = document.getElementById('authCanvas');
        const ctx = canvas.getContext('2d');
        
        // 使用2.5倍分辨率提高清晰度
        const s = 2.5;
        
        ctx.imageSmoothingEnabled = false;
        ctx.imageSmoothingQuality = 'high';

        function roundRect(x, y, width, height, radius, fill, stroke) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) {
                ctx.fillStyle = fill;
                ctx.fill();
            }
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 3;
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawDiamond(x, y, width, height, fill, stroke) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x, y - height/2);
            ctx.lineTo(x + width/2, y);
            ctx.lineTo(x, y + height/2);
            ctx.lineTo(x - width/2, y);
            ctx.closePath();
            if (fill) {
                ctx.fillStyle = fill;
                ctx.fill();
            }
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 3;
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawArrow(fromX, fromY, toX, toY, color = '#000') {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();
            const angle = Math.atan2(toY - fromY, toX - fromX);
            const arrowLength = 10;
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - arrowLength * Math.cos(angle - Math.PI / 6), 
                       toY - arrowLength * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - arrowLength * Math.cos(angle + Math.PI / 6), 
                       toY - arrowLength * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawText(text, x, y, align = 'center', fontSize = 17) {
            ctx.textAlign = align;
            ctx.fillStyle = '#000';
            ctx.font = (fontSize*s) + 'px "SimSun", "宋体", sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x, y);
        }

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const centerX = 450*s;

        // 开始
        roundRect(400*s, 50*s, 100*s, 40*s, 20*s, '#ffffff', '#000');
        drawText('开始', centerX, 70*s);

        drawArrow(centerX, 90*s, centerX, 120*s);

        // 输入账号密码
        roundRect(350*s, 120*s, 200*s, 40*s, 8*s, '#ffffff', '#000');
        drawText('输入账号和密码', centerX, 140*s);

        drawArrow(centerX, 160*s, centerX, 200*s);

        // 验证用户是否注册
        drawDiamond(centerX, 230*s, 200*s, 80*s, '#ffffff', '#000');
        drawText('验证用户是否注册', centerX, 230*s);

        // 否 - 用户注册
        drawArrow(550*s, 230*s, 650*s, 230*s);
        drawText('否', 600*s, 220*s, 'center', 14);
        roundRect(600*s, 210*s, 100*s, 40*s, 8*s, '#ffffff', '#000');
        drawText('用户进行注册', 650*s, 230*s);
        
        // 返回
        drawArrow(650*s, 250*s, 650*s, 280*s);
        drawArrow(650*s, 280*s, centerX, 280*s);
        drawArrow(centerX, 280*s, centerX, 260*s);

        // 是
        drawArrow(centerX, 260*s, centerX, 300*s);
        drawText('是', 460*s, 280*s, 'left', 14);

        // 验证用户密码和权限
        drawDiamond(centerX, 340*s, 240*s, 80*s, '#ffffff', '#000');
        drawText('验证用户密码和权限', centerX, 340*s);

        // 否 - 提示账号或密码不正确
        drawArrow(570*s, 340*s, 700*s, 340*s);
        drawText('否', 635*s, 330*s, 'center', 14);
        roundRect(650*s, 320*s, 100*s, 50*s, 8*s, '#ffffff', '#000');
        drawText('提示账号或', 700*s, 335*s);
        drawText('密码不正确', 700*s, 355*s);

        // 返回输入
        drawArrow(700*s, 370*s, 700*s, 400*s);
        drawArrow(700*s, 400*s, 200*s, 400*s);
        drawArrow(200*s, 400*s, 200*s, 140*s);
        drawArrow(200*s, 140*s, 350*s, 140*s);

        // 是
        drawArrow(centerX, 370*s, centerX, 420*s);
        drawText('是', 460*s, 390*s, 'left', 14);

        // 生成用户登录的token
        roundRect(350*s, 420*s, 200*s, 40*s, 8*s, '#ffffff', '#000');
        drawText('生成用户登录的token', centerX, 440*s);

        drawArrow(centerX, 460*s, centerX, 500*s);

        // 返回包含token的成功响应
        roundRect(325*s, 500*s, 250*s, 40*s, 8*s, '#ffffff', '#000');
        drawText('返回包含token的成功响应', centerX, 520*s);

        drawArrow(centerX, 540*s, centerX, 580*s);

        // 将token存储到数据库中
        roundRect(325*s, 580*s, 250*s, 40*s, 8*s, '#ffffff', '#000');
        drawText('将token存储到数据库中', centerX, 600*s);

        drawArrow(centerX, 620*s, centerX, 660*s);

        // 返回登录成功提示
        roundRect(350*s, 660*s, 200*s, 40*s, 8*s, '#ffffff', '#000');
        drawText('返回登录成功提示', centerX, 680*s);

        drawArrow(centerX, 700*s, centerX, 740*s);

        // 根据角色跳转到对应页面
        roundRect(325*s, 740*s, 250*s, 50*s, 8*s, '#ffffff', '#000');
        drawText('根据角色跳转到对应页面', centerX, 755*s);
        drawText('(患者/医生/管理员/药店)', centerX, 775*s);

        drawArrow(centerX, 790*s, centerX, 830*s);

        // 结束
        roundRect(400*s, 830*s, 100*s, 40*s, 20*s, '#ffffff', '#000');
        drawText('结束', centerX, 850*s);

        // 下载图片（最高清晰度）
        function downloadImage() {
            canvas.toBlob(function(blob) {
                const link = document.createElement('a');
                link.download = '用户认证与权限管理模块流程图.png';
                link.href = URL.createObjectURL(blob);
                link.click();
                // 释放对象URL
                setTimeout(() => URL.revokeObjectURL(link.href), 100);
            }, 'image/png', 1.0);
        }

        // 复制到剪贴板（最高清晰度）
        async function copyToClipboard() {
            try {
                const blob = await new Promise(resolve => 
                    canvas.toBlob(resolve, 'image/png', 1.0)
                );
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);
                alert('已复制到剪贴板！');
            } catch (err) {
                alert('复制失败，请使用下载功能');
            }
        }
    </script>
</body>
</html>
