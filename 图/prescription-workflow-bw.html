<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>病历创建与上链流程图 - 黑白版</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        #canvas-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        canvas {
            display: block;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 10px;
        }
        button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="prescriptionCanvas" width="500" height="900"></canvas>
    </div>
    <div class="controls">
        <button onclick="downloadImage()">下载为PNG图片</button>
        <button onclick="copyToClipboard()">复制到剪贴板</button>
    </div>

    <script>
        const canvas = document.getElementById('prescriptionCanvas');
        const ctx = canvas.getContext('2d');

        // 绘制圆角矩形
        function roundRect(x, y, width, height, radius, fill, stroke) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) {
                ctx.fillStyle = fill;
                ctx.fill();
            }
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.restore();
        }

        // 绘制箭头
        function drawArrow(fromX, fromY, toX, toY, color = '#000') {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            const angle = Math.atan2(toY - fromY, toX - fromX);
            const arrowLength = 10;
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - arrowLength * Math.cos(angle - Math.PI / 6), 
                       toY - arrowLength * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - arrowLength * Math.cos(angle + Math.PI / 6), 
                       toY - arrowLength * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        // 绘制文本
        function drawText(text, x, y, align = 'center', color = '#000', fontSize = '14px') {
            ctx.textAlign = align;
            ctx.fillStyle = color;
            ctx.font = fontSize + ' Microsoft YaHei';
            ctx.fillText(text, x, y);
        }

        // 清空画布 - 白色背景
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 绘制标题
        ctx.font = 'bold 18px Microsoft YaHei';
        drawText('病历创建与上链流程', 250, 30, 'center', '#000', 'bold 18px');

        // 1. 医生填写病历信息
        roundRect(175, 60, 150, 40, 8, '#ffffff', '#000');
        drawText('医生填写病历信息', 250, 85);

        // 箭头
        drawArrow(250, 100, 250, 130);

        // 2. 前端表单验证
        roundRect(150, 130, 200, 50, 8, '#ffffff', '#000');
        drawText('前端表单验证', 250, 150);
        drawText('(必填项、格式检查)', 250, 165);

        // 箭头
        drawArrow(250, 180, 250, 210);

        // 3. 提交病历数据
        roundRect(175, 210, 150, 40, 8, '#ffffff', '#000');
        drawText('提交病历数据', 250, 235);

        // 箭头
        drawArrow(250, 250, 250, 280);

        // 4. 后端验证医生身份和组织权限
        roundRect(150, 280, 200, 50, 8, '#ffffff', '#000');
        drawText('后端验证医生身份', 250, 300);
        drawText('和组织权限', 250, 315);

        // 箭头
        drawArrow(250, 330, 250, 360);

        // 5. 保存到MySQL数据库生成病历ID
        roundRect(150, 360, 200, 50, 8, '#ffffff', '#000');
        drawText('保存到MySQL数据库', 250, 380);
        drawText('生成病历ID', 250, 395);

        // 箭头
        drawArrow(250, 410, 250, 440);

        // 6. 调用Fabric链码CreatePrescription
        roundRect(150, 440, 200, 50, 8, '#ffffff', '#000');
        drawText('调用Fabric链码', 250, 460);
        drawText('CreatePrescription', 250, 475);

        // 箭头
        drawArrow(250, 490, 250, 520);

        // 7. 背书节点验证交易
        roundRect(150, 520, 200, 50, 8, '#ffffff', '#000');
        drawText('背书节点验证交易', 250, 540);
        drawText('(至少3个组织)', 250, 555);

        // 箭头
        drawArrow(250, 570, 250, 600);

        // 8. Orderer排序打包生成区块
        roundRect(150, 600, 200, 50, 8, '#ffffff', '#000');
        drawText('Orderer排序打包', 250, 620);
        drawText('生成区块', 250, 635);

        // 箭头
        drawArrow(250, 650, 250, 680);

        // 9. Peer节点验证交易写入账本
        roundRect(150, 680, 200, 50, 8, '#ffffff', '#000');
        drawText('Peer节点验证交易', 250, 700);
        drawText('写入账本', 250, 715);

        // 箭头
        drawArrow(250, 730, 250, 760);

        // 10. 返回交易ID更新数据库
        roundRect(150, 760, 200, 50, 8, '#ffffff', '#000');
        drawText('返回交易ID', 250, 780);
        drawText('更新数据库', 250, 795);

        // 箭头
        drawArrow(250, 810, 250, 840);

        // 11. 病历创建完成
        roundRect(175, 840, 150, 40, 8, '#ffffff', '#000');
        drawText('病历创建完成', 250, 865);

        // 下载图片
        function downloadImage() {
            const link = document.createElement('a');
            link.download = '病历创建与上链流程图-黑白版.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 复制到剪贴板
        async function copyToClipboard() {
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve));
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);
                alert('已复制到剪贴板！');
            } catch (err) {
                alert('复制失败，请使用下载功能');
            }
        }
    </script>
</body>
</html>
