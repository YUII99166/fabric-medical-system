<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨组织数据授权流程图 - 黑白版</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        #canvas-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        canvas {
            display: block;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 10px;
        }
        button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="authCanvas" width="500" height="1000"></canvas>
    </div>
    <div class="controls">
        <button onclick="downloadImage()">下载为PNG图片</button>
        <button onclick="copyToClipboard()">复制到剪贴板</button>
    </div>

    <script>
        const canvas = document.getElementById('authCanvas');
        const ctx = canvas.getContext('2d');

        // 绘制圆角矩形
        function roundRect(x, y, width, height, radius, fill, stroke) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) {
                ctx.fillStyle = fill;
                ctx.fill();
            }
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.restore();
        }

        // 绘制菱形
        function drawDiamond(x, y, width, height, fill, stroke) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x, y - height/2);
            ctx.lineTo(x + width/2, y);
            ctx.lineTo(x, y + height/2);
            ctx.lineTo(x - width/2, y);
            ctx.closePath();
            if (fill) {
                ctx.fillStyle = fill;
                ctx.fill();
            }
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.restore();
        }

        // 绘制箭头
        function drawArrow(fromX, fromY, toX, toY, color = '#000') {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            const angle = Math.atan2(toY - fromY, toX - fromX);
            const arrowLength = 10;
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - arrowLength * Math.cos(angle - Math.PI / 6), 
                       toY - arrowLength * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - arrowLength * Math.cos(angle + Math.PI / 6), 
                       toY - arrowLength * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        // 绘制文本
        function drawText(text, x, y, align = 'center', color = '#000', fontSize = '14px') {
            ctx.textAlign = align;
            ctx.fillStyle = color;
            ctx.font = fontSize + ' Microsoft YaHei';
            ctx.fillText(text, x, y);
        }

        // 清空画布 - 白色背景
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 绘制标题
        ctx.font = 'bold 18px Microsoft YaHei';
        drawText('跨组织数据授权流程', 250, 30, 'center', '#000', 'bold 18px');

        // 1. 医生A申请访问其他机构病历
        roundRect(150, 60, 200, 50, 8, '#ffffff', '#000');
        drawText('医生A申请访问', 250, 80);
        drawText('其他机构病历', 250, 95);

        // 箭头
        drawArrow(250, 110, 250, 140);

        // 2. 填写申请理由提交授权申请
        roundRect(150, 140, 200, 50, 8, '#ffffff', '#000');
        drawText('填写申请理由', 250, 160);
        drawText('提交授权申请', 250, 175);

        // 箭头
        drawArrow(250, 190, 250, 220);

        // 3. 调用链码RequestAccess
        roundRect(150, 220, 200, 50, 8, '#ffffff', '#000');
        drawText('调用链码', 250, 240);
        drawText('RequestAccess', 250, 255);

        // 箭头
        drawArrow(250, 270, 250, 300);

        // 4. 验证医生身份检查跨组织权限
        roundRect(150, 300, 200, 50, 8, '#ffffff', '#000');
        drawText('验证医生身份', 250, 320);
        drawText('检查跨组织权限', 250, 335);

        // 箭头
        drawArrow(250, 350, 250, 380);

        // 5. 创建授权请求记录上链
        roundRect(150, 380, 200, 50, 8, '#ffffff', '#000');
        drawText('创建授权请求', 250, 400);
        drawText('记录上链', 250, 415);

        // 箭头
        drawArrow(250, 430, 250, 460);

        // 6. 患者收到授权通知审核申请
        roundRect(150, 460, 200, 50, 8, '#ffffff', '#000');
        drawText('患者收到授权通知', 250, 480);
        drawText('审核申请', 250, 495);

        // 箭头
        drawArrow(250, 510, 250, 540);

        // 7. 患者审批决定？（菱形）
        drawDiamond(250, 560, 120, 40, '#ffffff', '#000');
        drawText('患者审批决定？', 250, 565);

        // 同意分支 - 左侧
        drawArrow(190, 560, 120, 560);
        drawArrow(120, 560, 120, 600);
        roundRect(50, 600, 140, 50, 8, '#ffffff', '#000');
        drawText('同意：授权生效', 120, 620);
        drawText('允许访问外来', 120, 635);

        // 拒绝分支 - 右侧
        drawArrow(310, 560, 380, 560);
        drawArrow(380, 560, 380, 600);
        roundRect(310, 600, 140, 50, 8, '#ffffff', '#000');
        drawText('拒绝：拒绝授权申请', 380, 620);
        drawText('授权不生效', 380, 635);

        // 同意分支继续向下
        drawArrow(120, 650, 120, 680);
        roundRect(50, 680, 140, 50, 8, '#ffffff', '#000');
        drawText('审批结果上链', 120, 700);
        drawText('不可篡改', 120, 715);

        // 合并到主流程
        drawArrow(120, 730, 250, 730);
        drawArrow(250, 730, 250, 760);

        // 8. 医生A收到通知可查看授权状态
        roundRect(150, 760, 200, 50, 8, '#ffffff', '#000');
        drawText('医生A收到通知', 250, 780);
        drawText('可查看授权状态', 250, 795);

        // 箭头
        drawArrow(250, 810, 250, 840);

        // 9. 授权流程完成
        roundRect(175, 840, 150, 40, 8, '#ffffff', '#000');
        drawText('授权流程完成', 250, 865);

        // 下载图片
        function downloadImage() {
            const link = document.createElement('a');
            link.download = '跨组织数据授权流程图-黑白版.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 复制到剪贴板
        async function copyToClipboard() {
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve));
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);
                alert('已复制到剪贴板！');
            } catch (err) {
                alert('复制失败，请使用下载功能');
            }
        }
    </script>
</body>
</html>
