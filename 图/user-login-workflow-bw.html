<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录认证流程图 - 黑白版</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        #canvas-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        canvas {
            display: block;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 10px;
        }
        button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="loginCanvas" width="500" height="900"></canvas>
    </div>
    <div class="controls">
        <button onclick="downloadImage()">下载为PNG图片</button>
        <button onclick="copyToClipboard()">复制到剪贴板</button>
    </div>

    <script>
        const canvas = document.getElementById('loginCanvas');
        const ctx = canvas.getContext('2d');

        // 绘制圆角矩形
        function roundRect(x, y, width, height, radius, fill, stroke) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) {
                ctx.fillStyle = fill;
                ctx.fill();
            }
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.restore();
        }

        // 绘制菱形
        function drawDiamond(x, y, width, height, fill, stroke) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x, y - height/2);
            ctx.lineTo(x + width/2, y);
            ctx.lineTo(x, y + height/2);
            ctx.lineTo(x - width/2, y);
            ctx.closePath();
            if (fill) {
                ctx.fillStyle = fill;
                ctx.fill();
            }
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.restore();
        }

        // 绘制箭头
        function drawArrow(fromX, fromY, toX, toY, color = '#000') {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            const angle = Math.atan2(toY - fromY, toX - fromX);
            const arrowLength = 10;
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - arrowLength * Math.cos(angle - Math.PI / 6), 
                       toY - arrowLength * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - arrowLength * Math.cos(angle + Math.PI / 6), 
                       toY - arrowLength * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        // 绘制文本
        function drawText(text, x, y, align = 'center', color = '#000', fontSize = '14px') {
            ctx.textAlign = align;
            ctx.fillStyle = color;
            ctx.font = fontSize + ' Microsoft YaHei';
            ctx.fillText(text, x, y);
        }

        // 清空画布 - 白色背景
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 绘制标题
        ctx.font = 'bold 18px Microsoft YaHei';
        drawText('区块链医疗系统用户登录流程', 250, 30, 'center', '#000', 'bold 18px');

        // 1. 用户访问登录页面
        roundRect(175, 60, 150, 40, 8, '#ffffff', '#000');
        drawText('用户访问登录页面', 250, 85);

        // 箭头
        drawArrow(250, 100, 250, 130);

        // 2. 输入用户名、密码、选择角色
        roundRect(150, 130, 200, 50, 8, '#ffffff', '#000');
        drawText('输入用户名、密码', 250, 150);
        drawText('选择角色（医生/患者/药店）', 250, 165);

        // 箭头
        drawArrow(250, 180, 250, 210);

        // 3. Vue.js前端表单验证
        roundRect(175, 210, 150, 40, 8, '#ffffff', '#000');
        drawText('Vue.js前端表单验证', 250, 235);

        // 箭头
        drawArrow(250, 250, 250, 280);

        // 4. 发送登录请求到Go后端
        roundRect(150, 280, 200, 40, 8, '#ffffff', '#000');
        drawText('发送登录请求到Go后端', 250, 305);

        // 箭头
        drawArrow(250, 320, 250, 350);

        // 5. SHA256密码加密
        roundRect(175, 350, 150, 40, 8, '#ffffff', '#000');
        drawText('SHA256密码加密', 250, 375);

        // 箭头
        drawArrow(250, 390, 250, 420);

        // 6. MySQL数据库身份验证
        roundRect(150, 420, 200, 50, 8, '#ffffff', '#000');
        drawText('MySQL数据库身份验证', 250, 440);
        drawText('验证用户名和密码哈希', 250, 455);

        // 箭头
        drawArrow(250, 470, 250, 500);

        // 7. 验证组织MSPID权限
        roundRect(150, 500, 200, 50, 8, '#ffffff', '#000');
        drawText('验证组织MSPID权限', 250, 520);
        drawText('(TaobaoMSP/JDMSP等)', 250, 535);

        // 箭头
        drawArrow(250, 550, 250, 580);

        // 8. 认证成功？（菱形）
        drawDiamond(250, 600, 100, 40, '#ffffff', '#000');
        drawText('认证成功？', 250, 605);

        // 成功分支 - 向下
        drawArrow(250, 620, 250, 660);
        roundRect(150, 660, 200, 50, 8, '#ffffff', '#000');
        drawText('生成JWT令牌', 250, 680);
        drawText('包含角色和组织信息', 250, 695);

        // 失败分支 - 右侧
        drawArrow(300, 600, 380, 600);
        drawArrow(380, 600, 380, 640);
        roundRect(310, 640, 140, 50, 8, '#ffffff', '#000');
        drawText('返回错误信息', 380, 660);
        drawText('登录失败', 380, 675);

        // 继续成功流程
        drawArrow(250, 710, 250, 750);
        roundRect(150, 750, 200, 50, 8, '#ffffff', '#000');
        drawText('前端存储用户信息', 250, 770);
        drawText('根据角色跳转页面', 250, 785);

        // 最终完成
        drawArrow(250, 800, 250, 830);
        roundRect(175, 830, 150, 40, 8, '#ffffff', '#000');
        drawText('登录成功', 250, 855);

        // 下载图片
        function downloadImage() {
            const link = document.createElement('a');
            link.download = '区块链医疗系统用户登录流程图.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 复制到剪贴板
        async function copyToClipboard() {
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve));
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);
                alert('已复制到剪贴板！');
            } catch (err) {
                alert('复制失败，请使用下载功能');
            }
        }
    </script>
</body>
</html>
