<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>社区医疗管理系统 Logo</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "SimHei", "黑体", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 50px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .logo-container {
            background: rgba(255,255,255,0.95);
            padding: 50px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            text-align: center;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        .logo-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            50% { transform: translateX(100%) translateY(100%) rotate(45deg); }
            100% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
        }
        .logo-title {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(45deg, #3498db, #e74c3c, #27ae60);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 25px;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        .logo-subtitle {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-weight: 300;
            position: relative;
            z-index: 1;
        }
        svg { display: block; margin: 0 auto; }
        .feature-list {
            text-align: left; 
            margin-top: 30px; 
            font-size: 13px; 
            color: #7f8c8d; 
            line-height: 1.8;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <svg width="320" height="320" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="medicalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#0080ff;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#4da6ff;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="blockchainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#00a86b;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#00cc7a;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#33d699;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="hospitalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#0080ff;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#4da6ff;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="pharmacyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#ff6b6b;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ff8a80;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="insuranceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#bb6bd9;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#d1a3e4;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="governmentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#ffb74d;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ffcc80;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                    <stop offset="30%" style="stop-color:#f0f8ff;stop-opacity:0.98" />
                    <stop offset="70%" style="stop-color:#e6f3ff;stop-opacity:0.95" />
                    <stop offset="100%" style="stop-color:#cce7ff;stop-opacity:0.9" />
                </linearGradient>
                <linearGradient id="centerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
                    <stop offset="100%" style="stop-color:#f0f8ff;stop-opacity:0.9" />
                </linearGradient>
                <radialGradient id="glowEffect" cx="50%" cy="40%" r="60%">
                    <stop offset="0%" style="stop-color:#0066cc;stop-opacity:0.3" />
                    <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0" />
                </radialGradient>
                <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feDropShadow dx="4" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
                </filter>
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge> 
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            
            <!-- 现代盾牌主体 - 深蓝色背景，两边向内倾斜，放大版 -->
            <path d="M160 25 
                     L 250 70
                     L 235 210
                     C 235 245, 205 275, 160 300
                     C 115 275, 85 245, 85 210
                     L 70 70
                     L 160 25 Z" 
                  fill="#1e3a8a" filter="url(#shadow)">
                <animate attributeName="fill-opacity" values="0.9;1;0.9" dur="6s" repeatCount="indefinite"/>
            </path>
            
            <!-- 盾牌外层蓝色边框 -->
            <path d="M160 20 
                     L 255 65
                     L 240 210
                     C 240 250, 210 280, 160 305
                     C 110 280, 80 250, 80 210
                     L 65 65
                     L 160 20 Z" 
                  fill="none" stroke="#0ea5e9" stroke-width="6" opacity="0.9"/>
            
            <!-- 盾牌内层白色边框 -->
            <path d="M160 30 
                     L 245 72
                     L 230 205
                     C 230 240, 203 268, 160 295
                     C 117 268, 90 240, 90 205
                     L 75 72
                     L 160 30 Z" 
                  fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
            
            <!-- 内部光晕效果 -->
            <circle cx="160" cy="160" r="130" fill="#3b82f6" opacity="0.2"/>
            
            <!-- 区块链节点 - 统一绿色设计 -->
            <g filter="url(#shadow)">
                <!-- 节点1 - 顶部 -->
                <circle cx="160" cy="75" r="14" fill="url(#blockchainGradient)"/>
                <circle cx="160" cy="75" r="10" fill="#fff" opacity="0.5"/>
                <circle cx="160" cy="75" r="5" fill="#fff"/>
                
                <!-- 节点2 - 右上 -->
                <circle cx="220" cy="120" r="14" fill="url(#blockchainGradient)"/>
                <circle cx="220" cy="120" r="10" fill="#fff" opacity="0.5"/>
                <circle cx="220" cy="120" r="5" fill="#fff"/>
                
                <!-- 节点3 - 右下 -->
                <circle cx="200" cy="210" r="14" fill="url(#blockchainGradient)"/>
                <circle cx="200" cy="210" r="10" fill="#fff" opacity="0.5"/>
                <circle cx="200" cy="210" r="5" fill="#fff"/>
                
                <!-- 节点4 - 左下 -->
                <circle cx="120" cy="210" r="14" fill="url(#blockchainGradient)"/>
                <circle cx="120" cy="210" r="10" fill="#fff" opacity="0.5"/>
                <circle cx="120" cy="210" r="5" fill="#fff"/>
                
                <!-- 节点5 - 左上 -->
                <circle cx="100" cy="120" r="14" fill="url(#blockchainGradient)"/>
                <circle cx="100" cy="120" r="10" fill="#fff" opacity="0.5"/>
                <circle cx="100" cy="120" r="5" fill="#fff"/>
            </g>
            
            <!-- 连接线 - 形成网络 -->
            <g stroke="#0080ff" stroke-width="2.5" fill="none" opacity="0.7" filter="url(#glow)">
                <line x1="160" y1="75" x2="220" y2="120">
                    <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite"/>
                </line>
                <line x1="220" y1="120" x2="200" y2="210">
                    <animate attributeName="stroke-opacity" values="0.9;0.4;0.9" dur="5s" repeatCount="indefinite"/>
                </line>
                <line x1="200" y1="210" x2="120" y2="210">
                    <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite"/>
                </line>
                <line x1="120" y1="210" x2="100" y2="120">
                    <animate attributeName="stroke-opacity" values="0.9;0.4;0.9" dur="5s" repeatCount="indefinite"/>
                </line>
                <line x1="100" y1="120" x2="160" y2="75">
                    <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite"/>
                </line>
            </g>
            
            <!-- 中心医疗区域 -->
            <circle cx="160" cy="160" r="40" fill="#ffffff" filter="url(#shadow)"/>
            <circle cx="160" cy="160" r="35" fill="none" stroke="#0ea5e9" stroke-width="4"/>
            
            <!-- 医疗十字 - 盾牌的核心标识 -->
            <g fill="#0ea5e9" filter="url(#shadow)">
                <!-- 垂直线 -->
                <rect x="150" y="135" width="20" height="50" rx="10"/>
                <!-- 水平线 -->
                <rect x="135" y="150" width="50" height="20" rx="10"/>
                <!-- 中心圆点 -->
                <circle cx="160" cy="160" r="10" fill="#ffffff"/>
                <circle cx="160" cy="160" r="6" fill="#0ea5e9"/>
            </g>
            
            <!-- 安全数据流 - 在更宽广的盾牌保护下流动 -->
            <g>
                <circle cx="130" cy="100" r="3" fill="#0080ff" opacity="0.8">
                    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="rotate" values="0 160 160;360 160 160" dur="12s" repeatCount="indefinite"/>
                </circle>
                <circle cx="190" cy="110" r="2.5" fill="#00cc7a" opacity="0.6">
                    <animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="rotate" values="72 160 160;432 160 160" dur="14s" repeatCount="indefinite"/>
                </circle>
                <circle cx="195" cy="180" r="3" fill="#0066cc" opacity="0.8">
                    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="rotate" values="144 160 160;504 160 160" dur="16s" repeatCount="indefinite"/>
                </circle>
                <circle cx="160" cy="200" r="2.5" fill="#33d699" opacity="0.6">
                    <animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="rotate" values="216 160 160;576 160 160" dur="13s" repeatCount="indefinite"/>
                </circle>
                <circle cx="125" cy="180" r="3" fill="#1a8cff" opacity="0.8">
                    <animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="rotate" values="288 160 160;648 160 160" dur="15s" repeatCount="indefinite"/>
                </circle>
                <circle cx="130" cy="130" r="2.5" fill="#00a86b" opacity="0.6">
                    <animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="rotate" values="300 160 160;660 160 160" dur="11s" repeatCount="indefinite"/>
                </circle>
            </g>
            
            <!-- 安全锁图标 - 位于盾牌底部，标准锁形状 -->
            <g transform="translate(160,240)" filter="url(#shadow)">
                <!-- 锁体 -->
                <rect x="-8" y="0" width="16" height="12" rx="2" fill="#f39c12"/>
                <rect x="-6" y="2" width="12" height="8" rx="1" fill="#fff" opacity="0.9"/>
                
                <!-- 锁环 - 标准关闭状态 -->
                <path d="M -4,-8 Q -4,-11 0,-11 Q 4,-11 4,-8 L 4,-2 L 2,-2 L 2,-8 Q 2,-9 0,-9 Q -2,-9 -2,-8 L -2,-2 L -4,-2 Z" 
                      fill="#f39c12"/>
                
                <!-- 锁孔 -->
                <circle cx="0" cy="6" r="2" fill="#e67e22"/>
                <rect x="-0.5" y="6" width="1" height="3" fill="#e67e22"/>
                
                <!-- 安全光环 -->
                <circle cx="0" cy="0" r="15" fill="none" stroke="#f39c12" stroke-width="1" opacity="0.3">
                    <animate attributeName="r" values="15;18;15" dur="3s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
                </circle>
            </g>
            
            <!-- 小锁装饰 - 分布在各个节点附近，开放状态表示授权访问 -->
            <g fill="url(#medicalGradient)" opacity="0.6">
                <!-- 节点1附近的小锁 - 开放状态 -->
                <g transform="translate(175,65)">
                    <rect x="-3" y="0" width="6" height="4" rx="1" fill="url(#medicalGradient)"/>
                    <path d="M -2,-3 Q -2,-4 0,-4 Q 2,-4 2,-3 L 2,-1" 
                          fill="none" stroke="url(#medicalGradient)" stroke-width="1"/>
                    <circle cx="0" cy="2" r="0.5" fill="#fff"/>
                </g>
                
                <!-- 节点2附近的小锁 - 开放状态 -->
                <g transform="translate(235,110)">
                    <rect x="-3" y="0" width="6" height="4" rx="1" fill="url(#medicalGradient)"/>
                    <path d="M -2,-3 Q -2,-4 0,-4 Q 2,-4 2,-3 L 2,-1" 
                          fill="none" stroke="url(#medicalGradient)" stroke-width="1"/>
                    <circle cx="0" cy="2" r="0.5" fill="#fff"/>
                </g>
                
                <!-- 节点5附近的小锁 - 开放状态 -->
                <g transform="translate(85,110)">
                    <rect x="-3" y="0" width="6" height="4" rx="1" fill="url(#medicalGradient)"/>
                    <path d="M -2,-3 Q -2,-4 0,-4 Q 2,-4 2,-3 L 2,-1" 
                          fill="none" stroke="url(#medicalGradient)" stroke-width="1"/>
                    <circle cx="0" cy="2" r="0.5" fill="#fff"/>
                </g>
            </g>
        </svg>
        
        <div class="logo-title">MedChain</div>
        <div class="logo-subtitle">基于区块链的社区医疗管理系统</div>
        
        <!-- Logo说明 -->
        <div class="feature-list">
            <strong>设计理念：</strong><br>
            • <span style="color: #00a86b;">联盟节点</span>：安全可信的医疗网络<br>
            • <span style="color: #0066cc;">医疗十字</span>：专业医疗服务核心<br>
            • <span style="color: #0080ff;">数据流动</span>：安全的信息传输<br>
            • <span style="color: #ffffff; background: #0066cc; padding: 2px 6px; border-radius: 3px;">盾牌保护</span>：医疗级数据安全<br>
            • <span style="color: #00cc7a;">健康指标</span>：生命体征监测<br>
            • <span style="color: #0066cc;">节点开锁</span>：授权节点间数据共享<br>
            • <span style="color: #f39c12;">系统锁定</span>：整体安全防护机制
        </div>
    </div>
</body>
</html>
