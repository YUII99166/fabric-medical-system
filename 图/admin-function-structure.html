<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员端功能结构图 - 黑白版</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        #canvas-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        canvas {
            display: block;
            width: 1000px;
            height: 440px;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 10px;
        }
        button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="adminCanvas" width="2500" height="1100"></canvas>
    </div>
    <div class="controls">
        <button onclick="downloadImage()">下载为PNG图片</button>
        <button onclick="copyToClipboard()">复制到剪贴板</button>
    </div>

    <script>
        const canvas = document.getElementById('adminCanvas');
        const ctx = canvas.getContext('2d');
        
        // 使用2.5倍分辨率提高清晰度
        const s = 2.5;
        
        ctx.imageSmoothingEnabled = false;

        // 绘制圆角矩形
        function roundRect(x, y, width, height, radius, fill, stroke) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) {
                ctx.fillStyle = fill;
                ctx.fill();
            }
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 3;
                ctx.stroke();
            }
            ctx.restore();
        }

        // 绘制连接线
        function drawLine(fromX, fromY, toX, toY, color = '#000') {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();
            ctx.restore();
        }

        // 绘制箭头（线条和箭头分离，确保对齐）
        function drawArrow(fromX, fromY, toX, toY, color = '#000') {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 3;
            
            // 计算箭头角度
            const angle = Math.atan2(toY - fromY, toX - fromX);
            const arrowLength = 16;
            const arrowAngle = Math.PI / 6;
            
            // 绘制线条（到箭头底部）
            const arrowBaseX = toX - arrowLength * 0.6 * Math.cos(angle);
            const arrowBaseY = toY - arrowLength * 0.6 * Math.sin(angle);
            
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(arrowBaseX, arrowBaseY);
            ctx.stroke();
            
            // 绘制箭头（实心三角形）
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(
                toX - arrowLength * Math.cos(angle - arrowAngle),
                toY - arrowLength * Math.sin(angle - arrowAngle)
            );
            ctx.lineTo(
                toX - arrowLength * Math.cos(angle + arrowAngle),
                toY - arrowLength * Math.sin(angle + arrowAngle)
            );
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }

        // 绘制文本
        function drawText(text, x, y, align = 'center', color = '#000', fontSize = 17, fontWeight = 'normal') {
            ctx.textAlign = align;
            ctx.textBaseline = 'middle';
            ctx.fillStyle = color;
            ctx.font = fontWeight + ' ' + (fontSize*s) + 'px "SimSun", "宋体", sans-serif';
            ctx.fillText(text, x, y);
        }

        // 绘制竖向文本
        function drawVerticalText(text, x, y, color = '#000', fontSize = 17, fontWeight = 'normal') {
            ctx.fillStyle = color;
            ctx.font = fontWeight + ' ' + (fontSize*s) + 'px "SimSun", "宋体", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const chars = text.split('');
            const lineHeight = fontSize*s + 3;
            const startY = y - (chars.length * lineHeight) / 2 + 5;
            
            chars.forEach((char, index) => {
                ctx.fillText(char, x, startY + index * lineHeight);
            });
        }

        // 清空画布
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 绘制主标题（根节点）
        roundRect(340*s, 25*s, 320*s, 45*s, 5*s, '#ffffff', '#000');
        drawText('基于区块链的社区医疗管理信息系统', 500*s, 38*s, 'center', '#000', 17);
        drawText('(管理员端)', 500*s, 58*s, 'center', '#000', 17);

        // 第一层：主要功能模块 - 水平排列（9个模块）
        const mainModules = [
            {name: '登录', x: 28*s, y: 115*s},
            {name: '查看架构概览', x: 108*s, y: 115*s},
            {name: '查看数据统计', x: 193*s, y: 115*s},
            {name: '用户管理功能', x: 293*s, y: 115*s},
            {name: '添加用户', x: 403*s, y: 115*s},
            {name: '编辑用户', x: 503*s, y: 115*s},
            {name: '删除用户', x: 603*s, y: 115*s},
            {name: '查看权限请求', x: 703*s, y: 115*s},
            {name: '查看用户列表', x: 813*s, y: 115*s}
        ];

        // 计算第一层水平主干线的Y坐标（在箭头起点位置）
        const firstTrunkY = mainModules[0].y - 20*s;
        
        // 从根节点向下的主干线（连接到第一层主干线）
        drawLine(500*s, 70*s, 500*s, firstTrunkY);
        
        // 第一层水平主干线（端点对齐到最左和最右模块的中心）
        const firstLeftX = mainModules[0].x + 15*s;
        const firstRightX = mainModules[8].x + 15*s;
        drawLine(firstLeftX, firstTrunkY, firstRightX, firstTrunkY);

        // 绘制从主干线到主模块的垂直连接线和箭头
        mainModules.forEach(module => {
            const centerX = module.x + 15*s;
            // 箭头从主干线指向模块顶部
            drawArrow(centerX, firstTrunkY, centerX, module.y);
        });

        // 绘制主要功能模块
        mainModules.forEach((module, index) => {
            roundRect(module.x, module.y, 30*s, 130*s, 4*s, '#ffffff', '#000');
            drawVerticalText(module.name, module.x + 15*s, module.y + 65*s, '#000', 17);
        });

        // 第二层水平主干线（每个主模块下方）
        const subTrunkY = mainModules[0].y + 130*s + 20*s;
        
        const subTrunkLines = [
            {x1: 10*s + 15*s, x2: 55*s + 15*s, y: subTrunkY, parent: 0},
            {x1: 90*s + 15*s, x2: 135*s + 15*s, y: subTrunkY, parent: 1},
            {x1: 175*s + 15*s, x2: 220*s + 15*s, y: subTrunkY, parent: 2},
            {x1: 275*s + 15*s, x2: 320*s + 15*s, y: subTrunkY, parent: 3},
            {x1: 385*s + 15*s, x2: 430*s + 15*s, y: subTrunkY, parent: 4},
            {x1: 485*s + 15*s, x2: 530*s + 15*s, y: subTrunkY, parent: 5},
            {x1: 585*s + 15*s, x2: 630*s + 15*s, y: subTrunkY, parent: 6},
            {x1: 685*s + 15*s, x2: 730*s + 15*s, y: subTrunkY, parent: 7},
            {x1: 795*s + 15*s, x2: 840*s + 15*s, y: subTrunkY, parent: 8}
        ];

        // 绘制从主模块到子模块主干线的连接
        subTrunkLines.forEach(trunk => {
            const parent = mainModules[trunk.parent];
            const centerX = parent.x + 15*s;
            drawLine(centerX, parent.y + 130*s, centerX, trunk.y);
            drawLine(trunk.x1, trunk.y, trunk.x2, trunk.y);
        });

        // 第二层：子功能模块 - 每个主模块下方两个子模块
        const subModuleY = subTrunkY + 20*s;
        
        const subModules = [
            // 登录子模块
            {name: '身份验证', x: 10*s, y: subModuleY, parent: 0},
            {name: '权限确认', x: 55*s, y: subModuleY, parent: 0},
            
            // 查看架构概览子模块
            {name: '组织架构', x: 90*s, y: subModuleY, parent: 1},
            {name: '节点状态', x: 135*s, y: subModuleY, parent: 1},
            
            // 查看数据统计子模块
            {name: '业务统计', x: 175*s, y: subModuleY, parent: 2},
            {name: '数据分析', x: 220*s, y: subModuleY, parent: 2},
            
            // 用户管理功能子模块
            {name: '用户查询', x: 275*s, y: subModuleY, parent: 3},
            {name: '角色管理', x: 320*s, y: subModuleY, parent: 3},
            
            // 添加用户子模块
            {name: '信息填写', x: 385*s, y: subModuleY, parent: 4},
            {name: '权限分配', x: 430*s, y: subModuleY, parent: 4},
            
            // 编辑用户子模块
            {name: '信息修改', x: 485*s, y: subModuleY, parent: 5},
            {name: '权限调整', x: 530*s, y: subModuleY, parent: 5},
            
            // 删除用户子模块
            {name: '用户删除', x: 585*s, y: subModuleY, parent: 6},
            {name: '数据清理', x: 630*s, y: subModuleY, parent: 6},
            
            // 查看权限请求子模块
            {name: '请求列表', x: 685*s, y: subModuleY, parent: 7},
            {name: '审批处理', x: 730*s, y: subModuleY, parent: 7},
            
            // 查看用户列表子模块
            {name: '用户列表', x: 795*s, y: subModuleY, parent: 8},
            {name: '详细信息', x: 840*s, y: subModuleY, parent: 8}
        ];

        // 绘制从子模块主干线到子模块的连接线和箭头
        subModules.forEach(sub => {
            const trunk = subTrunkLines[sub.parent];
            const centerX = sub.x + 15*s;
            // 箭头直接从主干线指向子模块顶部
            drawArrow(centerX, trunk.y, centerX, sub.y);
            
            // 子模块框（统一大小）
            roundRect(sub.x, sub.y, 30*s, 130*s, 4*s, '#ffffff', '#000');
            
            // 子模块文字（竖向）
            drawVerticalText(sub.name, centerX, sub.y + 65*s, '#000', 17);
        });

        // 下载图片
        function downloadImage() {
            canvas.toBlob(function(blob) {
                const link = document.createElement('a');
                link.download = '管理员端功能结构图-黑白版.png';
                link.href = URL.createObjectURL(blob);
                link.click();
                setTimeout(() => URL.revokeObjectURL(link.href), 100);
            }, 'image/png', 1.0);
        }

        // 复制到剪贴板
        async function copyToClipboard() {
            try {
                const blob = await new Promise(resolve => 
                    canvas.toBlob(resolve, 'image/png', 1.0)
                );
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);
                alert('已复制到剪贴板！');
            } catch (err) {
                alert('复制失败，请使用下载功能');
            }
        }
    </script>
</body>
</html>
