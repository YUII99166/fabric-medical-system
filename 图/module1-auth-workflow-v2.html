<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>用户认证与权限管理模块流程图</title>
<style>
body { margin: 20px; background: #f0f0f0; font-family: SimSun, serif; }
#wrap { background: white; padding: 30px; display: inline-block; }
button { margin: 10px 5px; padding: 8px 16px; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="3400" height="3400"></canvas>
</div>
<div>
<button onclick="save()">下载图片</button>
<button onclick="copy()">复制</button>
</div>
<script>
const c = document.getElementById('c');
const g = c.getContext('2d', { alpha: false });

g.imageSmoothingEnabled = false;
g.fillStyle = '#ffffff';
g.fillRect(0, 0, 3400, 3400);

// 统一节点间距（增大间距）
const GAP = 200;

function box(x, y, w, h) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 2;
    g.fillRect(x, y, w, h);
    g.strokeRect(x, y, w, h);
}

function ellipse(x, y, w, h) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 2;
    g.beginPath();
    g.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
    g.fill();
    g.stroke();
}

function diamond(x, y, w, h) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(x + w/2, y);
    g.lineTo(x + w, y + h/2);
    g.lineTo(x + w/2, y + h);
    g.lineTo(x, y + h/2);
    g.closePath();
    g.fill();
    g.stroke();
}

function arrow(x1, y1, x2, y2) {
    g.strokeStyle = '#000';
    g.fillStyle = '#000';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x2, y2);
    g.stroke();
    const a = Math.atan2(y2 - y1, x2 - x1);
    g.beginPath();
    g.moveTo(x2, y2);
    g.lineTo(x2 - 10 * Math.cos(a - 0.5), y2 - 10 * Math.sin(a - 0.5));
    g.lineTo(x2 - 10 * Math.cos(a + 0.5), y2 - 10 * Math.sin(a + 0.5));
    g.closePath();
    g.fill();
}

function txt(s, x, y, size) {
    g.fillStyle = '#000';
    g.font = 'normal ' + (size || 46) + 'px SimSun, 宋体, STSong, "Songti SC", serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(s, x, y);
}

// 左侧列中心X坐标
const leftX = 550;
// 右侧列中心X坐标（缩小左右差距）
const rightX = 2300;

// 左侧列节点Y坐标（从上到下）
let y = 100;

// 1. 开始
const startY = y;
ellipse(leftX - 110, startY, 220, 110);
txt('开始', leftX, startY + 55);
y += 110 + GAP;

arrow(leftX, startY + 110, leftX, y);

// 2. 输入账号和密码
const inputY = y;
box(leftX - 180, inputY, 360, 110);
txt('输入账号和密码', leftX, inputY + 55);
y += 110 + GAP;

arrow(leftX, inputY + 110, leftX, y);

// 3. 验证用户是否注册（扩大菱形）
const verifyRegY = y;
diamond(leftX - 270, verifyRegY, 540, 250);
txt('从MySQL查询', leftX, verifyRegY + 90);
txt('验证用户是否注册', leftX, verifyRegY + 150);

// 「否」分支 -> 用户进行注册（右侧同一水平线）
const registerY = verifyRegY + 70;
arrow(leftX + 270, verifyRegY + 125, leftX + 420, verifyRegY + 125);
txt('否', leftX + 345, verifyRegY + 90);
box(leftX + 420, registerY, 320, 110);
txt('注册到区块链', leftX + 580, registerY + 35);
txt('并同步到MySQL', leftX + 580, registerY + 80);

// 用户进行注册 -> 返回输入账号和密码
const returnX = leftX - 380;
arrow(leftX + 580, registerY + 110, leftX + 580, registerY + 210);
arrow(leftX + 580, registerY + 210, returnX, registerY + 210);
arrow(returnX, registerY + 210, returnX, inputY + 55);
arrow(returnX, inputY + 55, leftX - 180, inputY + 55);

// 「是」分支 -> 验证用户密码和权限
y += 250 + GAP;
arrow(leftX, verifyRegY + 250, leftX, y);
txt('是', leftX - 55, verifyRegY + 330);

// 4. 验证用户密码和权限（扩大菱形）
const verifyAuthY = y;
diamond(leftX - 305, verifyAuthY, 610, 250);
txt('从MySQL验证', leftX, verifyAuthY + 90);
txt('密码和权限', leftX, verifyAuthY + 150);

// 「否」分支 -> 提示账号或密码不正确（正下方）
const errorY = verifyAuthY + 250 + GAP;
arrow(leftX, verifyAuthY + 250, leftX, errorY);
txt('否', leftX - 55, verifyAuthY + 330);
box(leftX - 200, errorY, 400, 125);
txt('提示账号或', leftX, errorY + 45);
txt('密码不正确', leftX, errorY + 90);

// 提示错误 -> 返回输入账号和密码
arrow(leftX - 200, errorY + 63, returnX, errorY + 63);
arrow(returnX, errorY + 63, returnX, inputY + 55);

// 「是」分支 -> 右侧流程（使用折线：先向右，再向上，再向右）
const midX = (leftX + rightX) / 2;
const rightStartY = startY; // 右侧列从与"开始"相同高度开始，实现完美对齐
arrow(leftX + 305, verifyAuthY + 125, midX, verifyAuthY + 125);
arrow(midX, verifyAuthY + 125, midX, rightStartY + 55);
arrow(midX, rightStartY + 55, rightX - 220, rightStartY + 55);
txt('是', leftX + 430, verifyAuthY + 90);

// 右侧列节点（从顶部开始，与左侧完全平行）
let rightY = rightStartY;

// 1. 生成用户登录的token
box(rightX - 220, rightY, 440, 110);
txt('返回用户信息', rightX, rightY + 55);
rightY += 110 + GAP;

arrow(rightX, rightY - GAP, rightX, rightY);

// 2. 返回包含token的成功响应
box(rightX - 270, rightY, 540, 110);
txt('前端接收登录成功响应', rightX, rightY + 55);
rightY += 110 + GAP;

arrow(rightX, rightY - GAP, rightX, rightY);

// 3. 将token存储到数据库中
box(rightX - 235, rightY, 470, 110);
txt('存储到sessionStorage', rightX, rightY + 55);
rightY += 110 + GAP;

arrow(rightX, rightY - GAP, rightX, rightY);

// 4. 返回登录成功提示
box(rightX - 220, rightY, 440, 110);
txt('返回登录成功提示', rightX, rightY + 55);
rightY += 110 + GAP;

arrow(rightX, rightY - GAP, rightX, rightY);

// 5. 根据角色跳转到对应页面
box(rightX - 270, rightY, 540, 125);
txt('根据角色跳转到对应页面', rightX, rightY + 45);
txt('(患者/医生/管理员/药店)', rightX, rightY + 90);
rightY += 125 + GAP;

arrow(rightX, rightY - GAP, rightX, rightY);

// 6. 结束
ellipse(rightX - 110, rightY, 220, 110);
txt('结束', rightX, rightY + 55);

function save() {
    const scale = 2; // 2倍导出，因为基础画布已经很大了
    const temp = document.createElement('canvas');
    temp.width = c.width * scale;
    temp.height = c.height * scale;
    const tg = temp.getContext('2d', { alpha: false });
    tg.imageSmoothingEnabled = false;
    tg.scale(scale, scale);
    tg.drawImage(c, 0, 0);
    
    const a = document.createElement('a');
    a.download = '用户认证与权限管理模块流程图.png';
    a.href = temp.toDataURL('image/png', 1.0);
    a.click();
}

async function copy() {
    try {
        const scale = 2;
        const temp = document.createElement('canvas');
        temp.width = c.width * scale;
        temp.height = c.height * scale;
        const tg = temp.getContext('2d', { alpha: false });
        tg.imageSmoothingEnabled = false;
        tg.scale(scale, scale);
        tg.drawImage(c, 0, 0);
        
        const b = await new Promise(r => temp.toBlob(r, 'image/png', 1.0));
        await navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
        alert('已复制');
    } catch(e) {
        alert('复制失败');
    }
}
</script>
</body>
</html>
