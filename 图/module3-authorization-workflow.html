<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>跨院授权模块流程图</title>
<style>
body { margin: 20px; background: #f0f0f0; font-family: SimSun, serif; }
#wrap { background: white; padding: 30px; display: inline-block; }
button { margin: 10px 5px; padding: 8px 16px; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="3400" height="3400"></canvas>
</div>
<div>
<button onclick="save()">下载图片</button>
<button onclick="copy()">复制</button>
</div>
<script>
const c = document.getElementById('c');
const g = c.getContext('2d', { alpha: false });

g.imageSmoothingEnabled = false;
g.fillStyle = '#ffffff';
g.fillRect(0, 0, 3400, 3400);

const GAP = 200;

function box(x, y, w, h) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 2;
    g.fillRect(x, y, w, h);
    g.strokeRect(x, y, w, h);
}

function ellipse(x, y, w, h) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 2;
    g.beginPath();
    g.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
    g.fill();
    g.stroke();
}

function diamond(x, y, w, h) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(x + w/2, y);
    g.lineTo(x + w, y + h/2);
    g.lineTo(x + w/2, y + h);
    g.lineTo(x, y + h/2);
    g.closePath();
    g.fill();
    g.stroke();
}

function arrow(x1, y1, x2, y2) {
    g.strokeStyle = '#000';
    g.fillStyle = '#000';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x2, y2);
    g.stroke();
    const a = Math.atan2(y2 - y1, x2 - x1);
    g.beginPath();
    g.moveTo(x2, y2);
    g.lineTo(x2 - 10 * Math.cos(a - 0.5), y2 - 10 * Math.sin(a - 0.5));
    g.lineTo(x2 - 10 * Math.cos(a + 0.5), y2 - 10 * Math.sin(a + 0.5));
    g.closePath();
    g.fill();
}

function txt(s, x, y) {
    g.fillStyle = '#000';
    g.font = 'normal 46px SimSun, 宋体, STSong, "Songti SC", serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(s, x, y);
}

// 左侧列中心X坐标
const leftX = 600;
// 右侧列中心X坐标
const rightX = 2200;

// 左侧列节点
let leftY = 100;

// 1. 开始
ellipse(leftX - 130, leftY, 260, 130);
txt('开始', leftX, leftY + 65);
leftY += 130 + GAP;

arrow(leftX, leftY - GAP, leftX, leftY);

// 2. 医生申请跨院授权
box(leftX - 320, leftY, 640, 150);
txt('医生申请跨院授权', leftX, leftY + 50);
txt('(输入患者ID和授权原因)', leftX, leftY + 105);
leftY += 150 + GAP;

arrow(leftX, leftY - GAP, leftX, leftY);

// 3. 提交授权申请到后端
box(leftX - 320, leftY, 640, 130);
txt('提交授权申请到后端', leftX, leftY + 65);
leftY += 130 + GAP;

arrow(leftX, leftY - GAP, leftX, leftY);

// 4. 验证医生身份和组织
box(leftX - 320, leftY, 640, 150);
txt('验证医生身份和组织', leftX, leftY + 50);
txt('(检查MSPID和权限)', leftX, leftY + 105);
leftY += 150 + GAP;

// 从左侧连接到右侧（使用折线）
const midX = (leftX + rightX) / 2;
arrow(leftX, leftY - GAP, leftX, leftY - GAP/2);
arrow(leftX, leftY - GAP/2, midX, leftY - GAP/2);
arrow(midX, leftY - GAP/2, midX, 100 + 65);
arrow(midX, 100 + 65, rightX - 320, 100 + 65);

// 右侧列节点
let rightY = 100;

// 5. 调用智能合约
box(rightX - 320, rightY, 640, 150);
txt('调用智能合约', rightX, rightY + 50);
txt('CreateAuthRequest', rightX, rightY + 105);
rightY += 150 + GAP;

arrow(rightX, rightY - GAP, rightX, rightY);

// 6. 授权请求写入区块链
box(rightX - 320, rightY, 640, 150);
txt('授权请求写入区块链', rightX, rightY + 50);
txt('(状态: 待审批)', rightX, rightY + 105);
rightY += 150 + GAP;

arrow(rightX, rightY - GAP, rightX, rightY);

// 7. 通知患者审批
box(rightX - 320, rightY, 640, 130);
txt('通知患者审批授权请求', rightX, rightY + 65);
rightY += 130 + GAP;

arrow(rightX, rightY - GAP, rightX, rightY);

// 8. 患者查看授权请求
box(rightX - 320, rightY, 640, 130);
txt('患者查看授权请求详情', rightX, rightY + 65);
rightY += 130 + GAP;

arrow(rightX, rightY - GAP, rightX, rightY);

// 9. 患者是否批准（缩小菱形）
const diamondY = rightY;
diamond(rightX - 280, diamondY, 560, 220);
txt('患者是否批准', rightX, diamondY + 110);

// 拒绝分支（右侧）- 继续拉大距离
const rejectX = rightX + 750;
arrow(rightX + 280, diamondY + 110, rejectX - 240, diamondY + 110);
txt('拒绝', rightX + 450, diamondY + 70);
box(rejectX - 240, diamondY + 40, 480, 160);
txt('更新授权状态', rejectX, diamondY + 90);
txt('为"已拒绝"', rejectX, diamondY + 150);

// 批准分支
rightY += 220 + GAP;
arrow(rightX, diamondY + 220, rightX, rightY);
txt('批准', rightX - 60, diamondY + 300);

// 10. 调用智能合约批准授权
box(rightX - 320, rightY, 640, 150);
txt('调用智能合约', rightX, rightY + 50);
txt('ApproveAuthRequest', rightX, rightY + 105);
rightY += 150 + GAP;

arrow(rightX, rightY - GAP, rightX, rightY);

// 11. 更新授权状态
box(rightX - 320, rightY, 640, 150);
txt('更新授权状态为"已批准"', rightX, rightY + 50);
txt('医生获得访问权限', rightX, rightY + 105);
rightY += 150 + GAP;

arrow(rightX, rightY - GAP, rightX, rightY);

// 12. 结束
ellipse(rightX - 130, rightY, 260, 130);
txt('结束', rightX, rightY + 65);

function save() {
    const scale = 2;
    const temp = document.createElement('canvas');
    temp.width = c.width * scale;
    temp.height = c.height * scale;
    const tg = temp.getContext('2d', { alpha: false });
    tg.imageSmoothingEnabled = false;
    tg.scale(scale, scale);
    tg.drawImage(c, 0, 0);
    
    const a = document.createElement('a');
    a.download = '跨院授权模块流程图.png';
    a.href = temp.toDataURL('image/png', 1.0);
    a.click();
}

async function copy() {
    try {
        const scale = 2;
        const temp = document.createElement('canvas');
        temp.width = c.width * scale;
        temp.height = c.height * scale;
        const tg = temp.getContext('2d', { alpha: false });
        tg.imageSmoothingEnabled = false;
        tg.scale(scale, scale);
        tg.drawImage(c, 0, 0);
        
        const b = await new Promise(r => temp.toBlob(r, 'image/png', 1.0));
        await navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
        alert('已复制');
    } catch(e) {
        alert('复制失败');
    }
}
</script>
</body>
</html>
