<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统总体工作流程图 - 黑白版</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        #canvas-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        canvas {
            display: block;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 10px;
        }
        button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="workflowCanvas" width="600" height="800"></canvas>
    </div>
    <div class="controls">
        <button onclick="downloadImage()">下载为PNG图片</button>
        <button onclick="copyToClipboard()">复制到剪贴板</button>
    </div>

    <script>
        const canvas = document.getElementById('workflowCanvas');
        const ctx = canvas.getContext('2d');

        // 绘制圆角矩形
        function roundRect(x, y, width, height, radius, fill, stroke) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) {
                ctx.fillStyle = fill;
                ctx.fill();
            }
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.restore();
        }

        // 绘制菱形
        function drawDiamond(x, y, width, height, fill, stroke) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x, y - height/2);
            ctx.lineTo(x + width/2, y);
            ctx.lineTo(x, y + height/2);
            ctx.lineTo(x - width/2, y);
            ctx.closePath();
            if (fill) {
                ctx.fillStyle = fill;
                ctx.fill();
            }
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.restore();
        }

        // 绘制箭头
        function drawArrow(fromX, fromY, toX, toY, color = '#000') {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            const angle = Math.atan2(toY - fromY, toX - fromX);
            const arrowLength = 10;
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - arrowLength * Math.cos(angle - Math.PI / 6), 
                       toY - arrowLength * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - arrowLength * Math.cos(angle + Math.PI / 6), 
                       toY - arrowLength * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        // 绘制文本
        function drawText(text, x, y, align = 'center', color = '#000', fontSize = '14px') {
            ctx.textAlign = align;
            ctx.fillStyle = color;
            ctx.font = fontSize + ' Microsoft YaHei';
            ctx.fillText(text, x, y);
        }

        // 清空画布 - 白色背景
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 绘制标题
        ctx.font = 'bold 18px Microsoft YaHei';
        drawText('系统总体工作流程', 300, 30, 'center', '#000', 'bold 18px');

        // 1. 用户访问系统
        roundRect(225, 60, 150, 40, 8, '#ffffff', '#000');
        drawText('用户访问系统', 300, 85);

        // 箭头
        drawArrow(300, 100, 300, 130);

        // 2. 身份认证（登录）
        roundRect(225, 130, 150, 40, 8, '#ffffff', '#000');
        drawText('身份认证（登录）', 300, 155);

        // 箭头
        drawArrow(300, 170, 300, 200);

        // 3. 权限验证（菱形）
        drawDiamond(300, 220, 120, 40, '#ffffff', '#000');
        drawText('权限验证', 300, 225);

        // 箭头
        drawArrow(300, 240, 300, 280);

        // 4. 前后端分离
        // 前端Vue.js
        roundRect(150, 280, 120, 50, 8, '#ffffff', '#000');
        drawText('前端Vue.js', 210, 300);
        drawText('用户界面', 210, 315);

        // 后端Go+Gin
        roundRect(330, 280, 120, 50, 8, '#ffffff', '#000');
        drawText('后端Go+Gin', 390, 300);
        drawText('业务逻辑', 390, 315);

        // 双向箭头
        drawArrow(270, 305, 320, 305);
        drawArrow(320, 295, 270, 295);

        // 箭头向下
        drawArrow(300, 330, 300, 370);

        // 5. 双存储机制
        // MySQL数据库
        roundRect(150, 370, 120, 50, 8, '#ffffff', '#000');
        drawText('MySQL数据库', 210, 390);
        drawText('快速查询', 210, 405);

        // Fabric区块链
        roundRect(330, 370, 120, 50, 8, '#ffffff', '#000');
        drawText('Fabric区块链', 390, 390);
        drawText('数据存证', 390, 405);

        // 加号
        ctx.font = 'bold 20px Microsoft YaHei';
        drawText('+', 300, 400, 'center', '#000', 'bold 20px');

        // 箭头向下
        drawArrow(300, 420, 300, 460);

        // 6. 数据返回展示
        roundRect(225, 460, 150, 40, 8, '#ffffff', '#000');
        drawText('数据返回展示', 300, 485);

        // 箭头向下
        drawArrow(300, 500, 300, 530);

        // 7. 操作完成
        roundRect(225, 530, 150, 40, 8, '#ffffff', '#000');
        drawText('操作完成', 300, 555);

        // 图号
        ctx.font = '14px Microsoft YaHei';
        drawText('图 4.3 系统总体工作流程图', 300, 600, 'center', '#000');

        // 下载图片
        function downloadImage() {
            const link = document.createElement('a');
            link.download = '系统总体工作流程图-黑白版.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 复制到剪贴板
        async function copyToClipboard() {
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve));
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);
                alert('已复制到剪贴板！');
            } catch (err) {
                alert('复制失败，请使用下载功能');
            }
        }
    </script>
</body>
</html>
