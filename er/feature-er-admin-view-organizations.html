<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>功能：管理员查看联盟组织（ER 图）</title>
  <style>
    body { margin: 20px; background: #f0f0f0; font-family: SimSun, serif; }
    #wrap { background: white; padding: 30px; display: inline-block; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    button { margin: 10px 5px; padding: 8px 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="3200" height="2400"></canvas>
</div>
<div>
<button onclick="save()">下载图片</button>
<button onclick="copy()">复制到剪贴板</button>
<button onclick="window.location.href='./index.html'">返回索引</button>
</div>
<script>
const c = document.getElementById('c');
const g = c.getContext('2d', { alpha: false });
g.imageSmoothingEnabled = false;
g.fillStyle = '#ffffff';
g.fillRect(0, 0, 3200, 2400);

function entity(x, y, w, h, text) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.fillRect(x, y, w, h);
    g.strokeRect(x, y, w, h);
    g.fillStyle = '#000';
    g.font = 'normal 60px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x + w/2, y + h/2);
}

function relation(x, y, w, h, text) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(x + w/2, y);
    g.lineTo(x + w, y + h/2);
    g.lineTo(x + w/2, y + h);
    g.lineTo(x, y + h/2);
    g.closePath();
    g.fill();
    g.stroke();
    g.fillStyle = '#000';
    g.font = 'normal 52px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x + w/2, y + h/2);
}

function attribute(x, y, w, h, text, isKey = false, rotation = 0) {
    g.save();
    if (rotation !== 0) {
        g.translate(x + w/2, y + h/2);
        g.rotate(rotation * Math.PI / 180);
        g.translate(-(x + w/2), -(y + h/2));
    }
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = isKey ? 4 : 2;
    g.beginPath();
    g.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
    g.fill();
    g.stroke();
    g.fillStyle = '#000';
    g.font = 'normal 42px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    if (isKey) {
        g.fillText(text, x + w/2, y + h/2);
        const tw = g.measureText(text).width;
        g.beginPath();
        g.moveTo(x + w/2 - tw/2, y + h/2 + 20);
        g.lineTo(x + w/2 + tw/2, y + h/2 + 20);
        g.stroke();
    } else {
        g.fillText(text, x + w/2, y + h/2);
    }
    g.restore();
}

function line(x1, y1, x2, y2) {
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x2, y2);
    g.stroke();
}

function label(text, x, y, size = 42, bold = false) {
    g.fillStyle = '#000';
    g.font = (bold ? 'bold ' : 'normal ') + size + 'px SimSun';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x, y);
}

function getRectEdgePoint(rectX, rectY, rectW, rectH, targetX, targetY) {
    const centerX = rectX + rectW / 2;
    const centerY = rectY + rectH / 2;
    const dx = targetX - centerX;
    const dy = targetY - centerY;
    if (dx === 0 && dy === 0) return { x: centerX, y: centerY };
    const angle = Math.atan2(dy, dx);
    const absAngle = Math.abs(angle);
    if (absAngle < Math.atan2(rectH, rectW)) {
        return { x: rectX + rectW, y: centerY + (rectW / 2) * Math.tan(angle) };
    } else if (absAngle > Math.PI - Math.atan2(rectH, rectW)) {
        return { x: rectX, y: centerY - (rectW / 2) * Math.tan(angle) };
    } else if (angle > 0) {
        return { x: centerX + (rectH / 2) / Math.tan(angle), y: rectY + rectH };
    } else {
        return { x: centerX - (rectH / 2) / Math.tan(angle), y: rectY };
    }
}

function getEllipseEdgePoint(cx, cy, rx, ry, targetX, targetY) {
    const dx = targetX - cx;
    const dy = targetY - cy;
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    const angle = Math.atan2(dy, dx);
    return {
        x: cx + rx * Math.cos(angle),
        y: cy + ry * Math.sin(angle)
    };
}

label('图 X.X 管理员查看联盟组织功能ER图', 1600, 100, 56, true);

// 布局：管理员在左侧，联盟组织在右侧（水平布局）
const adminX = 800, adminY = 1200, adminW = 300, adminH = 160;
const orgX = 2400, orgY = 1200, orgW = 300, orgH = 160;

// 绘制管理员实体
entity(adminX - adminW/2, adminY - adminH/2, adminW, adminH, '管理员');

const adminAttrs = [
    { cx: adminX, cy: adminY - 320, rx: 110, ry: 55, text: '用户ID', key: true, rotation: 0 },
    { cx: adminX - 300, cy: adminY - 180, rx: 100, ry: 50, text: '姓名', key: false, rotation: 0 },
    { cx: adminX - 300, cy: adminY - 50, rx: 100, ry: 50, text: '角色', key: false, rotation: 0 },
    { cx: adminX - 300, cy: adminY + 80, rx: 110, ry: 50, text: '组织ID', key: false, rotation: 0 },
    { cx: adminX - 280, cy: adminY + 200, rx: 120, ry: 50, text: '管理权限', key: false, rotation: 0 }
];

adminAttrs.forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key, attr.rotation);
    const rectEdge = getRectEdgePoint(adminX - adminW/2, adminY - adminH/2, adminW, adminH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 绘制联盟组织实体
entity(orgX - orgW/2, orgY - orgH/2, orgW, orgH, '联盟组织');

const orgAttrs = [
    { cx: orgX, cy: orgY - 340, rx: 110, ry: 55, text: '组织ID', key: true, rotation: 0 },
    { cx: orgX + 340, cy: orgY - 220, rx: 120, ry: 50, text: '组织名称', key: false, rotation: 0 },
    { cx: orgX + 340, cy: orgY - 90, rx: 120, ry: 50, text: '组织类型', key: false, rotation: 0 },
    { cx: orgX + 340, cy: orgY + 40, rx: 100, ry: 50, text: '域名', key: false, rotation: 0 },
    { cx: orgX + 340, cy: orgY + 170, rx: 120, ry: 50, text: '证书状态', key: false, rotation: 0 },
    { cx: orgX, cy: orgY + 340, rx: 100, ry: 50, text: '状态', key: false, rotation: 0 },
    { cx: orgX - 340, cy: orgY + 170, rx: 120, ry: 50, text: '加入时间', key: false, rotation: 0 },
    { cx: orgX - 340, cy: orgY + 40, rx: 120, ry: 50, text: '联系方式', key: false, rotation: 0 },
    { cx: orgX - 340, cy: orgY - 90, rx: 120, ry: 50, text: '节点数量', key: false, rotation: 0 },
    { cx: orgX - 340, cy: orgY - 220, rx: 120, ry: 50, text: '管理员数', key: false, rotation: 0 }
];

orgAttrs.forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key, attr.rotation);
    const rectEdge = getRectEdgePoint(orgX - orgW/2, orgY - orgH/2, orgW, orgH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 关系：管理员-查看-联盟组织（水平方向）
const relX = 1600, relY = 1200, relW = 280, relH = 160;
relation(relX - relW/2, relY - relH/2, relW, relH, '查看');

const adminToRelStart = getRectEdgePoint(adminX - adminW/2, adminY - adminH/2, adminW, adminH, relX, relY);
const adminToRelEnd = { x: relX - relW/2, y: relY };
line(adminToRelStart.x, adminToRelStart.y, adminToRelEnd.x, adminToRelEnd.y);

const relToOrgStart = { x: relX + relW/2, y: relY };
const relToOrgEnd = getRectEdgePoint(orgX - orgW/2, orgY - orgH/2, orgW, orgH, relX, relY);
line(relToOrgStart.x, relToOrgStart.y, relToOrgEnd.x, relToOrgEnd.y);

label('1', relX - relW/2 - 50, relY, 46, true);
label('n', relX + relW/2 + 50, relY, 46, true);

function save() {
    const scale = 2;
    const temp = document.createElement('canvas');
    temp.width = c.width * scale;
    temp.height = c.height * scale;
    const tg = temp.getContext('2d', { alpha: false });
    tg.imageSmoothingEnabled = false;
    tg.scale(scale, scale);
    tg.drawImage(c, 0, 0);
    const a = document.createElement('a');
    a.download = '管理员查看联盟组织功能ER图.png';
    a.href = temp.toDataURL('image/png', 1.0);
    a.click();
}

async function copy() {
    try {
        const scale = 2;
        const temp = document.createElement('canvas');
        temp.width = c.width * scale;
        temp.height = c.height * scale;
        const tg = temp.getContext('2d', { alpha: false });
        tg.imageSmoothingEnabled = false;
        tg.scale(scale, scale);
        tg.drawImage(c, 0, 0);
        const b = await new Promise(r => temp.toBlob(r, 'image/png', 1.0));
        await navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
        alert('已复制到剪贴板');
    } catch(e) {
        alert('复制失败：' + e.message);
    }
}
</script>
</body>
</html>
