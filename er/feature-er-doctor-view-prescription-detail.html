<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>功能：医生跨院诊疗（ER 图）</title>
  <style>
    body { margin: 20px; background: #f0f0f0; font-family: SimSun, serif; }
    #wrap { background: white; padding: 30px; display: inline-block; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    button { margin: 10px 5px; padding: 8px 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="3600" height="2400"></canvas>
</div>
<div>
<button onclick="save()">下载图片</button>
<button onclick="copy()">复制到剪贴板</button>
<button onclick="window.location.href='./index.html'">返回索引</button>
</div>
<script>
const c = document.getElementById('c');
const g = c.getContext('2d', { alpha: false });
g.imageSmoothingEnabled = false;
g.fillStyle = '#ffffff';
g.fillRect(0, 0, 3600, 2400);

function entity(x, y, w, h, text, isWeak = false) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.fillRect(x, y, w, h);
    g.strokeRect(x, y, w, h);
    if (isWeak) g.strokeRect(x + 10, y + 10, w - 20, h - 20);
    g.fillStyle = '#000';
    g.font = 'normal 60px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x + w/2, y + h/2);
}

function relation(x, y, w, h, text) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(x + w/2, y);
    g.lineTo(x + w, y + h/2);
    g.lineTo(x + w/2, y + h);
    g.lineTo(x, y + h/2);
    g.closePath();
    g.fill();
    g.stroke();
    g.fillStyle = '#000';
    g.font = 'normal 52px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x + w/2, y + h/2);
}

function attribute(x, y, w, h, text, isKey = false) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = isKey ? 4 : 2;
    g.beginPath();
    g.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
    g.fill();
    g.stroke();
    g.fillStyle = '#000';
    g.font = 'normal 42px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    if (isKey) {
        g.fillText(text, x + w/2, y + h/2);
        const tw = g.measureText(text).width;
        g.beginPath();
        g.moveTo(x + w/2 - tw/2, y + h/2 + 20);
        g.lineTo(x + w/2 + tw/2, y + h/2 + 20);
        g.stroke();
    } else {
        g.fillText(text, x + w/2, y + h/2);
    }
}

function line(x1, y1, x2, y2) {
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x2, y2);
    g.stroke();
}

function getRectEdgePoint(rectX, rectY, rectW, rectH, targetX, targetY) {
    const centerX = rectX + rectW / 2, centerY = rectY + rectH / 2;
    const dx = targetX - centerX, dy = targetY - centerY;
    if (dx === 0 && dy === 0) return { x: centerX, y: centerY };
    const angle = Math.atan2(dy, dx), absAngle = Math.abs(angle);
    if (absAngle < Math.atan2(rectH, rectW)) {
        return { x: rectX + rectW, y: centerY + (rectW / 2) * Math.tan(angle) };
    } else if (absAngle > Math.PI - Math.atan2(rectH, rectW)) {
        return { x: rectX, y: centerY - (rectW / 2) * Math.tan(angle) };
    } else if (angle > 0) {
        return { x: centerX + (rectH / 2) / Math.tan(angle), y: rectY + rectH };
    } else {
        return { x: centerX - (rectH / 2) / Math.tan(angle), y: rectY };
    }
}

function getEllipseEdgePoint(cx, cy, rx, ry, targetX, targetY) {
    const dx = targetX - cx, dy = targetY - cy;
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    const angle = Math.atan2(dy, dx);
    return { x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle) };
}

function getDiamondEdgePoint(cx, cy, w, h, targetX, targetY) {
    const dx = targetX - cx, dy = targetY - cy;
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    const angle = Math.atan2(dy, dx);
    const absAngle = Math.abs(angle);
    const halfW = w / 2, halfH = h / 2;
    if (absAngle < Math.atan2(halfH, halfW)) {
        const t = halfW / Math.abs(Math.cos(angle));
        return { x: cx + t * Math.cos(angle), y: cy + t * Math.sin(angle) };
    } else if (absAngle > Math.PI - Math.atan2(halfH, halfW)) {
        const t = halfW / Math.abs(Math.cos(angle));
        return { x: cx + t * Math.cos(angle), y: cy + t * Math.sin(angle) };
    } else {
        const t = halfH / Math.abs(Math.sin(angle));
        return { x: cx + t * Math.cos(angle), y: cy + t * Math.sin(angle) };
    }
}

function label(text, x, y, size = 42, bold = false) {
    g.fillStyle = '#000';
    g.font = (bold ? 'bold ' : 'normal ') + size + 'px SimSun, 宋体, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x, y);
}

label('图 X.X 医生跨院诊疗功能ER图', 1800, 100, 56, true);

// 一条线布局：医生 → 授权请求 → 病历 → 补充记录
// 医生实体（最左）
const userX = 500, userY = 1200, userW = 300, userH = 160;
entity(userX - 150, userY - 80, userW, userH, '医生');
[
    { cx: userX, cy: userY - 350, rx: 90, ry: 45, text: '用户ID', key: true },
    { cx: userX - 250, cy: userY - 280, rx: 80, ry: 40, text: '姓名', key: false },
    { cx: userX - 280, cy: userY - 150, rx: 80, ry: 40, text: '科室', key: false },
    { cx: userX - 300, cy: userY, rx: 80, ry: 40, text: '角色', key: false },
    { cx: userX - 280, cy: userY + 150, rx: 80, ry: 40, text: '组织', key: false },
    { cx: userX, cy: userY + 280, rx: 80, ry: 40, text: '职称', key: false }
].forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key);
    const rectEdge = getRectEdgePoint(userX - 150, userY - 80, userW, userH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 授权请求实体（中左）
const authX = 1200, authY = 1200, authW = 300, authH = 160;
entity(authX - 150, authY - 80, authW, authH, '授权请求');
[
    { cx: authX - 250, cy: authY - 280, rx: 90, ry: 45, text: '记录ID', key: true },
    { cx: authX, cy: authY - 480, rx: 90, ry: 40, text: '申请原因', key: false },
    { cx: authX + 250, cy: authY - 280, rx: 90, ry: 40, text: '申请医生', key: false },
    { cx: authX + 280, cy: authY - 150, rx: 80, ry: 40, text: '状态', key: false },
    { cx: authX - 250, cy: authY + 200, rx: 80, ry: 40, text: '患者ID', key: false },
    { cx: authX, cy: authY + 380, rx: 80, ry: 40, text: '时间', key: false }
].forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key);
    const rectEdge = getRectEdgePoint(authX - 150, authY - 80, authW, authH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 病历实体（中右）
const prescX = 2200, prescY = 1200, prescW = 300, prescH = 160;
entity(prescX - 150, prescY - 80, prescW, prescH, '病历');
[
    { cx: prescX - 250, cy: prescY - 280, rx: 90, ry: 45, text: '病历ID', key: true },
    { cx: prescX, cy: prescY - 480, rx: 90, ry: 40, text: '病历编号', key: false },
    { cx: prescX + 250, cy: prescY - 280, rx: 90, ry: 40, text: '患者姓名', key: false },
    { cx: prescX + 280, cy: prescY - 150, rx: 90, ry: 40, text: '医院名称', key: false },
    { cx: prescX - 250, cy: prescY + 200, rx: 80, ry: 40, text: '医生姓名', key: false },
    { cx: prescX, cy: prescY + 380, rx: 80, ry: 40, text: '诊断', key: false }
].forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key);
    const rectEdge = getRectEdgePoint(prescX - 150, prescY - 80, prescW, prescH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 补充记录实体（最右）
const suppX = 3200, suppY = 1200, suppW = 300, suppH = 160;
entity(suppX - 150, suppY - 80, suppW, suppH, '补充记录', true);
[
    { cx: suppX - 250, cy: suppY - 280, rx: 90, ry: 45, text: '补充ID', key: true },
    { cx: suppX, cy: suppY - 480, rx: 90, ry: 40, text: '创建时间', key: false },
    { cx: suppX + 250, cy: suppY - 280, rx: 90, ry: 40, text: '现病史', key: false },
    { cx: suppX + 280, cy: suppY - 150, rx: 80, ry: 40, text: '诊断', key: false },
    { cx: suppX + 300, cy: suppY, rx: 80, ry: 40, text: '体格检查', key: false },
    { cx: suppX, cy: suppY + 280, rx: 80, ry: 40, text: '医嘱', key: false }
].forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key);
    const rectEdge = getRectEdgePoint(suppX - 150, suppY - 80, suppW, suppH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 关系1：医生-发起-授权请求（水平方向）
const rel1X = 850, rel1Y = 1200, rel1W = 280, rel1H = 160;
relation(rel1X - rel1W/2, rel1Y - rel1H/2, rel1W, rel1H, '发起');

const userToRel1Start = getRectEdgePoint(userX - 150, userY - 80, userW, userH, rel1X, rel1Y);
const userToRel1End = getDiamondEdgePoint(rel1X, rel1Y, rel1W, rel1H, userToRel1Start.x, userToRel1Start.y);
line(userToRel1Start.x, userToRel1Start.y, userToRel1End.x, userToRel1End.y);

const rel1ToAuthStart = getDiamondEdgePoint(rel1X, rel1Y, rel1W, rel1H, authX, authY);
const rel1ToAuthEnd = getRectEdgePoint(authX - 150, authY - 80, authW, authH, rel1X, rel1Y);
line(rel1ToAuthStart.x, rel1ToAuthStart.y, rel1ToAuthEnd.x, rel1ToAuthEnd.y);

label('1', userToRel1End.x + 30, rel1Y - 50, 46, true);
label('1', rel1ToAuthStart.x - 30, rel1Y - 50, 46, true);

// 关系2：授权请求-针对-病历（水平方向）
const rel2X = 1700, rel2Y = 1200, rel2W = 280, rel2H = 160;
relation(rel2X - rel2W/2, rel2Y - rel2H/2, rel2W, rel2H, '针对');

const authToRel2Start = getRectEdgePoint(authX - 150, authY - 80, authW, authH, rel2X, rel2Y);
const authToRel2End = getDiamondEdgePoint(rel2X, rel2Y, rel2W, rel2H, authToRel2Start.x, authToRel2Start.y);
line(authToRel2Start.x, authToRel2Start.y, authToRel2End.x, authToRel2End.y);

const rel2ToPrescStart = getDiamondEdgePoint(rel2X, rel2Y, rel2W, rel2H, prescX, prescY);
const rel2ToPrescEnd = getRectEdgePoint(prescX - 150, prescY - 80, prescW, prescH, rel2X, rel2Y);
line(rel2ToPrescStart.x, rel2ToPrescStart.y, rel2ToPrescEnd.x, rel2ToPrescEnd.y);

label('1', authToRel2End.x + 30, rel2Y - 50, 46, true);
label('1', rel2ToPrescStart.x - 30, rel2Y - 50, 46, true);

// 关系3：病历-包含-补充记录（水平方向）
const rel3X = 2700, rel3Y = 1200, rel3W = 280, rel3H = 160;
relation(rel3X - rel3W/2, rel3Y - rel3H/2, rel3W, rel3H, '包含');

const prescToRel3Start = getRectEdgePoint(prescX - 150, prescY - 80, prescW, prescH, rel3X, rel3Y);
const prescToRel3End = getDiamondEdgePoint(rel3X, rel3Y, rel3W, rel3H, prescToRel3Start.x, prescToRel3Start.y);
line(prescToRel3Start.x, prescToRel3Start.y, prescToRel3End.x, prescToRel3End.y);

const rel3ToSuppStart = getDiamondEdgePoint(rel3X, rel3Y, rel3W, rel3H, suppX, suppY);
const rel3ToSuppEnd = getRectEdgePoint(suppX - 150, suppY - 80, suppW, suppH, rel3X, rel3Y);
line(rel3ToSuppStart.x, rel3ToSuppStart.y, rel3ToSuppEnd.x, rel3ToSuppEnd.y);

label('1', prescToRel3End.x + 30, rel3Y - 50, 46, true);
label('n', rel3ToSuppStart.x - 30, rel3Y - 50, 46, true);

function save() {
    const scale = 2, temp = document.createElement('canvas');
    temp.width = c.width * scale;
    temp.height = c.height * scale;
    const tg = temp.getContext('2d', { alpha: false });
    tg.imageSmoothingEnabled = false;
    tg.scale(scale, scale);
    tg.drawImage(c, 0, 0);
    const a = document.createElement('a');
    a.download = '医生跨院诊疗功能ER图.png';
    a.href = temp.toDataURL('image/png', 1.0);
    a.click();
}

async function copy() {
    try {
        const scale = 2, temp = document.createElement('canvas');
        temp.width = c.width * scale;
        temp.height = c.height * scale;
        const tg = temp.getContext('2d', { alpha: false });
        tg.imageSmoothingEnabled = false;
        tg.scale(scale, scale);
        tg.drawImage(c, 0, 0);
        const b = await new Promise(r => temp.toBlob(r, 'image/png', 1.0));
        await navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
        alert('已复制到剪贴板');
    } catch(e) {
        alert('复制失败：' + e.message);
    }
}
</script>
</body>
</html>
