<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ER图文档导航</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Microsoft YaHei', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .nav-container {
      background: white;
      border-radius: 20px;
      padding: 50px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 40px;
      font-size: 32px;
    }
    .nav-grid {
      display: grid;
      gap: 15px;
    }
    .nav-btn {
      display: block;
      padding: 20px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 500;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    .nav-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    .nav-btn::before {
      content: attr(data-icon);
      margin-right: 10px;
      font-size: 24px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-top: 30px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="nav-container">
    <h1>🏥 ER图文档导航</h1>
    <div class="nav-grid">
      <a href="./index.html" class="nav-btn" data-icon="📖">可视化索引页面</a>
      <a href="./entity-er-viewer.html" class="nav-btn" data-icon="🔍">交互式实体查看器</a>
      <a href="./README.md" class="nav-btn" data-icon="📚">文档说明</a>
      <a href="./使用指南.md" class="nav-btn" data-icon="📝">使用指南</a>
    </div>
    <p class="subtitle">医疗信息管理系统 ER 图文档 v1.0</p>
  </div>
</body>
</html>
