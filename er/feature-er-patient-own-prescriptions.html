<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>功能：患者查看病情信息（ER 图）</title>
  <style>
    body { margin: 20px; background: #f0f0f0; font-family: SimSun, serif; }
    #wrap { background: white; padding: 30px; display: inline-block; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    button { margin: 10px 5px; padding: 8px 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="4200" height="2600"></canvas>
</div>
<div>
<button onclick="save()">下载图片</button>
<button onclick="copy()">复制到剪贴板</button>
<button onclick="window.location.href='./index.html'">返回索引</button>
</div>
<script>
const c = document.getElementById('c');
const g = c.getContext('2d', { alpha: false });
g.imageSmoothingEnabled = false;
g.fillStyle = '#ffffff';
g.fillRect(0, 0, 4200, 2600);

function entity(x, y, w, h, text) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.fillRect(x, y, w, h);
    g.strokeRect(x, y, w, h);
    g.fillStyle = '#000';
    g.font = 'normal 60px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x + w/2, y + h/2);
}

function relation(x, y, w, h, text) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(x + w/2, y);
    g.lineTo(x + w, y + h/2);
    g.lineTo(x + w/2, y + h);
    g.lineTo(x, y + h/2);
    g.closePath();
    g.fill();
    g.stroke();
    g.fillStyle = '#000';
    g.font = 'normal 52px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x + w/2, y + h/2);
}

function relationRotated(x, y, w, h, text) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.save();
    g.translate(x + w/2, y + h/2);
    g.rotate(Math.PI / 4 - Math.PI / 18); // 45度 - 10度 = 35度
    g.beginPath();
    g.moveTo(0, -h/2);
    g.lineTo(w/2, 0);
    g.lineTo(0, h/2);
    g.lineTo(-w/2, 0);
    g.closePath();
    g.fill();
    g.stroke();
    g.fillStyle = '#000';
    g.font = 'normal 52px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, 0, 0);
    g.restore();
}

function attribute(x, y, w, h, text, isKey = false) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = isKey ? 4 : 2;
    g.beginPath();
    g.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
    g.fill();
    g.stroke();
    g.fillStyle = '#000';
    g.font = 'normal 42px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    if (isKey) {
        g.fillText(text, x + w/2, y + h/2);
        const tw = g.measureText(text).width;
        g.beginPath();
        g.moveTo(x + w/2 - tw/2, y + h/2 + 20);
        g.lineTo(x + w/2 + tw/2, y + h/2 + 20);
        g.stroke();
    } else {
        g.fillText(text, x + w/2, y + h/2);
    }
}

function line(x1, y1, x2, y2) {
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x2, y2);
    g.stroke();
}

function getRectEdgePoint(rectX, rectY, rectW, rectH, targetX, targetY) {
    const centerX = rectX + rectW / 2, centerY = rectY + rectH / 2;
    const dx = targetX - centerX, dy = targetY - centerY;
    if (dx === 0 && dy === 0) return { x: centerX, y: centerY };
    const angle = Math.atan2(dy, dx), absAngle = Math.abs(angle);
    if (absAngle < Math.atan2(rectH, rectW)) {
        return { x: rectX + rectW, y: centerY + (rectW / 2) * Math.tan(angle) };
    } else if (absAngle > Math.PI - Math.atan2(rectH, rectW)) {
        return { x: rectX, y: centerY - (rectW / 2) * Math.tan(angle) };
    } else if (angle > 0) {
        return { x: centerX + (rectH / 2) / Math.tan(angle), y: rectY + rectH };
    } else {
        return { x: centerX - (rectH / 2) / Math.tan(angle), y: rectY };
    }
}

function getEllipseEdgePoint(cx, cy, rx, ry, targetX, targetY) {
    const dx = targetX - cx, dy = targetY - cy;
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    const angle = Math.atan2(dy, dx);
    return { x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle) };
}

function getDiamondEdgePoint(cx, cy, w, h, targetX, targetY) {
    const dx = targetX - cx, dy = targetY - cy;
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    const angle = Math.atan2(dy, dx);
    const absAngle = Math.abs(angle);
    const halfW = w / 2, halfH = h / 2;
    if (absAngle < Math.atan2(halfH, halfW)) {
        const t = halfW / Math.abs(Math.cos(angle));
        return { x: cx + t * Math.cos(angle), y: cy + t * Math.sin(angle) };
    } else if (absAngle > Math.PI - Math.atan2(halfH, halfW)) {
        const t = halfW / Math.abs(Math.cos(angle));
        return { x: cx + t * Math.cos(angle), y: cy + t * Math.sin(angle) };
    } else {
        const t = halfH / Math.abs(Math.sin(angle));
        return { x: cx + t * Math.cos(angle), y: cy + t * Math.sin(angle) };
    }
}

function getDiamondEdgePointRotated(cx, cy, w, h, targetX, targetY) {
    const dx = targetX - cx, dy = targetY - cy;
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    // 旋转35度后（45度 - 10度），菱形的边界计算需要调整
    const angle = Math.atan2(dy, dx);
    const rotatedAngle = angle - (Math.PI / 4 - Math.PI / 18); // 补偿35度旋转
    const absRotatedAngle = Math.abs(rotatedAngle);
    const halfW = w / 2, halfH = h / 2;
    
    // 计算旋转后菱形边界
    if (absRotatedAngle < Math.atan2(halfH, halfW)) {
        const t = halfW / Math.abs(Math.cos(rotatedAngle));
        return { x: cx + t * Math.cos(angle), y: cy + t * Math.sin(angle) };
    } else if (absRotatedAngle > Math.PI - Math.atan2(halfH, halfW)) {
        const t = halfW / Math.abs(Math.cos(rotatedAngle));
        return { x: cx + t * Math.cos(angle), y: cy + t * Math.sin(angle) };
    } else {
        const t = halfH / Math.abs(Math.sin(rotatedAngle));
        return { x: cx + t * Math.cos(angle), y: cy + t * Math.sin(angle) };
    }
}

function label(text, x, y, size = 42, bold = false) {
    g.fillStyle = '#000';
    g.font = (bold ? 'bold ' : 'normal ') + size + 'px SimSun, 宋体, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x, y);
}

label('图 X.X 患者查看病情信息功能ER图', 2100, 100, 56, true);

// T形布局：上面一排3个实体（患者、病历、授权请求），下面中间1个（药品订单）
// 上排左：患者实体
const userX = 800, userY = 800, userW = 300, userH = 160;
entity(userX - 150, userY - 80, userW, userH, '患者');
[
    { cx: userX, cy: userY - 350, rx: 90, ry: 45, text: '用户ID', key: true },
    { cx: userX - 280, cy: userY - 250, rx: 100, ry: 40, text: '区块链ID', key: false },
    { cx: userX - 300, cy: userY - 100, rx: 80, ry: 40, text: '姓名', key: false },
    { cx: userX - 300, cy: userY + 50, rx: 80, ry: 40, text: '角色', key: false },
    { cx: userX - 300, cy: userY + 180, rx: 80, ry: 40, text: '性别', key: false }
].forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key);
    const rectEdge = getRectEdgePoint(userX - 150, userY - 80, userW, userH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 上排中：病历实体
const prescX = 2100, prescY = 800, prescW = 300, prescH = 160;
entity(prescX - 150, prescY - 80, prescW, prescH, '病历');
[
    { cx: prescX, cy: prescY - 350, rx: 90, ry: 45, text: '病历ID', key: true },
    { cx: prescX + 300, cy: prescY - 250, rx: 90, ry: 40, text: '病历编号', key: false },
    { cx: prescX + 330, cy: prescY - 120, rx: 80, ry: 40, text: '主诉', key: false },
    { cx: prescX + 330, cy: prescY, rx: 90, ry: 40, text: '现病史', key: false },
    { cx: prescX + 330, cy: prescY + 120, rx: 90, ry: 40, text: '体格检查', key: false },
    { cx: prescX, cy: prescY + 280, rx: 80, ry: 40, text: '诊断', key: false },
    { cx: prescX, cy: prescY + 380, rx: 80, ry: 40, text: '医嘱', key: false },
    { cx: prescX - 300, cy: prescY + 250, rx: 90, ry: 40, text: '医生姓名', key: false },
    { cx: prescX - 330, cy: prescY + 120, rx: 90, ry: 40, text: '医院名称', key: false },
    { cx: prescX - 330, cy: prescY, rx: 80, ry: 40, text: '科室', key: false },
    { cx: prescX - 330, cy: prescY - 120, rx: 90, ry: 40, text: '患者姓名', key: false }
].forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key);
    const rectEdge = getRectEdgePoint(prescX - 150, prescY - 80, prescW, prescH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 上排右：授权请求实体
const authX = 3400, authY = 800, authW = 300, authH = 160;
entity(authX - 150, authY - 80, authW, authH, '授权请求');
[
    { cx: authX, cy: authY - 350, rx: 90, ry: 45, text: '记录ID', key: true },
    { cx: authX + 300, cy: authY - 200, rx: 90, ry: 40, text: '申请医生', key: false },
    { cx: authX + 300, cy: authY - 50, rx: 80, ry: 40, text: '申请时间', key: false },
    { cx: authX + 300, cy: authY + 100, rx: 80, ry: 40, text: '状态', key: false },
    { cx: authX, cy: authY + 280, rx: 90, ry: 40, text: '申请理由', key: false }
].forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key);
    const rectEdge = getRectEdgePoint(authX - 150, authY - 80, authW, authH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 下方中间：药品订单实体
const orderX = 2100, orderY = 1800, orderW = 300, orderH = 160;
entity(orderX - 150, orderY - 80, orderW, orderH, '药品订单');
[
    { cx: orderX, cy: orderY - 350, rx: 90, ry: 45, text: '订单ID', key: true },
    { cx: orderX + 300, cy: orderY - 200, rx: 90, ry: 40, text: '药品名称', key: false },
    { cx: orderX + 300, cy: orderY - 50, rx: 80, ry: 40, text: '数量', key: false },
    { cx: orderX - 300, cy: orderY - 100, rx: 90, ry: 40, text: '药店名称', key: false },
    { cx: orderX, cy: orderY + 280, rx: 80, ry: 40, text: '状态', key: false }
].forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key);
    const rectEdge = getRectEdgePoint(orderX - 150, orderY - 80, orderW, orderH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 关系1：患者-查看-病历（水平方向）
const rel1X = 1450, rel1Y = 800, rel1W = 280, rel1H = 160;
relation(rel1X - rel1W/2, rel1Y - rel1H/2, rel1W, rel1H, '查看');

const userToRel1Start = getRectEdgePoint(userX - 150, userY - 80, userW, userH, rel1X, rel1Y);
const userToRel1End = getDiamondEdgePoint(rel1X, rel1Y, rel1W, rel1H, userToRel1Start.x, userToRel1Start.y);
line(userToRel1Start.x, userToRel1Start.y, userToRel1End.x, userToRel1End.y);

const rel1ToPrescStart = getDiamondEdgePoint(rel1X, rel1Y, rel1W, rel1H, prescX, prescY);
const rel1ToPrescEnd = getRectEdgePoint(prescX - 150, prescY - 80, prescW, prescH, rel1X, rel1Y);
line(rel1ToPrescStart.x, rel1ToPrescStart.y, rel1ToPrescEnd.x, rel1ToPrescEnd.y);

label('1', userToRel1End.x + 30, rel1Y - 50, 46, true);
label('n', rel1ToPrescStart.x - 30, rel1Y - 50, 46, true);

// 关系2：病历-关联-授权请求（水平方向）
const rel2X = 2750, rel2Y = 800, rel2W = 280, rel2H = 160;
relation(rel2X - rel2W/2, rel2Y - rel2H/2, rel2W, rel2H, '关联');

const prescToRel2Start = getRectEdgePoint(prescX - 150, prescY - 80, prescW, prescH, rel2X, rel2Y);
const prescToRel2End = getDiamondEdgePoint(rel2X, rel2Y, rel2W, rel2H, prescToRel2Start.x, prescToRel2Start.y);
line(prescToRel2Start.x, prescToRel2Start.y, prescToRel2End.x, prescToRel2End.y);

const rel2ToAuthStart = getDiamondEdgePoint(rel2X, rel2Y, rel2W, rel2H, authX, authY);
const rel2ToAuthEnd = getRectEdgePoint(authX - 150, authY - 80, authW, authH, rel2X, rel2Y);
line(rel2ToAuthStart.x, rel2ToAuthStart.y, rel2ToAuthEnd.x, rel2ToAuthEnd.y);

label('1', prescToRel2End.x + 30, rel2Y - 50, 46, true);
label('n', rel2ToAuthStart.x - 30, rel2Y - 50, 46, true);

// 关系3：病历-包含-药品订单（垂直方向）
const rel3X = 2100, rel3Y = 1300, rel3W = 280, rel3H = 160;
relation(rel3X - rel3W/2, rel3Y - rel3H/2, rel3W, rel3H, '包含');

const prescToRel3Start = getRectEdgePoint(prescX - 150, prescY - 80, prescW, prescH, rel3X, rel3Y);
const prescToRel3End = getDiamondEdgePoint(rel3X, rel3Y, rel3W, rel3H, prescToRel3Start.x, prescToRel3Start.y);
line(prescToRel3Start.x, prescToRel3Start.y, prescToRel3End.x, prescToRel3End.y);

const rel3ToOrderStart = getDiamondEdgePoint(rel3X, rel3Y, rel3W, rel3H, orderX, orderY);
const rel3ToOrderEnd = getRectEdgePoint(orderX - 150, orderY - 80, orderW, orderH, rel3X, rel3Y);
line(rel3ToOrderStart.x, rel3ToOrderStart.y, rel3ToOrderEnd.x, rel3ToOrderEnd.y);

label('1', rel3X + 80, prescToRel3End.y + 30, 46, true);
label('n', rel3X + 80, rel3ToOrderStart.y - 30, 46, true);

function save() {
    const scale = 2, temp = document.createElement('canvas');
    temp.width = c.width * scale;
    temp.height = c.height * scale;
    const tg = temp.getContext('2d', { alpha: false });
    tg.imageSmoothingEnabled = false;
    tg.scale(scale, scale);
    tg.drawImage(c, 0, 0);
    const a = document.createElement('a');
    a.download = '患者查看病情信息功能ER图.png';
    a.href = temp.toDataURL('image/png', 1.0);
    a.click();
}

async function copy() {
    try {
        const scale = 2, temp = document.createElement('canvas');
        temp.width = c.width * scale;
        temp.height = c.height * scale;
        const tg = temp.getContext('2d', { alpha: false });
        tg.imageSmoothingEnabled = false;
        tg.scale(scale, scale);
        tg.drawImage(c, 0, 0);
        const b = await new Promise(r => temp.toBlob(r, 'image/png', 1.0));
        await navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
        alert('已复制到剪贴板');
    } catch(e) {
        alert('复制失败：' + e.message);
    }
}
</script>
</body>
</html>
