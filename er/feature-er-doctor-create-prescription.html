<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>功能：医生创建病历（ER 图）</title>
  <style>
    body { margin: 20px; background: #f0f0f0; font-family: SimSun, serif; }
    #wrap { background: white; padding: 30px; display: inline-block; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    button { margin: 10px 5px; padding: 8px 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="3200" height="2400"></canvas>
</div>
<div>
<button onclick="save()">下载图片</button>
<button onclick="copy()">复制到剪贴板</button>
<button onclick="window.location.href='./index.html'">返回索引</button>
</div>
<script>
// ========== 初始化Canvas ==========
const c = document.getElementById('c');
const g = c.getContext('2d', { alpha: false });
g.imageSmoothingEnabled = false;
g.fillStyle = '#ffffff';
g.fillRect(0, 0, 3200, 2400);

// ========== 绘图函数 ==========
// 绘制矩形实体
function entity(x, y, w, h, text) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.fillRect(x, y, w, h);
    g.strokeRect(x, y, w, h);
    g.fillStyle = '#000';
    g.font = 'normal 60px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x + w/2, y + h/2);
}

// 绘制菱形关系
function relation(x, y, w, h, text) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(x + w/2, y);
    g.lineTo(x + w, y + h/2);
    g.lineTo(x + w/2, y + h);
    g.lineTo(x, y + h/2);
    g.closePath();
    g.fill();
    g.stroke();
    g.fillStyle = '#000';
    g.font = 'normal 52px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x + w/2, y + h/2);
}

// 绘制椭圆属性
function attribute(x, y, w, h, text, isKey = false, rotation = 0) {
    g.save(); // 保存当前状态
    
    // 如果有旋转角度，先移动到椭圆中心，旋转，再绘制
    if (rotation !== 0) {
        g.translate(x + w/2, y + h/2);
        g.rotate(rotation * Math.PI / 180);
        g.translate(-(x + w/2), -(y + h/2));
    }
    
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = isKey ? 4 : 2;
    g.beginPath();
    g.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
    g.fill();
    g.stroke();
    g.fillStyle = '#000';
    g.font = 'normal 42px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    if (isKey) {
        g.fillText(text, x + w/2, y + h/2);
        const tw = g.measureText(text).width;
        g.beginPath();
        g.moveTo(x + w/2 - tw/2, y + h/2 + 20);
        g.lineTo(x + w/2 + tw/2, y + h/2 + 20);
        g.stroke();
    } else {
        g.fillText(text, x + w/2, y + h/2);
    }
    
    g.restore(); // 恢复状态
}

// 绘制连接线
function line(x1, y1, x2, y2) {
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x2, y2);
    g.stroke();
}

// 绘制文本标签
function label(text, x, y, size = 42, bold = false) {
    g.fillStyle = '#000';
    g.font = (bold ? 'bold ' : 'normal ') + size + 'px SimSun';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x, y);
}

// ========== 边缘计算函数 ==========
// 计算矩形边缘点
function getRectEdgePoint(rectX, rectY, rectW, rectH, targetX, targetY) {
    const centerX = rectX + rectW / 2;
    const centerY = rectY + rectH / 2;
    const dx = targetX - centerX;
    const dy = targetY - centerY;
    
    if (dx === 0 && dy === 0) return { x: centerX, y: centerY };
    
    const angle = Math.atan2(dy, dx);
    const absAngle = Math.abs(angle);
    
    if (absAngle < Math.atan2(rectH, rectW)) {
        return { x: rectX + rectW, y: centerY + (rectW / 2) * Math.tan(angle) };
    } else if (absAngle > Math.PI - Math.atan2(rectH, rectW)) {
        return { x: rectX, y: centerY - (rectW / 2) * Math.tan(angle) };
    } else if (angle > 0) {
        return { x: centerX + (rectH / 2) / Math.tan(angle), y: rectY + rectH };
    } else {
        return { x: centerX - (rectH / 2) / Math.tan(angle), y: rectY };
    }
}

// 计算椭圆边缘点
function getEllipseEdgePoint(cx, cy, rx, ry, targetX, targetY) {
    const dx = targetX - cx;
    const dy = targetY - cy;
    
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    
    const angle = Math.atan2(dy, dx);
    return {
        x: cx + rx * Math.cos(angle),
        y: cy + ry * Math.sin(angle)
    };
}

// 计算菱形边缘点
function getDiamondEdgePoint(cx, cy, w, h, targetX, targetY) {
    const dx = targetX - cx;
    const dy = targetY - cy;
    
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    
    const angle = Math.atan2(dy, dx);
    const absAngle = Math.abs(angle);
    const halfW = w / 2;
    const halfH = h / 2;
    
    if (absAngle < Math.atan2(halfH, halfW)) {
        const t = halfW / Math.abs(Math.cos(angle));
        return { x: cx + t * Math.cos(angle), y: cy + t * Math.sin(angle) };
    } else if (absAngle > Math.PI - Math.atan2(halfH, halfW)) {
        const t = halfW / Math.abs(Math.cos(angle));
        return { x: cx + t * Math.cos(angle), y: cy + t * Math.sin(angle) };
    } else {
        const t = halfH / Math.abs(Math.sin(angle));
        return { x: cx + t * Math.cos(angle), y: cy + t * Math.sin(angle) };
    }
}

// ========== 绘制ER图 ==========
// 标题
label('图 X.X 医生创建病历功能ER图', 1600, 100, 56, true);

// 水平布局：医生 → 创建 → 病历
const userX = 500, userY = 1200, userW = 300, userH = 160;
const prescX = 2600, prescY = 1200, prescW = 300, prescH = 160;
const relX = 1200, relY = 1200, relW = 280, relH = 160;

// 绘制左侧：用户实体（医生）
entity(userX - userW/2, userY - userH/2, userW, userH, '医生');

// 用户属性
const userAttrs = [
    { cx: userX, cy: userY - 350, rx: 90, ry: 45, text: '用户ID', key: true },
    { cx: userX - 270, cy: userY - 260, rx: 80, ry: 40, text: '姓名', key: false },
    { cx: userX - 320, cy: userY - 110, rx: 80, ry: 40, text: '角色', key: false },
    { cx: userX - 320, cy: userY + 40, rx: 80, ry: 40, text: '组织', key: false },
    { cx: userX - 260, cy: userY + 190, rx: 90, ry: 40, text: '医生职称', key: false },
    { cx: userX, cy: userY + 260, rx: 90, ry: 40, text: '执业证号', key: false }
];

userAttrs.forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key);
    const rectEdge = getRectEdgePoint(userX - userW/2, userY - userH/2, userW, userH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 绘制右侧：病历实体
entity(prescX - prescW/2, prescY - prescH/2, prescW, prescH, '病历');

// 病历属性（核心版）
const prescAttrs = [
    { cx: prescX, cy: prescY - 350, rx: 90, ry: 45, text: '病历ID', key: true, rotation: 0 },
    { cx: prescX + 340, cy: prescY - 310, rx: 90, ry: 40, text: '病历编号', key: false, rotation: 0 },
    { cx: prescX + 390, cy: prescY - 160, rx: 90, ry: 40, text: '患者姓名', key: false, rotation: 0 },
    { cx: prescX + 400, cy: prescY - 10, rx: 80, ry: 40, text: '主诉', key: false, rotation: 0 },
    { cx: prescX + 400, cy: prescY + 140, rx: 80, ry: 40, text: '现病史', key: false, rotation: 0 },
    { cx: prescX + 370, cy: prescY + 290, rx: 90, ry: 40, text: '体格检查', key: false, rotation: 0 },
    { cx: prescX + 200, cy: prescY + 310, rx: 80, ry: 40, text: '诊断', key: false, rotation: 0 },
    { cx: prescX - 40, cy: prescY + 310, rx: 80, ry: 40, text: '医嘱', key: false, rotation: 0 },
    { cx: prescX - 210, cy: prescY + 290, rx: 90, ry: 40, text: '创建时间', key: false, rotation: 0 },
    { cx: prescX - 270, cy: prescY + 140, rx: 80, ry: 40, text: '医生ID', key: false, rotation: 0 },
    { cx: prescX - 340, cy: prescY - 85, rx: 80, ry: 40, text: '组织ID', key: false, rotation: 15 },
    { cx: prescX - 270, cy: prescY - 160, rx: 80, ry: 40, text: '状态', key: false, rotation: 15 }
];

prescAttrs.forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key, attr.rotation);
    const rectEdge = getRectEdgePoint(prescX - prescW/2, prescY - prescH/2, prescW, prescH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 绘制中间：创建关系（水平方向）
relation(relX - relW/2, relY - relH/2, relW, relH, '创建');

// 医生到关系：连接到菱形左角
const userToRelStart = getRectEdgePoint(userX - userW/2, userY - userH/2, userW, userH, relX, relY);
const userToRelEnd = { x: relX - relW/2, y: relY }; // 菱形左角
line(userToRelStart.x, userToRelStart.y, userToRelEnd.x, userToRelEnd.y);

// 关系到病历：连接到菱形右角
const relToPrescStart = { x: relX + relW/2, y: relY }; // 菱形右角
const relToPrescEnd = getRectEdgePoint(prescX - prescW/2, prescY - prescH/2, prescW, prescH, relX, relY);
line(relToPrescStart.x, relToPrescStart.y, relToPrescEnd.x, relToPrescEnd.y);

// 基数标注（放在连接线中点）
const userMidX = (userToRelStart.x + userToRelEnd.x) / 2;
const userMidY = (userToRelStart.y + userToRelEnd.y) / 2;
label('1', userMidX, userMidY - 30, 46, true);

const prescMidX = (relToPrescStart.x + relToPrescEnd.x) / 2;
const prescMidY = (relToPrescStart.y + relToPrescEnd.y) / 2;
label('n', prescMidX, prescMidY - 30, 46, true);



// ========== 导出功能 ==========
function save() {
    const scale = 2;
    const temp = document.createElement('canvas');
    temp.width = c.width * scale;
    temp.height = c.height * scale;
    const tg = temp.getContext('2d', { alpha: false });
    tg.imageSmoothingEnabled = false;
    tg.scale(scale, scale);
    tg.drawImage(c, 0, 0);
    const a = document.createElement('a');
    a.download = '医生创建病历功能ER图.png';
    a.href = temp.toDataURL('image/png', 1.0);
    a.click();
}

async function copy() {
    try {
        const scale = 2;
        const temp = document.createElement('canvas');
        temp.width = c.width * scale;
        temp.height = c.height * scale;
        const tg = temp.getContext('2d', { alpha: false });
        tg.imageSmoothingEnabled = false;
        tg.scale(scale, scale);
        tg.drawImage(c, 0, 0);
        const b = await new Promise(r => temp.toBlob(r, 'image/png', 1.0));
        await navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
        alert('已复制到剪贴板');
    } catch(e) {
        alert('复制失败：' + e.message);
    }
}
</script>
</body>
</html>
