<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>功能：药店查看和处理订单（ER 图）</title>
  <style>
    body { margin: 20px; background: #f0f0f0; font-family: SimSun, serif; }
    #wrap { background: white; padding: 30px; display: inline-block; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    button { margin: 10px 5px; padding: 8px 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="3800" height="2400"></canvas>
</div>
<div>
<button onclick="save()">下载图片</button>
<button onclick="copy()">复制到剪贴板</button>
<button onclick="window.location.href='./index.html'">返回索引</button>
</div>
<script>
const c = document.getElementById('c');
const g = c.getContext('2d', { alpha: false });
g.imageSmoothingEnabled = false;
g.fillStyle = '#ffffff';
g.fillRect(0, 0, 3800, 2400);

function entity(x, y, w, h, text) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.fillRect(x, y, w, h);
    g.strokeRect(x, y, w, h);
    g.fillStyle = '#000';
    g.font = 'normal 60px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x + w/2, y + h/2);
}

function relation(x, y, w, h, text) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(x + w/2, y);
    g.lineTo(x + w, y + h/2);
    g.lineTo(x + w/2, y + h);
    g.lineTo(x, y + h/2);
    g.closePath();
    g.fill();
    g.stroke();
    g.fillStyle = '#000';
    g.font = 'normal 52px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x + w/2, y + h/2);
}

function attribute(x, y, w, h, text, isKey = false) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = isKey ? 4 : 2;
    g.beginPath();
    g.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
    g.fill();
    g.stroke();
    g.fillStyle = '#000';
    g.font = 'normal 42px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    if (isKey) {
        g.fillText(text, x + w/2, y + h/2);
        const tw = g.measureText(text).width;
        g.beginPath();
        g.moveTo(x + w/2 - tw/2, y + h/2 + 20);
        g.lineTo(x + w/2 + tw/2, y + h/2 + 20);
        g.stroke();
    } else {
        g.fillText(text, x + w/2, y + h/2);
    }
}

function line(x1, y1, x2, y2) {
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x2, y2);
    g.stroke();
}

function getRectEdgePoint(rectX, rectY, rectW, rectH, targetX, targetY) {
    const centerX = rectX + rectW / 2, centerY = rectY + rectH / 2;
    const dx = targetX - centerX, dy = targetY - centerY;
    if (dx === 0 && dy === 0) return { x: centerX, y: centerY };
    const angle = Math.atan2(dy, dx), absAngle = Math.abs(angle);
    if (absAngle < Math.atan2(rectH, rectW)) {
        return { x: rectX + rectW, y: centerY + (rectW / 2) * Math.tan(angle) };
    } else if (absAngle > Math.PI - Math.atan2(rectH, rectW)) {
        return { x: rectX, y: centerY - (rectW / 2) * Math.tan(angle) };
    } else if (angle > 0) {
        return { x: centerX + (rectH / 2) / Math.tan(angle), y: rectY + rectH };
    } else {
        return { x: centerX - (rectH / 2) / Math.tan(angle), y: rectY };
    }
}

function getEllipseEdgePoint(cx, cy, rx, ry, targetX, targetY) {
    const dx = targetX - cx, dy = targetY - cy;
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    const angle = Math.atan2(dy, dx);
    return { x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle) };
}

function label(text, x, y, size = 50, bold = false) {
    g.fillStyle = '#000';
    g.font = (bold ? 'bold ' : 'normal ') + size + 'px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x, y);
}

label('图 X.X 药店查看和处理订单功能ER图', 1900, 100, 64, true);

// 左中右水平布局：药店在左，药品订单在中，病历在右（距离拉开）
const pharmacyX = 500, pharmacyY = 1200, pharmacyW = 300, pharmacyH = 160;
entity(pharmacyX - 150, pharmacyY - 80, pharmacyW, pharmacyH, '药店');
[
    { cx: pharmacyX, cy: pharmacyY - 300, rx: 90, ry: 45, text: '用户ID', key: true },
    { cx: pharmacyX - 150, cy: pharmacyY - 280, rx: 100, ry: 40, text: '区块链ID', key: false },
    { cx: pharmacyX - 350, cy: pharmacyY - 180, rx: 90, ry: 40, text: '药店名称', key: false },
    { cx: pharmacyX - 350, cy: pharmacyY + 50, rx: 80, ry: 40, text: '角色', key: false },
    { cx: pharmacyX - 150, cy: pharmacyY + 280, rx: 80, ry: 40, text: '电话', key: false }
].forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key);
    const rectEdge = getRectEdgePoint(pharmacyX - 150, pharmacyY - 80, pharmacyW, pharmacyH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 中间：药品订单实体（属性避开左右连接区域）
const orderX = 1800, orderY = 1200, orderW = 300, orderH = 160;
entity(orderX - 150, orderY - 80, orderW, orderH, '药品订单');
[
    { cx: orderX, cy: orderY - 350, rx: 90, ry: 45, text: '订单ID', key: true },
    { cx: orderX - 150, cy: orderY - 280, rx: 90, ry: 40, text: '药品名称', key: false },
    { cx: orderX + 150, cy: orderY - 280, rx: 80, ry: 40, text: '数量', key: false },
    { cx: orderX - 150, cy: orderY + 280, rx: 80, ry: 40, text: '价格', key: false },
    { cx: orderX + 150, cy: orderY + 280, rx: 80, ry: 40, text: '状态', key: false },
    { cx: orderX, cy: orderY + 350, rx: 90, ry: 40, text: '患者姓名', key: false },
    { cx: orderX + 280, cy: orderY + 180, rx: 90, ry: 40, text: '药店名称', key: false },
    { cx: orderX - 280, cy: orderY - 180, rx: 90, ry: 40, text: '患者ID', key: false },
    { cx: orderX - 280, cy: orderY + 180, rx: 90, ry: 40, text: '药店ID', key: false },
    { cx: orderX + 280, cy: orderY - 180, rx: 90, ry: 40, text: '处方ID', key: false }
].forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key);
    const rectEdge = getRectEdgePoint(orderX - 150, orderY - 80, orderW, orderH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 右侧：病历实体（属性避开左侧连接区域）
const prescX = 3100, prescY = 1200, prescW = 300, prescH = 160;
entity(prescX - 150, prescY - 80, prescW, prescH, '病历');
[
    { cx: prescX - 280, cy: prescY - 250, rx: 90, ry: 45, text: '病历ID', key: true },
    { cx: prescX - 150, cy: prescY - 280, rx: 90, ry: 40, text: '病历编号', key: false },
    { cx: prescX + 340, cy: prescY - 250, rx: 110, ry: 40, text: '药品订单信息', key: false },
    { cx: prescX + 340, cy: prescY - 150, rx: 90, ry: 40, text: '处方药品', key: false },
    { cx: prescX + 340, cy: prescY - 50, rx: 80, ry: 40, text: '诊断', key: false },
    { cx: prescX + 340, cy: prescY + 50, rx: 80, ry: 40, text: '医嘱', key: false },
    { cx: prescX + 340, cy: prescY + 150, rx: 90, ry: 40, text: '医生姓名', key: false },
    { cx: prescX, cy: prescY - 350, rx: 90, ry: 40, text: '患者姓名', key: false },
    { cx: prescX + 150, cy: prescY + 280, rx: 90, ry: 40, text: '医院名称', key: false },
    { cx: prescX - 150, cy: prescY + 280, rx: 90, ry: 40, text: '创建时间', key: false }
].forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key);
    const rectEdge = getRectEdgePoint(prescX - 150, prescY - 80, prescW, prescH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 关系1：药店-处理-药品订单（水平方向）
const rel1X = 1150, rel1Y = 1200, rel1W = 280, rel1H = 160;
relation(rel1X - rel1W/2, rel1Y - rel1H/2, rel1W, rel1H, '处理');

const pharmacyToRel1Start = getRectEdgePoint(pharmacyX - 150, pharmacyY - 80, pharmacyW, pharmacyH, rel1X, rel1Y);
const pharmacyToRel1End = { x: rel1X - rel1W/2, y: rel1Y };
line(pharmacyToRel1Start.x, pharmacyToRel1Start.y, pharmacyToRel1End.x, pharmacyToRel1End.y);

const rel1ToOrderStart = { x: rel1X + rel1W/2, y: rel1Y };
const rel1ToOrderEnd = getRectEdgePoint(orderX - 150, orderY - 80, orderW, orderH, rel1X, rel1Y);
line(rel1ToOrderStart.x, rel1ToOrderStart.y, rel1ToOrderEnd.x, rel1ToOrderEnd.y);

label('1', rel1X - rel1W/2 - 60, rel1Y - 40, 54, true);
label('n', rel1X + rel1W/2 + 60, rel1Y - 40, 54, true);

// 关系2：药品订单-基于-病历（水平方向）
const rel2X = 2450, rel2Y = 1200, rel2W = 280, rel2H = 160;
relation(rel2X - rel2W/2, rel2Y - rel2H/2, rel2W, rel2H, '基于');

const orderToRel2Start = getRectEdgePoint(orderX - 150, orderY - 80, orderW, orderH, rel2X, rel2Y);
const orderToRel2End = { x: rel2X - rel2W/2, y: rel2Y };
line(orderToRel2Start.x, orderToRel2Start.y, orderToRel2End.x, orderToRel2End.y);

const rel2ToPrescStart = { x: rel2X + rel2W/2, y: rel2Y };
const rel2ToPrescEnd = getRectEdgePoint(prescX - 150, prescY - 80, prescW, prescH, rel2X, rel2Y);
line(rel2ToPrescStart.x, rel2ToPrescStart.y, rel2ToPrescEnd.x, rel2ToPrescEnd.y);

label('n', rel2X - rel2W/2 - 60, rel2Y - 40, 54, true);
label('1', rel2X + rel2W/2 + 60, rel2Y - 40, 54, true);

function save() {
    const scale = 2, temp = document.createElement('canvas');
    temp.width = c.width * scale;
    temp.height = c.height * scale;
    const tg = temp.getContext('2d', { alpha: false });
    tg.imageSmoothingEnabled = false;
    tg.scale(scale, scale);
    tg.drawImage(c, 0, 0);
    const a = document.createElement('a');
    a.download = '药店查看和处理订单功能ER图.png';
    a.href = temp.toDataURL('image/png', 1.0);
    a.click();
}

async function copy() {
    try {
        const scale = 2, temp = document.createElement('canvas');
        temp.width = c.width * scale;
        temp.height = c.height * scale;
        const tg = temp.getContext('2d', { alpha: false });
        tg.imageSmoothingEnabled = false;
        tg.scale(scale, scale);
        tg.drawImage(c, 0, 0);
        const b = await new Promise(r => temp.toBlob(r, 'image/png', 1.0));
        await navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
        alert('已复制到剪贴板');
    } catch(e) {
        alert('复制失败：' + e.message);
    }
}
</script>
</body>
</html>
