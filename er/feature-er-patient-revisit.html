<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>功能：病人复诊流程（ER 图）</title>
  <style>
    body { margin: 20px; background: #f0f0f0; font-family: SimSun, serif; }
    #wrap { background: white; padding: 30px; display: inline-block; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    button { margin: 10px 5px; padding: 8px 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="3600" height="2800"></canvas>
</div>
<div>
<button onclick="save()">下载图片</button>
<button onclick="copy()">复制到剪贴板</button>
<button onclick="window.location.href='./index.html'">返回索引</button>
</div>
<script>
const c = document.getElementById('c');
const g = c.getContext('2d', { alpha: false });
g.imageSmoothingEnabled = false;
g.fillStyle = '#ffffff';
g.fillRect(0, 0, 3600, 2800);

function entity(x, y, w, h, text, isWeak = false) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.fillRect(x, y, w, h);
    g.strokeRect(x, y, w, h);
    if (isWeak) g.strokeRect(x + 10, y + 10, w - 20, h - 20);
    g.fillStyle = '#000';
    g.font = 'normal 60px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x + w/2, y + h/2);
}

function relation(x, y, w, h, text, rotationDegrees = 0) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    
    if (rotationDegrees !== 0) {
        // 自定义旋转角度
        g.save();
        g.translate(x + w/2, y + h/2);
        g.rotate(rotationDegrees * Math.PI / 180);
        g.translate(-(x + w/2), -(y + h/2));
    }
    
    g.beginPath();
    g.moveTo(x + w/2, y);
    g.lineTo(x + w, y + h/2);
    g.lineTo(x + w/2, y + h);
    g.lineTo(x, y + h/2);
    g.closePath();
    g.fill();
    g.stroke();
    
    g.fillStyle = '#000';
    g.font = 'normal 52px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x + w/2, y + h/2);
    
    if (rotationDegrees !== 0) {
        g.restore();
    }
}

function attribute(x, y, w, h, text, isKey = false, rotation = 0) {
    g.save();
    
    if (rotation !== 0) {
        g.translate(x + w/2, y + h/2);
        g.rotate(rotation * Math.PI / 180);
        g.translate(-(x + w/2), -(y + h/2));
    }
    
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = isKey ? 4 : 2;
    g.beginPath();
    g.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
    g.fill();
    g.stroke();
    g.fillStyle = '#000';
    g.font = 'normal 42px 宋体, SimSun, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    if (isKey) {
        g.fillText(text, x + w/2, y + h/2);
        const tw = g.measureText(text).width;
        g.beginPath();
        g.moveTo(x + w/2 - tw/2, y + h/2 + 20);
        g.lineTo(x + w/2 + tw/2, y + h/2 + 20);
        g.stroke();
    } else {
        g.fillText(text, x + w/2, y + h/2);
    }
    
    g.restore();
}

function line(x1, y1, x2, y2) {
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x2, y2);
    g.stroke();
}

function getRectEdgePoint(rectX, rectY, rectW, rectH, targetX, targetY) {
    const centerX = rectX + rectW / 2, centerY = rectY + rectH / 2;
    const dx = targetX - centerX, dy = targetY - centerY;
    if (dx === 0 && dy === 0) return { x: centerX, y: centerY };
    const angle = Math.atan2(dy, dx), absAngle = Math.abs(angle);
    if (absAngle < Math.atan2(rectH, rectW)) {
        return { x: rectX + rectW, y: centerY + (rectW / 2) * Math.tan(angle) };
    } else if (absAngle > Math.PI - Math.atan2(rectH, rectW)) {
        return { x: rectX, y: centerY - (rectW / 2) * Math.tan(angle) };
    } else if (angle > 0) {
        return { x: centerX + (rectH / 2) / Math.tan(angle), y: rectY + rectH };
    } else {
        return { x: centerX - (rectH / 2) / Math.tan(angle), y: rectY };
    }
}

function getEllipseEdgePoint(cx, cy, rx, ry, targetX, targetY) {
    const dx = targetX - cx, dy = targetY - cy;
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    const angle = Math.atan2(dy, dx);
    return { x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle) };
}

function label(text, x, y, size = 42, bold = false) {
    g.fillStyle = '#000';
    g.font = (bold ? 'bold ' : 'normal ') + size + 'px SimSun, 宋体, STSong';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, x, y);
}

// 标题
label('图 X.X 病人复诊流程ER图', 1800, 100, 56, true);

// 优化布局：医生在左上，病历在右上，补充记录在右下
// 医生实体（左上）
const userX = 700, userY = 900, userW = 300, userH = 160;
entity(userX - 150, userY - 80, userW, userH, '医生');

// 医生属性（避开右侧关系区域，集中在左侧和上下）
[
    { cx: userX, cy: userY - 300, rx: 90, ry: 45, text: '用户ID', key: true, rotation: 0 },
    { cx: userX - 320, cy: userY - 200, rx: 80, ry: 40, text: '姓名', key: false, rotation: 0 },
    { cx: userX - 370, cy: userY - 50, rx: 80, ry: 40, text: '角色', key: false, rotation: 0 },
    { cx: userX - 320, cy: userY + 100, rx: 80, ry: 40, text: '组织', key: false, rotation: 0 },
    { cx: userX - 150, cy: userY + 280, rx: 80, ry: 40, text: '科室', key: false, rotation: 0 },
    { cx: userX + 150, cy: userY + 280, rx: 80, ry: 40, text: '职称', key: false, rotation: 0 },
    { cx: userX + 150, cy: userY - 280, rx: 80, ry: 40, text: '状态', key: false, rotation: 0 },
    { cx: userX - 150, cy: userY - 280, rx: 80, ry: 40, text: '手机号', key: false, rotation: 0 }
].forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key, attr.rotation);
    const rectEdge = getRectEdgePoint(userX - 150, userY - 80, userW, userH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 病历实体（右上）
const prescX = 2600, prescY = 900, prescW = 300, prescH = 160;
entity(prescX - 150, prescY - 80, prescW, prescH, '病历');

// 病历属性（避开左侧和下方关系区域，集中在右侧和上方）
[
    { cx: prescX, cy: prescY - 300, rx: 90, ry: 45, text: '病历ID', key: true, rotation: 0 },
    { cx: prescX + 150, cy: prescY - 280, rx: 90, ry: 40, text: '病历编号', key: false, rotation: 0 },
    { cx: prescX + 340, cy: prescY - 200, rx: 90, ry: 40, text: '患者姓名', key: false, rotation: 0 },
    { cx: prescX + 390, cy: prescY - 50, rx: 80, ry: 40, text: '主诉', key: false, rotation: 0 },
    { cx: prescX + 340, cy: prescY + 100, rx: 90, ry: 40, text: '初诊诊断', key: false, rotation: 0 },
    { cx: prescX + 150, cy: prescY + 280, rx: 90, ry: 40, text: '创建时间', key: false, rotation: 0 },
    { cx: prescX - 150, cy: prescY - 280, rx: 80, ry: 40, text: '医生ID', key: false, rotation: 0 },
    { cx: prescX - 150, cy: prescY + 280, rx: 80, ry: 40, text: '状态', key: false, rotation: 0 }
].forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key, attr.rotation);
    const rectEdge = getRectEdgePoint(prescX - 150, prescY - 80, prescW, prescH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 补充记录实体（右下）
const suppX = 2600, suppY = 1900, suppW = 300, suppH = 160;
entity(suppX - 150, suppY - 80, suppW, suppH, '补充记录', true);

// 补充记录属性（避开上方关系区域，集中在下方和左右两侧）
[
    { cx: suppX, cy: suppY + 300, rx: 90, ry: 45, text: '补充ID', key: true, rotation: 0 },
    { cx: suppX + 150, cy: suppY + 280, rx: 90, ry: 40, text: '复诊时间', key: false, rotation: 0 },
    { cx: suppX + 340, cy: suppY + 180, rx: 90, ry: 40, text: '现病史', key: false, rotation: 0 },
    { cx: suppX + 390, cy: suppY + 30, rx: 90, ry: 40, text: '体格检查', key: false, rotation: 0 },
    { cx: suppX + 340, cy: suppY - 120, rx: 90, ry: 40, text: '复诊诊断', key: false, rotation: 0 },
    { cx: suppX - 340, cy: suppY - 120, rx: 80, ry: 40, text: '医嘱', key: false, rotation: 3 },
    { cx: suppX - 390, cy: suppY + 30, rx: 80, ry: 40, text: '病历ID', key: false, rotation: 0 },
    { cx: suppX - 150, cy: suppY + 280, rx: 80, ry: 40, text: '医生ID', key: false, rotation: 0 }
].forEach(attr => {
    attribute(attr.cx - attr.rx, attr.cy - attr.ry, attr.rx * 2, attr.ry * 2, attr.text, attr.key, attr.rotation);
    const rectEdge = getRectEdgePoint(suppX - 150, suppY - 80, suppW, suppH, attr.cx, attr.cy);
    const ellipseEdge = getEllipseEdgePoint(attr.cx, attr.cy, attr.rx, attr.ry, rectEdge.x, rectEdge.y);
    line(rectEdge.x, rectEdge.y, ellipseEdge.x, ellipseEdge.y);
});

// 关系1：医生-初诊创建-病历（水平方向）
const rel1X = 1650, rel1Y = 900, rel1W = 280, rel1H = 160;
relation(rel1X - rel1W/2, rel1Y - rel1H/2, rel1W, rel1H, '初诊创建');

const userToRel1Start = getRectEdgePoint(userX - 150, userY - 80, userW, userH, rel1X, rel1Y);
const userToRel1End = { x: rel1X - rel1W/2, y: rel1Y };
line(userToRel1Start.x, userToRel1Start.y, userToRel1End.x, userToRel1End.y);

const rel1ToPrescStart = { x: rel1X + rel1W/2, y: rel1Y };
const rel1ToPrescEnd = getRectEdgePoint(prescX - 150, prescY - 80, prescW, prescH, rel1X, rel1Y);
line(rel1ToPrescStart.x, rel1ToPrescStart.y, rel1ToPrescEnd.x, rel1ToPrescEnd.y);

label('1', (userToRel1Start.x + userToRel1End.x) / 2, (userToRel1Start.y + userToRel1End.y) / 2 - 30, 46, true);
label('n', (rel1ToPrescStart.x + rel1ToPrescEnd.x) / 2, (rel1ToPrescStart.y + rel1ToPrescEnd.y) / 2 - 30, 46, true);

// 关系2：医生-复诊添加-补充记录（斜线，菱形旋转37度）
const rel2X = 1650, rel2Y = 1400, rel2W = 280, rel2H = 160;
relation(rel2X - rel2W/2, rel2Y - rel2H/2, rel2W, rel2H, '复诊添加', 37);

const userToRel2Start = getRectEdgePoint(userX - 150, userY - 80, userW, userH, rel2X, rel2Y);
// 旋转37度后的左顶角（原始菱形的左顶点）
const angle37 = 37 * Math.PI / 180;
const userToRel2End = { 
    x: rel2X + (-rel2W/2) * Math.cos(angle37) - 0 * Math.sin(angle37), 
    y: rel2Y + (-rel2W/2) * Math.sin(angle37) + 0 * Math.cos(angle37)
};
line(userToRel2Start.x, userToRel2Start.y, userToRel2End.x, userToRel2End.y);

// 旋转37度后的右顶角（原始菱形的右顶点）
const rel2ToSuppStart = { 
    x: rel2X + (rel2W/2) * Math.cos(angle37) - 0 * Math.sin(angle37), 
    y: rel2Y + (rel2W/2) * Math.sin(angle37) + 0 * Math.cos(angle37)
};
const rel2ToSuppEnd = getRectEdgePoint(suppX - 150, suppY - 80, suppW, suppH, rel2X, rel2Y);
line(rel2ToSuppStart.x, rel2ToSuppStart.y, rel2ToSuppEnd.x, rel2ToSuppEnd.y);

label('1', (userToRel2Start.x + userToRel2End.x) / 2 - 40, (userToRel2Start.y + userToRel2End.y) / 2, 46, true);
label('n', (rel2ToSuppStart.x + rel2ToSuppEnd.x) / 2 + 40, (rel2ToSuppStart.y + rel2ToSuppEnd.y) / 2, 46, true);

// 关系3：病历-关联-补充记录（垂直方向）
const rel3X = 2600, rel3Y = 1400, rel3W = 280, rel3H = 160;
relation(rel3X - rel3W/2, rel3Y - rel3H/2, rel3W, rel3H, '关联');

const prescToRel3Start = getRectEdgePoint(prescX - 150, prescY - 80, prescW, prescH, rel3X, rel3Y);
const prescToRel3End = { x: rel3X, y: rel3Y - rel3H/2 };
line(prescToRel3Start.x, prescToRel3Start.y, prescToRel3End.x, prescToRel3End.y);

const rel3ToSuppStart = { x: rel3X, y: rel3Y + rel3H/2 };
const rel3ToSuppEnd = getRectEdgePoint(suppX - 150, suppY - 80, suppW, suppH, rel3X, rel3Y);
line(rel3ToSuppStart.x, rel3ToSuppStart.y, rel3ToSuppEnd.x, rel3ToSuppEnd.y);

label('1', (prescToRel3Start.x + prescToRel3End.x) / 2 - 30, (prescToRel3Start.y + prescToRel3End.y) / 2, 46, true);
label('n', (rel3ToSuppStart.x + rel3ToSuppEnd.x) / 2 - 30, (rel3ToSuppStart.y + rel3ToSuppEnd.y) / 2, 46, true);

// 流程说明
g.fillStyle = '#f9f9f9';
g.fillRect(200, 2550, 3200, 180);
g.strokeStyle = '#666';
g.lineWidth = 2;
g.strokeRect(200, 2550, 3200, 180);

label('流程说明：', 400, 2600, 46, true);
label('1. 初诊：医生为患者创建病历，记录主诉、诊断、医嘱等初诊信息', 1800, 2620, 42, false);
label('2. 复诊：患者再次就诊时，医生在原病历基础上添加补充记录，记录病情变化、新的诊断和治疗方案', 1800, 2670, 42, false);
label('3. 关联：每条补充记录都关联到对应的病历，形成完整的诊疗历史', 1800, 2710, 42, false);

function save() {
    const scale = 2, temp = document.createElement('canvas');
    temp.width = c.width * scale;
    temp.height = c.height * scale;
    const tg = temp.getContext('2d', { alpha: false });
    tg.imageSmoothingEnabled = false;
    tg.scale(scale, scale);
    tg.drawImage(c, 0, 0);
    const a = document.createElement('a');
    a.download = '病人复诊流程ER图.png';
    a.href = temp.toDataURL('image/png', 1.0);
    a.click();
}

async function copy() {
    try {
        const scale = 2, temp = document.createElement('canvas');
        temp.width = c.width * scale;
        temp.height = c.height * scale;
        const tg = temp.getContext('2d', { alpha: false });
        tg.imageSmoothingEnabled = false;
        tg.scale(scale, scale);
        tg.drawImage(c, 0, 0);
        const b = await new Promise(r => temp.toBlob(r, 'image/png', 1.0));
        await navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
        alert('已复制到剪贴板');
    } catch(e) {
        alert('复制失败：' + e.message);
    }
}
</script>
</body>
</html>
