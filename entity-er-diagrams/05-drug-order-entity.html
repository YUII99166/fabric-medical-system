<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>药品订单实体ER图</title>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f5f5f5; }
        svg { background-color: white; border: 1px solid #ddd; }
        .entity { fill: white; stroke: #333; stroke-width: 2; }
        .attribute { fill: white; stroke: #666; stroke-width: 1.5; }
        .key-attribute { fill: white; stroke: #666; stroke-width: 2; }
        .derived-attribute { fill: white; stroke: #666; stroke-width: 1.5; stroke-dasharray: 4,2; }
        .line { stroke: #666; stroke-width: 1.5; fill: none; }
        .text { font-family: 'Microsoft YaHei', Arial, sans-serif; font-size: 14px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
        .entity-text { font-size: 16px; font-weight: bold; }
        .underline { text-decoration: underline; }
    </style>
</head>
<body>
    <svg width="900" height="750" viewBox="0 0 900 750">
        <text class="text" x="450" y="30" style="font-size: 18px; font-weight: bold;">图 X.X 药品订单实体ER图</text>
        
        <!-- 中心实体：药品订单 -->
        <rect class="entity" x="370" y="340" width="160" height="60" rx="5"/>
        <text class="text entity-text" x="450" y="370">药品订单</text>
        
        <!-- 主键：订单ID -->
        <ellipse class="key-attribute" cx="450" cy="240" rx="50" ry="28"/>
        <text class="text underline" x="450" y="240">订单ID</text>
        <line class="line" x1="450" y1="340" x2="450" y2="268"/>
        
        <!-- 药品名称 -->
        <ellipse class="attribute" cx="340" cy="220" rx="55" ry="28"/>
        <text class="text" x="340" y="220">药品名称</text>
        <line class="line" x1="395" y1="345" x2="375" y2="245"/>
        
        <!-- 数量 -->
        <ellipse class="attribute" cx="250" cy="270" rx="40" ry="28"/>
        <text class="text" x="250" y="270">数量</text>
        <line class="line" x1="375" y1="355" x2="285" y2="290"/>
        
        <!-- 价格 -->
        <ellipse class="attribute" cx="210" cy="350" rx="40" ry="28"/>
        <text class="text" x="210" y="350">价格</text>
        <line class="line" x1="370" y1="365" x2="250" y2="360"/>
        
        <!-- 患者ID -->
        <ellipse class="key-attribute" cx="220" cy="440" rx="50" ry="28"/>
        <text class="text underline" x="220" y="440">患者ID</text>
        <line class="line" x1="375" y1="385" x2="265" y2="430"/>
        
        <!-- 患者姓名 -->
        <ellipse class="attribute" cx="270" cy="530" rx="55" ry="28"/>
        <text class="text" x="270" y="530">患者姓名</text>
        <line class="line" x1="390" y1="395" x2="315" y2="515"/>
        
        <!-- 处方ID -->
        <ellipse class="key-attribute" cx="360" cy="590" rx="50" ry="28"/>
        <text class="text underline" x="360" y="590">处方ID</text>
        <line class="line" x1="415" y1="398" x2="390" y2="565"/>
        
        <!-- 药店ID -->
        <ellipse class="key-attribute" cx="470" cy="610" rx="50" ry="28"/>
        <text class="text underline" x="470" y="610">药店ID</text>
        <line class="line" x1="455" y1="400" x2="465" y2="582"/>
        
        <!-- 药店名称 -->
        <ellipse class="attribute" cx="580" cy="600" rx="55" ry="28"/>
        <text class="text" x="580" y="600">药店名称</text>
        <line class="line" x1="500" y1="395" x2="535" y2="580"/>
        
        <!-- 订单状态 -->
        <ellipse class="attribute" cx="670" cy="540" rx="55" ry="28"/>
        <text class="text" x="670" y="540">订单状态</text>
        <line class="line" x1="520" y1="385" x2="620" y2="525"/>
        
        <!-- 创建时间 -->
        <ellipse class="attribute" cx="720" cy="450" rx="55" ry="28"/>
        <text class="text" x="720" y="450">创建时间</text>
        <line class="line" x1="530" y1="370" x2="670" y2="460"/>
        
        <!-- 更新时间 -->
        <ellipse class="attribute" cx="730" cy="350" rx="55" ry="28"/>
        <text class="text" x="730" y="350">更新时间</text>
        <line class="line" x1="530" y1="360" x2="680" y2="360"/>
        
        <!-- 交易ID -->
        <ellipse class="key-attribute" cx="680" cy="260" rx="50" ry="28"/>
        <text class="text underline" x="680" y="260">交易ID</text>
        <line class="line" x1="515" y1="350" x2="635" y2="275"/>
        
        <!-- 派生属性：总金额 -->
        <ellipse class="derived-attribute" cx="570" cy="210" rx="50" ry="28"/>
        <text class="text" x="570" y="210">总金额</text>
        <line class="line" x1="500" y1="345" x2="535" y2="235"/>
        
        <!-- 图例 -->
        <g transform="translate(50, 670)">
            <text class="text" x="0" y="0" text-anchor="start" style="font-size: 13px; font-weight: bold;">图例：</text>
            <ellipse class="key-attribute" cx="80" cy="30" rx="35" ry="20"/>
            <text class="text underline" x="80" y="30" style="font-size: 12px;">主键</text>
            <ellipse class="attribute" cx="170" cy="30" rx="35" ry="20"/>
            <text class="text" x="170" y="30" style="font-size: 12px;">属性</text>
            <ellipse class="derived-attribute" cx="270" cy="30" rx="35" ry="20"/>
            <text class="text" x="270" y="30" style="font-size: 12px;">派生</text>
        </g>
    </svg>
</body>
</html>
