<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户实体ER图</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }
        svg {
            background-color: white;
            border: 1px solid #ddd;
        }
        .entity { fill: white; stroke: #333; stroke-width: 2; }
        .attribute { fill: white; stroke: #666; stroke-width: 1.5; }
        .key-attribute { fill: white; stroke: #666; stroke-width: 2; }
        .line { stroke: #666; stroke-width: 1.5; fill: none; }
        .text { font-family: 'Microsoft YaHei', Arial, sans-serif; font-size: 14px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
        .entity-text { font-size: 16px; font-weight: bold; }
        .underline { text-decoration: underline; }
    </style>
</head>
<body>
    <svg width="1000" height="900" viewBox="0 0 1000 900">
        <text class="text" x="500" y="30" style="font-size: 18px; font-weight: bold;">图 X.X 用户实体ER图</text>
        
        <!-- 中心实体：用户 -->
        <rect class="entity" x="420" y="420" width="160" height="60" rx="5"/>
        <text class="text entity-text" x="500" y="450">用户</text>
        
        <!-- 主键：用户ID -->
        <ellipse class="key-attribute" cx="500" cy="320" rx="50" ry="28"/>
        <text class="text underline" x="500" y="320">用户ID</text>
        <line class="line" x1="500" y1="420" x2="500" y2="348"/>
        
        <!-- 用户名 -->
        <ellipse class="attribute" cx="380" cy="300" rx="50" ry="28"/>
        <text class="text" x="380" y="300">用户名</text>
        <line class="line" x1="440" y1="425" x2="415" y2="325"/>
        
        <!-- 密码 -->
        <ellipse class="attribute" cx="280" cy="360" rx="45" ry="28"/>
        <text class="text" x="280" y="360">密码</text>
        <line class="line" x1="420" y1="440" x2="325" y2="375"/>
        
        <!-- 账户名称 -->
        <ellipse class="attribute" cx="620" cy="300" rx="55" ry="28"/>
        <text class="text" x="620" y="300">账户名称</text>
        <line class="line" x1="555" y1="425" x2="585" y2="325"/>
        
        <!-- 角色 -->
        <ellipse class="attribute" cx="720" cy="360" rx="40" ry="28"/>
        <text class="text" x="720" y="360">角色</text>
        <line class="line" x1="575" y1="440" x2="680" y2="375"/>
        
        <!-- 所属组织 -->
        <ellipse class="attribute" cx="260" cy="480" rx="55" ry="28"/>
        <text class="text" x="260" y="480">所属组织</text>
        <line class="line" x1="420" y1="460" x2="315" y2="470"/>
        
        <!-- 组织名称 -->
        <ellipse class="attribute" cx="280" cy="580" rx="55" ry="28"/>
        <text class="text" x="280" y="580">组织名称</text>
        <line class="line" x1="425" y1="475" x2="330" y2="565"/>
        
        <!-- 科室 -->
        <ellipse class="attribute" cx="360" cy="650" rx="40" ry="28"/>
        <text class="text" x="360" y="650">科室</text>
        <line class="line" x1="445" y1="478" x2="390" y2="630"/>
        
        <!-- 医生职称 -->
        <ellipse class="attribute" cx="460" cy="690" rx="55" ry="28"/>
        <text class="text" x="460" y="690">医生职称</text>
        <line class="line" x1="480" y1="480" x2="470" y2="662"/>
        
        <!-- 执业证号 -->
        <ellipse class="attribute" cx="570" cy="700" rx="55" ry="28"/>
        <text class="text" x="570" y="700">执业证号</text>
        <line class="line" x1="510" y1="478" x2="540" y2="675"/>
        
        <!-- 年龄 -->
        <ellipse class="attribute" cx="680" cy="680" rx="40" ry="28"/>
        <text class="text" x="680" y="680">年龄</text>
        <line class="line" x1="545" y1="475" x2="645" y2="660"/>
        
        <!-- 性别 -->
        <ellipse class="attribute" cx="750" cy="620" rx="40" ry="28"/>
        <text class="text" x="750" y="620">性别</text>
        <line class="line" x1="565" y1="470" x2="715" y2="605"/>
        
        <!-- 联系电话 -->
        <ellipse class="attribute" cx="760" cy="520" rx="55" ry="28"/>
        <text class="text" x="760" y="520">联系电话</text>
        <line class="line" x1="580" y1="460" x2="710" y2="510"/>
        
        <!-- 电子邮箱 -->
        <ellipse class="attribute" cx="740" cy="430" rx="55" ry="28"/>
        <text class="text" x="740" y="430">电子邮箱</text>
        <line class="line" x1="580" y1="445" x2="685" y2="435"/>
        
        <!-- 状态 -->
        <ellipse class="attribute" cx="650" cy="360" rx="40" ry="28"/>
        <text class="text" x="650" y="360">状态</text>
        <line class="line" x1="575" y1="430" x2="615" y2="380"/>
        
        <!-- 创建时间 -->
        <ellipse class="attribute" cx="350" cy="360" rx="55" ry="28"/>
        <text class="text" x="350" y="360">创建时间</text>
        <line class="line" x1="425" y1="430" x2="395" y2="380"/>
        
        <!-- 更新时间 -->
        <ellipse class="attribute" cx="240" cy="420" rx="55" ry="28"/>
        <text class="text" x="240" y="420">更新时间</text>
        <line class="line" x1="420" y1="445" x2="295" y2="435"/>
        
        <!-- 图例 -->
        <g transform="translate(50, 800)">
            <text class="text" x="0" y="0" text-anchor="start" style="font-size: 13px; font-weight: bold;">图例：</text>
            <ellipse class="key-attribute" cx="80" cy="30" rx="35" ry="20"/>
            <text class="text underline" x="80" y="30" style="font-size: 12px;">主键</text>
            <ellipse class="attribute" cx="170" cy="30" rx="35" ry="20"/>
            <text class="text" x="170" y="30" style="font-size: 12px;">属性</text>
        </g>
    </svg>
</body>
</html>
