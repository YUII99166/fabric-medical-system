<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局ER图</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }
        svg {
            background-color: white;
            border: 1px solid #ddd;
        }
        .entity {
            fill: #B0E0E6;
            stroke: #333;
            stroke-width: 2;
        }
        .weak-entity {
            fill: #B0E0E6;
            stroke: #333;
            stroke-width: 3;
        }
        .relationship {
            fill: white;
            stroke: #333;
            stroke-width: 2;
        }
        .identifying-relationship {
            fill: white;
            stroke: #333;
            stroke-width: 3;
        }
        .key-attribute {
            fill: #FFFF99;
            stroke: #333;
            stroke-width: 1.5;
        }
        .attribute {
            fill: white;
            stroke: #333;
            stroke-width: 1.5;
        }
        .multi-attribute {
            fill: white;
            stroke: #333;
            stroke-width: 1.5;
        }
        .line {
            stroke: #333;
            stroke-width: 1.5;
            fill: none;
        }
        .dashed-line {
            stroke: #333;
            stroke-width: 1.5;
            stroke-dasharray: 5,3;
            fill: none;
        }
        .text {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            font-size: 13px;
            fill: #333;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .entity-text {
            font-size: 15px;
            font-weight: bold;
        }
        .cardinality {
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <svg width="1600" height="1200" viewBox="0 0 1600 1200">
        <!-- 标题 -->
        <text class="text" x="800" y="40" style="font-size: 20px; font-weight: bold;">图 X.X 医疗信息管理系统全局ER图</text>
        
        <!-- ========== 用户实体（左侧） ========== -->
        <rect class="entity" x="150" y="450" width="140" height="70" rx="5"/>
        <text class="text entity-text" x="220" y="485">用户</text>
        
        <!-- 用户属性 -->
        <!-- 用户ID（主键，左上） -->
        <ellipse class="key-attribute" cx="130" cy="350" rx="50" ry="28"/>
        <text class="text" x="130" y="350">用户ID</text>
        <line class="line" x1="160" y1="375" x2="180" y2="450"/>
        
        <!-- 姓名（左上） -->
        <ellipse class="attribute" cx="200" cy="330" rx="40" ry="28"/>
        <text class="text" x="200" y="330">姓名</text>
        <line class="line" x1="210" y1="355" x2="210" y2="450"/>
        
        <!-- 角色（左上） -->
        <ellipse class="attribute" cx="270" cy="320" rx="40" ry="28"/>
        <text class="text" x="270" y="320">角色</text>
        <line class="line" x1="260" y1="345" x2="250" y2="450"/>
        
        <!-- 密码（左下） -->
        <ellipse class="attribute" cx="110" cy="580" rx="40" ry="28"/>
        <text class="text" x="110" y="580">密码</text>
        <line class="line" x1="135" y1="560" x2="165" y2="520"/>
        
        <!-- 性别（左下） -->
        <ellipse class="attribute" cx="190" cy="600" rx="40" ry="28"/>
        <text class="text" x="190" y="600">性别</text>
        <line class="line" x1="200" y1="575" x2="210" y2="520"/>
        
        <!-- 年龄（下方） -->
        <ellipse class="attribute" cx="260" cy="590" rx="40" ry="28"/>
        <text class="text" x="260" y="590">年龄</text>
        <line class="line" x1="255" y1="565" x2="245" y2="520"/>
        
        <!-- 组织（右下） -->
        <ellipse class="attribute" cx="330" cy="570" rx="40" ry="28"/>
        <text class="text" x="330" y="570">组织</text>
        <line class="line" x1="310" y1="550" x2="285" y2="515"/>
        
        <!-- ========== 病历实体（中上） ========== -->
        <rect class="entity" x="580" y="250" width="140" height="70" rx="5"/>
        <text class="text entity-text" x="650" y="285">病历</text>
        
        <!-- 病历属性 -->
        <!-- 病历ID（主键，顶部） -->
        <ellipse class="key-attribute" cx="650" cy="140" rx="50" ry="28"/>
        <text class="text" x="650" y="140">病历ID</text>
        <line class="line" x1="650" y1="168" x2="650" y2="250"/>
        
        <!-- 病历编号（左上） -->
        <ellipse class="attribute" cx="500" cy="180" rx="50" ry="28"/>
        <text class="text" x="500" y="180">病历编号</text>
        <line class="line" x1="530" y1="200" x2="585" y2="255"/>
        
        <!-- 患者姓名（右上） -->
        <ellipse class="attribute" cx="700" cy="190" rx="50" ry="28"/>
        <text class="text" x="700" y="190">患者姓名</text>
        <line class="line" x1="680" y1="215" x2="665" y2="250"/>
        
        <!-- 主诉（左侧） -->
        <ellipse class="attribute" cx="470" cy="280" rx="40" ry="28"/>
        <text class="text" x="470" y="280">主诉</text>
        <line class="line" x1="505" y1="275" x2="580" y2="275"/>
        
        <!-- 现病史（左侧） -->
        <ellipse class="attribute" cx="460" cy="340" rx="45" ry="28"/>
        <text class="text" x="460" y="340">现病史</text>
        <line class="line" x1="500" y1="330" x2="580" y2="305"/>
        
        <!-- 体格检查（右侧） -->
        <ellipse class="attribute" cx="790" cy="250" rx="50" ry="28"/>
        <text class="text" x="790" y="250">体格检查</text>
        <line class="line" x1="745" y1="260" x2="720" y2="270"/>
        
        <!-- 诊断（右侧） -->
        <ellipse class="attribute" cx="800" cy="310" rx="40" ry="28"/>
        <text class="text" x="800" y="310">诊断</text>
        <line class="line" x1="765" y1="305" x2="720" y2="295"/>
        
        <!-- 医嘱（右下） -->
        <ellipse class="attribute" cx="780" cy="370" rx="40" ry="28"/>
        <text class="text" x="780" y="370">医嘱</text>
        <line class="line" x1="745" y1="360" x2="715" y2="315"/>
        
        <!-- 创建时间（下方） -->
        <ellipse class="attribute" cx="650" cy="390" rx="50" ry="28"/>
        <text class="text" x="650" y="390">创建时间</text>
        <line class="line" x1="650" y1="365" x2="650" y2="320"/>
        
        <!-- 医生ID（下方） -->
        <ellipse class="attribute" cx="560" cy="390" rx="45" ry="28"/>
        <text class="text" x="560" y="390">医生ID</text>
        <line class="line" x1="580" y1="365" x2="600" y2="320"/>
        
        <!-- 组织ID（左下） -->
        <ellipse class="attribute" cx="480" cy="400" rx="45" ry="28"/>
        <text class="text" x="480" y="400">组织ID</text>
        <line class="line" x1="515" y1="385" x2="585" y2="315"/>
        
        <!-- ========== 补充记录实体（右上，弱实体） ========== -->
        <rect class="weak-entity" x="1030" y="250" width="140" height="70" rx="5"/>
        <rect class="entity" x="1038" y="258" width="124" height="54" rx="5"/>
        <text class="text entity-text" x="1100" y="285">补充记录</text>
        
        <!-- 补充记录属性 -->
        <!-- 补充ID（主键，右上） -->
        <ellipse class="key-attribute" cx="1200" cy="180" rx="50" ry="28"/>
        <text class="text" x="1200" y="180">补充ID</text>
        <line class="line" x1="1170" y1="200" x2="1150" y2="255"/>
        
        <!-- 病历ID（外键，右上） -->
        <ellipse class="attribute" cx="1240" cy="240" rx="50" ry="28"/>
        <text class="text" x="1240" y="240">病历ID</text>
        <line class="line" x1="1200" y1="255" x2="1165" y2="270"/>
        
        <!-- 现病史（右侧） -->
        <ellipse class="attribute" cx="1250" cy="310" rx="45" ry="28"/>
        <text class="text" x="1250" y="310">现病史</text>
        <line class="line" x1="1210" y1="305" x2="1165" y2="290"/>
        
        <!-- 体格检查（右下） -->
        <ellipse class="attribute" cx="1230" cy="370" rx="50" ry="28"/>
        <text class="text" x="1230" y="370">体格检查</text>
        <line class="line" x1="1190" y1="355" x2="1160" y2="315"/>
        
        <!-- 诊断（下方） -->
        <ellipse class="attribute" cx="1150" cy="390" rx="40" ry="28"/>
        <text class="text" x="1150" y="390">诊断</text>
        <line class="line" x1="1135" y1="365" x2="1120" y2="320"/>
        
        <!-- 医嘱（左下） -->
        <ellipse class="attribute" cx="1060" cy="380" rx="40" ry="28"/>
        <text class="text" x="1060" y="380">医嘱</text>
        <line class="line" x1="1070" y1="355" x2="1080" y2="320"/>
        
        <!-- 创建时间（左侧） -->
        <ellipse class="attribute" cx="960" cy="310" rx="50" ry="28"/>
        <text class="text" x="960" y="310">创建时间</text>
        <line class="line" x1="1005" y1="300" x2="1035" y2="290"/>
        
        <!-- ========== 授权请求实体（右下） ========== -->
        <rect class="entity" x="1030" y="600" width="140" height="70" rx="5"/>
        <text class="text entity-text" x="1100" y="635">授权请求</text>
        
        <!-- 授权请求属性 -->
        <!-- 记录ID（主键，右上） -->
        <ellipse class="key-attribute" cx="1230" cy="530" rx="50" ry="28"/>
        <text class="text" x="1230" y="530">记录ID</text>
        <line class="line" x1="1200" y1="550" x2="1155" y2="600"/>
        
        <!-- 病历ID（外键，右侧） -->
        <ellipse class="attribute" cx="1240" cy="620" rx="50" ry="28"/>
        <text class="text" x="1240" y="620">病历ID</text>
        <line class="line" x1="1195" y1="625" x2="1165" y2="630"/>
        
        <!-- 内容（右下） -->
        <ellipse class="attribute" cx="1210" cy="700" rx="40" ry="28"/>
        <text class="text" x="1210" y="700">内容</text>
        <line class="line" x1="1180" y1="685" x2="1155" y2="665"/>
        
        <!-- 时间（下方） -->
        <ellipse class="attribute" cx="1100" cy="730" rx="40" ry="28"/>
        <text class="text" x="1100" y="730">时间</text>
        <line class="line" x1="1100" y1="705" x2="1100" y2="670"/>
        
        <!-- ========== 药品订单实体（底部） ========== -->
        <rect class="entity" x="580" y="900" width="140" height="70" rx="5"/>
        <text class="text entity-text" x="650" y="935">药品订单</text>
        
        <!-- 药品订单属性 -->
        <!-- 订单ID（主键，右上） -->
        <ellipse class="key-attribute" cx="780" cy="840" rx="50" ry="28"/>
        <text class="text" x="780" y="840">订单ID</text>
        <line class="line" x1="750" y1="860" x2="710" y2="900"/>
        
        <!-- 药品名（左下） -->
        <ellipse class="attribute" cx="580" cy="1040" rx="45" ry="28"/>
        <text class="text" x="580" y="1040">药品名</text>
        <line class="line" x1="600" y1="1015" x2="620" y2="970"/>
        
        <!-- 数量（下方） -->
        <ellipse class="attribute" cx="680" cy="1050" rx="40" ry="28"/>
        <text class="text" x="680" y="1050">数量</text>
        <line class="line" x1="670" y1="1025" x2="660" y2="970"/>
        
        <!-- 用户ID（右下） -->
        <ellipse class="attribute" cx="770" cy="1030" rx="45" ry="28"/>
        <text class="text" x="770" y="1030">用户ID</text>
        <line class="line" x1="740" y1="1010" x2="700" y2="970"/>
        
        <!-- ========== 关系 ========== -->
        
        <!-- L1: 用户-创建-病历 -->
        <!-- 从用户(290,485)到菱形左下角，从菱形右上角到病历(580,285) -->
        <!-- 菱形旋转-34.5度，中心(420,385)，扩大 -->
        <!-- 菱形角点：左下角(385,385)，右上角(455,385) -->
        <!-- 旋转-34.5度后，左下角变为(390,415)，右上角变为(450,355) -->
        <line class="line" x1="290" y1="485" x2="390" y2="415"/>
        <line class="line" x1="450" y1="355" x2="580" y2="285"/>
        <text class="text" x="340" y="430" style="font-size: 10px; fill: blue;">L1</text>
        <g transform="rotate(-34.5 420 385)">
            <polygon class="relationship" points="385,385 420,350 455,385 420,420"/>
        </g>
        <text class="text" x="420" y="385">创建</text>
        <text class="text" x="420" y="405" style="font-size: 10px; fill: red;">D1</text>
        <text class="text cardinality" x="305" y="495">1</text>
        <text class="text cardinality" x="560" y="295">n</text>
        
        <!-- L2: 病历-补充-补充记录（标识关系） -->
        <!-- 从病历(720,285)到菱形左角，从菱形右角到补充记录(1030,285) -->
        <line class="line" x1="720" y1="285" x2="815" y2="285"/>
        <line class="line" x1="905" y1="285" x2="1030" y2="285"/>
        <text class="text" x="765" y="275" style="font-size: 10px; fill: blue;">L2</text>
        <!-- D2: 双菱形，中心(860,285) -->
        <polygon class="identifying-relationship" points="815,285 860,240 905,285 860,330"/>
        <polygon class="relationship" points="825,285 860,250 895,285 860,320"/>
        <text class="text" x="860" y="285">补充</text>
        <text class="text" x="860" y="305" style="font-size: 10px; fill: red;">D2</text>
        <text class="text cardinality" x="735" y="275">1</text>
        <text class="text cardinality" x="1015" y="275">n</text>
        
        <!-- L3: 用户-添加-补充记录 -->
        <!-- 从用户(290,485)到菱形左下角，从菱形右上角到补充记录(1030,305) -->
        <!-- 菱形旋转-13.7度，中心(630,395)，扩大 -->
        <!-- 菱形角点：左下角(595,395)，右上角(665,395) -->
        <!-- 旋转-13.7度后，左下角变为(600,420)，右上角变为(660,370) -->
        <line class="line" x1="290" y1="485" x2="600" y2="420"/>
        <line class="line" x1="660" y1="370" x2="1030" y2="305"/>
        <text class="text" x="440" y="435" style="font-size: 10px; fill: blue;">L3</text>
        <g transform="rotate(-13.7 630 395)">
            <polygon class="relationship" points="595,395 630,360 665,395 630,430"/>
        </g>
        <text class="text" x="630" y="395">添加</text>
        <text class="text" x="630" y="415" style="font-size: 10px; fill: red;">D3</text>
        <text class="text cardinality" x="305" y="495">1</text>
        <text class="text cardinality" x="1015" y="315">n</text>
        
        <!-- L4: 病历-关联-授权请求 -->
        <!-- 从病历(710,320)到菱形左上角，从菱形右下角到授权请求(1030,620) -->
        <!-- 菱形旋转43.2度，中心(850,450)，扩大 -->
        <!-- 菱形角点：左上角(815,450)，右下角(885,450) -->
        <!-- 旋转43.2度后，左上角变为(820,420)，右下角变为(880,480) -->
        <line class="line" x1="710" y1="320" x2="820" y2="420"/>
        <line class="line" x1="880" y1="480" x2="1030" y2="620"/>
        <text class="text" x="765" y="380" style="font-size: 10px; fill: blue;">L4</text>
        <g transform="rotate(43.2 850 450)">
            <polygon class="relationship" points="815,450 850,415 885,450 850,485"/>
        </g>
        <text class="text" x="850" y="450">关联</text>
        <text class="text" x="850" y="470" style="font-size: 10px; fill: red;">D4</text>
        <text class="text cardinality" x="720" y="335">1</text>
        <text class="text cardinality" x="1015" y="610">n</text>
        
        <!-- L5: 用户-申请-授权请求 -->
        <!-- 从用户(290,510)到菱形左下角，从菱形右上角到授权请求(1030,635) -->
        <!-- 菱形旋转9.6度，中心(620,565)，扩大 -->
        <!-- 菱形角点：左下角(585,565)，右上角(655,565) -->
        <!-- 旋转9.6度后，左下角变为(585,556)，右上角变为(655,574) -->
        <line class="line" x1="290" y1="510" x2="585" y2="556"/>
        <line class="line" x1="655" y1="574" x2="1030" y2="635"/>
        <text class="text" x="435" y="535" style="font-size: 10px; fill: blue;">L5</text>
        <g transform="rotate(9.6 620 565)">
            <polygon class="relationship" points="585,565 620,530 655,565 620,600"/>
        </g>
        <text class="text" x="620" y="565">申请</text>
        <text class="text" x="620" y="585" style="font-size: 10px; fill: red;">D5</text>
        <text class="text cardinality" x="305" y="520">1</text>
        <text class="text cardinality" x="1015" y="640">n</text>
        
        <!-- L6: 病历-生成-药品订单 -->
        <!-- 从病历(650,320)到菱形上角，从菱形下角到药品订单(650,900) -->
        <line class="line" x1="650" y1="320" x2="650" y2="570"/>
        <line class="line" x1="650" y1="660" x2="650" y2="900"/>
        <text class="text" x="665" y="440" style="font-size: 10px; fill: blue;">L6</text>
        <!-- D6: 菱形，中心(650,615) -->
        <polygon class="relationship" points="650,570 675,615 650,660 625,615"/>
        <text class="text" x="650" y="615">生成</text>
        <text class="text" x="675" y="615" style="font-size: 10px; fill: red;">D6</text>
        <text class="text cardinality" x="665" y="335">1</text>
        <text class="text cardinality" x="665" y="885">n</text>
        
        <!-- L7: 用户-处理-药品订单 -->
        <!-- 从用户(230,510)到菱形左上角，从菱形右下角到药品订单(580,915) -->
        <!-- 菱形旋转49.2度，中心(380,685)，扩大 -->
        <!-- 菱形角点：左上角(345,685)，右下角(415,685) -->
        <!-- 旋转49.2度后，左上角变为(350,655)，右下角变为(410,715) -->
        <line class="line" x1="230" y1="510" x2="350" y2="655"/>
        <line class="line" x1="410" y1="715" x2="580" y2="915"/>
        <text class="text" x="285" y="595" style="font-size: 10px; fill: blue;">L7</text>
        <g transform="rotate(49.2 380 685)">
            <polygon class="relationship" points="345,685 380,650 415,685 380,720"/>
        </g>
        <text class="text" x="380" y="685">处理</text>
        <text class="text" x="380" y="705" style="font-size: 10px; fill: red;">D7</text>
        <text class="text cardinality" x="245" y="525">m</text>
        <text class="text cardinality" x="565" y="905">n</text>
        
        <!-- 图例 -->
        <g transform="translate(50, 1000)">
            <text class="text" x="0" y="0" text-anchor="start" style="font-size: 14px; font-weight: bold;">图例：</text>
            
            <rect class="entity" x="0" y="15" width="60" height="35" rx="3"/>
            <text class="text" x="30" y="32" style="font-size: 12px;">实体</text>
            
            <g transform="translate(90, 0)">
                <rect class="weak-entity" x="0" y="15" width="60" height="35" rx="3"/>
                <rect class="entity" x="4" y="19" width="52" height="27" rx="3"/>
                <text class="text" x="30" y="32" style="font-size: 11px;">弱实体</text>
            </g>
            
            <polygon class="relationship" points="200,20 215,32 200,44 185,32"/>
            <text class="text" x="200" y="32" style="font-size: 11px;">联系</text>
            
            <g transform="translate(250, 0)">
                <polygon class="identifying-relationship" points="0,20 15,32 0,44 -15,32"/>
                <polygon class="relationship" points="2,23 13,32 2,41 -9,32"/>
                <text class="text" x="0" y="32" style="font-size: 10px;">标识</text>
            </g>
            
            <ellipse class="key-attribute" cx="350" cy="32" rx="35" ry="20"/>
            <text class="text" x="350" y="32" style="font-size: 11px;">主键</text>
            
            <ellipse class="attribute" cx="430" cy="32" rx="35" ry="20"/>
            <text class="text" x="430" y="32" style="font-size: 11px;">属性</text>
            
            <g transform="translate(490, 32)">
                <ellipse class="multi-attribute" cx="0" cy="0" rx="35" ry="20" stroke-width="2.5"/>
                <ellipse class="multi-attribute" cx="0" cy="0" rx="30" ry="15" stroke-width="1.5"/>
                <text class="text" x="0" y="0" style="font-size: 10px;">多值</text>
            </g>
            
            <text class="text" x="600" y="32" text-anchor="start" style="font-size: 12px;">1, n, m: 基数</text>
        </g>
    </svg>
</body>
</html>
