<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>用户实体ER图</title>
<style>
body { margin: 20px; background: #f0f0f0; font-family: SimSun, serif; }
#wrap { background: white; padding: 30px; display: inline-block; }
button { margin: 10px 5px; padding: 8px 16px; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="2800" height="2400"></canvas>
</div>
<div>
<button onclick="save()">下载图片</button>
<button onclick="copy()">复制</button>
</div>
<script>
const c = document.getElementById('c');
const g = c.getContext('2d', { alpha: false });

g.imageSmoothingEnabled = false;
g.fillStyle = '#ffffff';
g.fillRect(0, 0, 2800, 2400);

function box(x, y, w, h) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.fillRect(x, y, w, h);
    g.strokeRect(x, y, w, h);
}

function ellipse(x, y, w, h, isKey = false) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = isKey ? 4 : 2;
    g.beginPath();
    g.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
    g.fill();
    g.stroke();
}

function diamond(x, y, w, h) {
    g.fillStyle = '#ffffff';
    g.strokeStyle = '#000';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(x + w/2, y);
    g.lineTo(x + w, y + h/2);
    g.lineTo(x + w/2, y + h);
    g.lineTo(x, y + h/2);
    g.closePath();
    g.fill();
    g.stroke();
}

function line(x1, y1, x2, y2) {
    g.strokeStyle = '#000';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x2, y2);
    g.stroke();
}

function txt(s, x, y, size = 40, underline = false) {
    g.fillStyle = '#000';
    g.font = 'normal ' + size + 'px SimSun, 宋体, STSong, "Songti SC", serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(s, x, y);
    if (underline) {
        const w = g.measureText(s).width;
        g.beginPath();
        g.moveTo(x - w/2, y + size/2 + 2);
        g.lineTo(x + w/2, y + size/2 + 2);
        g.stroke();
    }
}

const centerX = 1400;
const centerY = 1200;

// 中心实体：用户
box(centerX - 120, centerY - 60, 240, 120);
txt('用户', centerX, centerY, 50);

// 主键：用户ID（上方中心，加粗边框，下划线）
const userIdX = centerX;
const userIdY = centerY - 400;
ellipse(userIdX - 80, userIdY - 50, 160, 100, true);
txt('用户ID', userIdX, userIdY, 40, true);
line(centerX, centerY - 60, userIdX, userIdY + 50);

// 左上方属性
const attrs = [
    // 左上
    { name: '用户名', x: centerX - 500, y: centerY - 350, key: false },
    { name: '密码', x: centerX - 600, y: centerY - 200, key: false },
    { name: '账户名称', x: centerX - 650, y: centerY - 50, key: false },
    { name: '角色', x: centerX - 600, y: centerY + 100, key: false },
    { name: '所属组织', x: centerX - 500, y: centerY + 250, key: false },
    { name: '组织名称', x: centerX - 350, y: centerY + 350, key: false },
    
    // 下方
    { name: '科室', x: centerX - 200, y: centerY + 400, key: false },
    { name: '医生职称', x: centerX, y: centerY + 450, key: false },
    { name: '执业证号', x: centerX + 200, y: centerY + 400, key: false },
    
    // 右下
    { name: '年龄', x: centerX + 350, y: centerY + 350, key: false },
    { name: '性别', x: centerX + 500, y: centerY + 250, key: false },
    { name: '联系电话', x: centerX + 600, y: centerY + 100, key: false },
    
    // 右上
    { name: '电子邮箱', x: centerX + 650, y: centerY - 50, key: false },
    { name: '状态', x: centerX + 600, y: centerY - 200, key: false },
    { name: '创建时间', x: centerX + 500, y: centerY - 350, key: false },
];

// 绘制所有属性
attrs.forEach(attr => {
    ellipse(attr.x - 80, attr.y - 50, 160, 100, attr.key);
    txt(attr.name, attr.x, attr.y, 40, attr.key);
    
    // 连线到中心实体
    const angle = Math.atan2(attr.y - centerY, attr.x - centerX);
    const entityEdgeX = centerX + 120 * Math.cos(angle);
    const entityEdgeY = centerY + 60 * Math.sin(angle);
    
    const attrAngle = Math.atan2(centerY - attr.y, centerX - attr.x);
    const attrEdgeX = attr.x + 80 * Math.cos(attrAngle);
    const attrEdgeY = attr.y + 50 * Math.sin(attrAngle);
    
    line(entityEdgeX, entityEdgeY, attrEdgeX, attrEdgeY);
});

// 标题
txt('图 4.16 用户实体ER图', centerX, 100, 50);

function save() {
    const scale = 2;
    const temp = document.createElement('canvas');
    temp.width = c.width * scale;
    temp.height = c.height * scale;
    const tg = temp.getContext('2d', { alpha: false });
    tg.imageSmoothingEnabled = false;
    tg.scale(scale, scale);
    tg.drawImage(c, 0, 0);
    
    const a = document.createElement('a');
    a.download = '用户实体ER图.png';
    a.href = temp.toDataURL('image/png', 1.0);
    a.click();
}

async function copy() {
    try {
        const scale = 2;
        const temp = document.createElement('canvas');
        temp.width = c.width * scale;
        temp.height = c.height * scale;
        const tg = temp.getContext('2d', { alpha: false });
        tg.imageSmoothingEnabled = false;
        tg.scale(scale, scale);
        tg.drawImage(c, 0, 0);
        
        const b = await new Promise(r => temp.toBlob(r, 'image/png', 1.0));
        await navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
        alert('已复制');
    } catch(e) {
        alert('复制失败');
    }
}
</script>
</body>
</html>
