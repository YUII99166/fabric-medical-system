<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保险报销实体ER图</title>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f5f5f5; }
        svg { background-color: white; border: 1px solid #ddd; }
        .entity { fill: white; stroke: #333; stroke-width: 2; }
        .attribute { fill: white; stroke: #666; stroke-width: 1.5; }
        .key-attribute { fill: white; stroke: #666; stroke-width: 2; }
        .line { stroke: #666; stroke-width: 1.5; fill: none; }
        .text { font-family: 'Microsoft YaHei', Arial, sans-serif; font-size: 14px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
        .entity-text { font-size: 16px; font-weight: bold; }
        .underline { text-decoration: underline; }
    </style>
</head>
<body>
    <svg width="850" height="700" viewBox="0 0 850 700">
        <text class="text" x="425" y="30" style="font-size: 18px; font-weight: bold;">图 X.X 保险报销实体ER图</text>
        
        <!-- 中心实体：保险报销 -->
        <rect class="entity" x="345" y="320" width="160" height="60" rx="5"/>
        <text class="text entity-text" x="425" y="350">保险报销</text>
        
        <!-- 主键：报销ID -->
        <ellipse class="key-attribute" cx="425" cy="220" rx="50" ry="28"/>
        <text class="text underline" x="425" y="220">报销ID</text>
        <line class="line" x1="425" y1="320" x2="425" y2="248"/>
        
        <!-- 处方ID -->
        <ellipse class="key-attribute" cx="310" cy="200" rx="50" ry="28"/>
        <text class="text underline" x="310" y="200">处方ID</text>
        <line class="line" x1="370" y1="325" x2="345" y2="225"/>
        
        <!-- 患者ID -->
        <ellipse class="key-attribute" cx="220" cy="260" rx="50" ry="28"/>
        <text class="text underline" x="220" y="260">患者ID</text>
        <line class="line" x1="350" y1="335" x2="265" y2="280"/>
        
        <!-- 患者姓名 -->
        <ellipse class="attribute" cx="180" cy="350" rx="55" ry="28"/>
        <text class="text" x="180" y="350">患者姓名</text>
        <line class="line" x1="345" y1="350" x2="235" y2="350"/>
        
        <!-- 保险机构ID -->
        <ellipse class="key-attribute" cx="200" cy="450" rx="65" ry="28"/>
        <text class="text underline" x="200" y="450">保险机构ID</text>
        <line class="line" x1="350" y1="370" x2="260" y2="440"/>
        
        <!-- 保险机构名称 -->
        <ellipse class="attribute" cx="260" cy="540" rx="70" ry="28"/>
        <text class="text" x="260" y="540">保险机构名称</text>
        <line class="line" x1="365" y1="375" x2="315" y2="520"/>
        
        <!-- 报销金额 -->
        <ellipse class="attribute" cx="370" cy="590" rx="55" ry="28"/>
        <text class="text" x="370" y="590">报销金额</text>
        <line class="line" x1="405" y1="380" x2="385" y2="562"/>
        
        <!-- 状态 -->
        <ellipse class="attribute" cx="490" cy="600" rx="40" ry="28"/>
        <text class="text" x="490" y="600">状态</text>
        <line class="line" x1="440" y1="378" x2="475" y2="575"/>
        
        <!-- 拒绝理由 -->
        <ellipse class="attribute" cx="590" cy="570" rx="55" ry="28"/>
        <text class="text" x="590" y="570">拒绝理由</text>
        <line class="line" x1="480" y1="375" x2="545" y2="550"/>
        
        <!-- 申请时间 -->
        <ellipse class="attribute" cx="660" cy="500" rx="55" ry="28"/>
        <text class="text" x="660" y="500">申请时间</text>
        <line class="line" x1="495" y1="365" x2="610" y2="485"/>
        
        <!-- 审批时间 -->
        <ellipse class="attribute" cx="690" cy="410" rx="55" ry="28"/>
        <text class="text" x="690" y="410">审批时间</text>
        <line class="line" x1="505" y1="355" x2="640" y2="425"/>
        
        <!-- 交易ID -->
        <ellipse class="key-attribute" cx="660" cy="310" rx="50" ry="28"/>
        <text class="text underline" x="660" y="310">交易ID</text>
        <line class="line" x1="500" y1="340" x2="615" y2="320"/>
        
        <!-- 创建时间 -->
        <ellipse class="attribute" cx="580" cy="230" rx="55" ry="28"/>
        <text class="text" x="580" y="230">创建时间</text>
        <line class="line" x1="490" y1="330" x2="535" y2="250"/>
        
        <!-- 图例 -->
        <g transform="translate(50, 620)">
            <text class="text" x="0" y="0" text-anchor="start" style="font-size: 13px; font-weight: bold;">图例：</text>
            <ellipse class="key-attribute" cx="80" cy="30" rx="35" ry="20"/>
            <text class="text underline" x="80" y="30" style="font-size: 12px;">主键</text>
            <ellipse class="attribute" cx="170" cy="30" rx="35" ry="20"/>
            <text class="text" x="170" y="30" style="font-size: 12px;">属性</text>
        </g>
    </svg>
</body>
</html>
