<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授权请求实体ER图</title>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f5f5f5; }
        svg { background-color: white; border: 1px solid #ddd; }
        .entity { fill: white; stroke: #333; stroke-width: 2; }
        .attribute { fill: white; stroke: #666; stroke-width: 1.5; }
        .key-attribute { fill: white; stroke: #666; stroke-width: 2; }
        .line { stroke: #666; stroke-width: 1.5; fill: none; }
        .text { font-family: 'Microsoft YaHei', Arial, sans-serif; font-size: 14px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
        .entity-text { font-size: 16px; font-weight: bold; }
        .underline { text-decoration: underline; }
    </style>
</head>
<body>
    <svg width="950" height="800" viewBox="0 0 950 800">
        <text class="text" x="475" y="30" style="font-size: 18px; font-weight: bold;">图 X.X 授权请求实体ER图</text>
        
        <!-- 中心实体：授权请求 -->
        <rect class="entity" x="395" y="370" width="160" height="60" rx="5"/>
        <text class="text entity-text" x="475" y="400">授权请求</text>
        
        <!-- 主键：请求ID -->
        <ellipse class="key-attribute" cx="475" cy="270" rx="50" ry="28"/>
        <text class="text underline" x="475" y="270">请求ID</text>
        <line class="line" x1="475" y1="370" x2="475" y2="298"/>
        
        <!-- 病历ID -->
        <ellipse class="key-attribute" cx="360" cy="250" rx="50" ry="28"/>
        <text class="text underline" x="360" y="250">病历ID</text>
        <line class="line" x1="420" y1="375" x2="395" y2="275"/>
        
        <!-- 患者ID -->
        <ellipse class="key-attribute" cx="250" cy="300" rx="50" ry="28"/>
        <text class="text underline" x="250" y="300">患者ID</text>
        <line class="line" x1="395" y1="385" x2="295" y2="320"/>
        
        <!-- 患者姓名 -->
        <ellipse class="attribute" cx="200" cy="390" rx="55" ry="28"/>
        <text class="text" x="200" y="390">患者姓名</text>
        <line class="line" x1="395" y1="400" x2="255" y2="395"/>
        
        <!-- 医生ID -->
        <ellipse class="key-attribute" cx="220" cy="490" rx="50" ry="28"/>
        <text class="text underline" x="220" y="490">医生ID</text>
        <line class="line" x1="400" y1="420" x2="265" y2="480"/>
        
        <!-- 医生姓名 -->
        <ellipse class="attribute" cx="280" cy="580" rx="55" ry="28"/>
        <text class="text" x="280" y="580">医生姓名</text>
        <line class="line" x1="410" y1="425" x2="325" y2="565"/>
        
        <!-- 医生所属组织 -->
        <ellipse class="attribute" cx="380" cy="640" rx="70" ry="28"/>
        <text class="text" x="380" y="640">医生所属组织</text>
        <line class="line" x1="440" y1="428" x2="415" y2="615"/>
        
        <!-- 医生组织名称 -->
        <ellipse class="attribute" cx="500" cy="670" rx="70" ry="28"/>
        <text class="text" x="500" y="670">医生组织名称</text>
        <line class="line" x1="480" y1="430" x2="490" y2="642"/>
        
        <!-- 申请理由 -->
        <ellipse class="attribute" cx="620" cy="660" rx="55" ry="28"/>
        <text class="text" x="620" y="660">申请理由</text>
        <line class="line" x1="525" y1="425" x2="580" y2="640"/>
        
        <!-- 状态 -->
        <ellipse class="attribute" cx="710" cy="600" rx="40" ry="28"/>
        <text class="text" x="710" y="600">状态</text>
        <line class="line" x1="545" y1="420" x2="675" y2="585"/>
        
        <!-- 拒绝理由 -->
        <ellipse class="attribute" cx="760" cy="510" rx="55" ry="28"/>
        <text class="text" x="760" y="510">拒绝理由</text>
        <line class="line" x1="555" y1="410" x2="710" y2="525"/>
        
        <!-- 申请时间 -->
        <ellipse class="attribute" cx="760" cy="410" rx="55" ry="28"/>
        <text class="text" x="760" y="410">申请时间</text>
        <line class="line" x1="555" y1="395" x2="710" y2="420"/>
        
        <!-- 审批时间 -->
        <ellipse class="attribute" cx="720" cy="310" rx="55" ry="28"/>
        <text class="text" x="720" y="310">审批时间</text>
        <line class="line" x1="545" y1="385" x2="670" y2="325"/>
        
        <!-- 交易ID -->
        <ellipse class="key-attribute" cx="600" cy="250" rx="50" ry="28"/>
        <text class="text underline" x="600" y="250">交易ID</text>
        <line class="line" x1="530" y1="375" x2="560" y2="270"/>
        
        <!-- 图例 -->
        <g transform="translate(50, 720)">
            <text class="text" x="0" y="0" text-anchor="start" style="font-size: 13px; font-weight: bold;">图例：</text>
            <ellipse class="key-attribute" cx="80" cy="30" rx="35" ry="20"/>
            <text class="text underline" x="80" y="30" style="font-size: 12px;">主键</text>
            <ellipse class="attribute" cx="170" cy="30" rx="35" ry="20"/>
            <text class="text" x="170" y="30" style="font-size: 12px;">属性</text>
        </g>
    </svg>
</body>
</html>
