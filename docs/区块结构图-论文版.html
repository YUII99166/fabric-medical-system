<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyperledger Fabric 区块结构图</title>
<style>
body {
  margin: 0;
  padding: 20px;
  background: white;
  font-family: 'Times New Roman', 'SimSun', serif;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
  background: white;
}
h1 {
  text-align: center;
  color: #000;
  font-size: 20px;
  margin-bottom: 30px;
  font-weight: normal;
}
svg {
  display: block;
  margin: 0 auto;
}
.caption {
  text-align: center;
  font-size: 14px;
  color: #000;
  margin-top: 15px;
  margin-bottom: 30px;
}
</style>
</head>
<body>
<div class="container">

<h1>图 X-X Hyperledger Fabric 区块结构示意图</h1>

<!-- 主区块结构图 -->
<svg width="1000" height="1200" xmlns="http://www.w3.org/2000/svg">
  
  <!-- 外层区块边框 -->
  <rect x="50" y="20" width="900" height="1150" rx="0" fill="white" stroke="#000" stroke-width="2"/>
  
  <!-- 区块标题 -->
  <text x="500" y="50" font-size="16" font-weight="bold" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">区块 N (Block N)</text>
  <line x1="50" y1="65" x2="950" y2="65" stroke="#000" stroke-width="2"/>

  <!-- 区块头部分 -->
  <rect x="80" y="90" width="840" height="160" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="100" y="115" font-size="14" font-weight="bold" fill="#000" font-family="Times New Roman, SimSun">区块头 (Block Header)</text>
  <line x1="80" y1="125" x2="920" y2="125" stroke="#000" stroke-width="1"/>
  
  <text x="120" y="150" font-size="12" fill="#000" font-family="Times New Roman, SimSun">区块号 (Number): N</text>
  <text x="120" y="175" font-size="12" fill="#000" font-family="Times New Roman, SimSun">前区块哈希 (Previous Hash): Hash(Block N-1)</text>
  <text x="120" y="200" font-size="12" fill="#000" font-family="Times New Roman, SimSun">数据哈希 (Data Hash): MerkleRoot(Transactions)</text>
  <text x="120" y="225" font-size="12" fill="#000" font-family="Times New Roman, SimSun">时间戳 (Timestamp): T</text>

  <!-- 区块数据部分 -->
  <rect x="80" y="270" width="840" height="750" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="100" y="295" font-size="14" font-weight="bold" fill="#000" font-family="Times New Roman, SimSun">区块数据 (Block Data)</text>
  <line x1="80" y1="305" x2="920" y2="305" stroke="#000" stroke-width="1"/>

  <!-- 交易1 -->
  <rect x="110" y="325" width="780" height="520" rx="0" fill="white" stroke="#000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="130" y="350" font-size="13" font-weight="bold" fill="#000" font-family="Times New Roman, SimSun">交易 i (Transaction i)</text>
  <line x1="110" y1="360" x2="890" y2="360" stroke="#000" stroke-width="1"/>

  <!-- 交易ID -->
  <text x="130" y="385" font-size="12" fill="#000" font-family="Times New Roman, SimSun">交易ID (TxID): SHA256(Nonce || Creator)</text>

  <!-- 交易头 -->
  <rect x="140" y="405" width="720" height="110" rx="0" fill="white" stroke="#000" stroke-width="1"/>
  <text x="160" y="425" font-size="12" font-weight="bold" fill="#000" font-family="Times New Roman, SimSun">交易头 (Transaction Header)</text>
  <line x1="140" y1="433" x2="860" y2="433" stroke="#000" stroke-width="0.5"/>
  <text x="170" y="453" font-size="11" fill="#000" font-family="Times New Roman, SimSun">• 通道ID (Channel ID)</text>
  <text x="170" y="473" font-size="11" fill="#000" font-family="Times New Roman, SimSun">• 交易类型 (Type): ENDORSER_TRANSACTION</text>
  <text x="170" y="493" font-size="11" fill="#000" font-family="Times New Roman, SimSun">• 创建者 (Creator): MSP ID + X.509 证书</text>

  <!-- 链码调用 -->
  <rect x="140" y="530" width="720" height="90" rx="0" fill="white" stroke="#000" stroke-width="1"/>
  <text x="160" y="550" font-size="12" font-weight="bold" fill="#000" font-family="Times New Roman, SimSun">链码调用 (Chaincode Invocation)</text>
  <line x1="140" y1="558" x2="860" y2="558" stroke="#000" stroke-width="0.5"/>
  <text x="170" y="578" font-size="11" fill="#000" font-family="Times New Roman, SimSun">• 链码名称 (Chaincode Name)</text>
  <text x="170" y="598" font-size="11" fill="#000" font-family="Times New Roman, SimSun">• 函数名称 (Function Name)</text>

  <!-- 读写集 -->
  <rect x="140" y="635" width="720" height="195" rx="0" fill="white" stroke="#000" stroke-width="1"/>
  <text x="160" y="655" font-size="12" font-weight="bold" fill="#000" font-family="Times New Roman, SimSun">读写集 (Read-Write Set)</text>
  <line x1="140" y1="663" x2="860" y2="663" stroke="#000" stroke-width="0.5"/>
  
  <text x="170" y="683" font-size="11" font-weight="bold" fill="#000" font-family="Times New Roman, SimSun">读集 (Read Set):</text>
  <text x="190" y="703" font-size="11" fill="#000" font-family="Times New Roman, SimSun">• Key₁: Version₁</text>
  <text x="190" y="723" font-size="11" fill="#000" font-family="Times New Roman, SimSun">• Key₂: Version₂</text>
  <text x="190" y="743" font-size="11" fill="#000" font-family="Times New Roman, SimSun">• ...</text>
  
  <text x="170" y="768" font-size="11" font-weight="bold" fill="#000" font-family="Times New Roman, SimSun">写集 (Write Set):</text>
  <text x="190" y="788" font-size="11" fill="#000" font-family="Times New Roman, SimSun">• Key₁: Value₁ (JSON格式)</text>
  <text x="190" y="808" font-size="11" fill="#000" font-family="Times New Roman, SimSun">• Key₂: Value₂ (JSON格式)</text>

  <!-- 交易2和3的占位 -->
  <rect x="110" y="865" width="370" height="60" rx="0" fill="white" stroke="#000" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="295" y="900" font-size="12" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">交易 i+1</text>

  <rect x="520" y="865" width="370" height="60" rx="0" fill="white" stroke="#000" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="705" y="900" font-size="12" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">交易 i+2</text>

  <text x="500" y="960" font-size="12" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">...</text>
  
  <rect x="110" y="980" width="780" height="25" rx="0" fill="white" stroke="#000" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="500" y="998" font-size="12" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">交易 m (共 m 笔交易)</text>

  <!-- 区块元数据 -->
  <rect x="80" y="1040" width="840" height="110" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="100" y="1065" font-size="14" font-weight="bold" fill="#000" font-family="Times New Roman, SimSun">区块元数据 (Block Metadata)</text>
  <line x1="80" y1="1075" x2="920" y2="1075" stroke="#000" stroke-width="1"/>
  
  <text x="120" y="1100" font-size="12" fill="#000" font-family="Times New Roman, SimSun">• Orderer 签名 (Orderer Signature)</text>
  <text x="120" y="1120" font-size="12" fill="#000" font-family="Times New Roman, SimSun">• 交易验证结果 (Validation Results): [VALID/INVALID, ...]</text>
  <text x="120" y="1140" font-size="12" fill="#000" font-family="Times New Roman, SimSun">• 提交信息 (Commit Info)</text>

</svg>

<div class="caption">图 X-X Hyperledger Fabric 区块结构</div>

<!-- TxID生成过程 -->
<h1 style="margin-top:50px;">图 X-X 交易ID生成过程</h1>

<svg width="1000" height="180" xmlns="http://www.w3.org/2000/svg">
  
  <!-- Nonce -->
  <rect x="80" y="50" width="180" height="80" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="170" y="75" font-size="13" font-weight="bold" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">Nonce</text>
  <text x="170" y="95" font-size="11" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">(24字节随机数)</text>
  <text x="170" y="115" font-size="10" fill="#000" text-anchor="middle" font-family="Courier New">Random[24]</text>

  <!-- 加号 -->
  <text x="290" y="95" font-size="24" fill="#000" font-weight="bold" font-family="Times New Roman">+</text>

  <!-- Creator -->
  <rect x="330" y="50" width="200" height="80" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="430" y="75" font-size="13" font-weight="bold" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">Creator</text>
  <text x="430" y="95" font-size="11" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">(交易发起者身份)</text>
  <text x="430" y="115" font-size="10" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">MSP ID + X.509证书</text>

  <!-- 箭头和SHA256 -->
  <line x1="550" y1="90" x2="620" y2="90" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#000" />
    </marker>
  </defs>
  <text x="585" y="80" font-size="11" fill="#000" text-anchor="middle" font-family="Times New Roman">SHA256</text>

  <!-- TxID -->
  <rect x="640" y="50" width="280" height="80" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="780" y="75" font-size="13" font-weight="bold" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">TxID</text>
  <text x="780" y="95" font-size="11" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">(交易唯一标识符)</text>
  <text x="780" y="115" font-size="10" fill="#000" text-anchor="middle" font-family="Courier New">32字节哈希值</text>

</svg>

<div class="caption">图 X-X 交易ID生成算法</div>

<!-- 区块链连接 -->
<h1 style="margin-top:50px;">图 X-X 区块链连接结构</h1>

<svg width="1000" height="200" xmlns="http://www.w3.org/2000/svg">
  
  <!-- Block N-1 -->
  <rect x="50" y="60" width="180" height="100" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="140" y="90" font-size="13" font-weight="bold" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">Block N-1</text>
  <text x="140" y="110" font-size="10" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">Hash: H(N-1)</text>
  <text x="140" y="130" font-size="10" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">PrevHash: H(N-2)</text>

  <!-- Arrow -->
  <line x1="240" y1="110" x2="310" y2="110" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#000" />
    </marker>
  </defs>
  <text x="275" y="100" font-size="10" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">引用</text>

  <!-- Block N (Current) -->
  <rect x="320" y="60" width="180" height="100" rx="0" fill="white" stroke="#000" stroke-width="2"/>
  <text x="410" y="90" font-size="13" font-weight="bold" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">Block N</text>
  <text x="410" y="110" font-size="10" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">Hash: H(N)</text>
  <text x="410" y="130" font-size="10" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">PrevHash: H(N-1)</text>

  <!-- Arrow -->
  <line x1="510" y1="110" x2="580" y2="110" stroke="#000" stroke-width="2" marker-end="url(#arrow3)"/>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#000" />
    </marker>
  </defs>
  <text x="545" y="100" font-size="10" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">引用</text>

  <!-- Block N+1 -->
  <rect x="590" y="60" width="180" height="100" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="680" y="90" font-size="13" font-weight="bold" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">Block N+1</text>
  <text x="680" y="110" font-size="10" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">Hash: H(N+1)</text>
  <text x="680" y="130" font-size="10" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">PrevHash: H(N)</text>

  <!-- Arrow -->
  <line x1="780" y1="110" x2="850" y2="110" stroke="#000" stroke-width="2" marker-end="url(#arrow4)"/>
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#000" />
    </marker>
  </defs>
  <text x="815" y="100" font-size="10" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">...</text>

  <!-- 说明文字 -->
  <text x="500" y="30" font-size="11" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">通过前区块哈希形成链式结构</text>

</svg>

<div class="caption">图 X-X 区块链式连接示意图</div>

</div>
</body>
</html>
