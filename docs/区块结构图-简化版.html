<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>区块结构图 - 简化版</title>
<style>
body {
  margin: 0;
  padding: 20px;
  background: white;
  font-family: 'Times New Roman', 'SimSun', serif;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  background: white;
}
h1 {
  text-align: center;
  color: #000;
  font-size: 27px;
  margin-bottom: 30px;
  font-weight: normal;
}
svg {
  display: block;
  margin: 0 auto;
}
.caption {
  text-align: center;
  font-size: 21px;
  color: #000;
  margin-top: 15px;
  margin-bottom: 30px;
}
</style>
</head>
<body>
<div class="container">

<h1>图 X-X 区块结构示意图</h1>

<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  
  <!-- 区块外框 -->
  <rect x="50" y="30" width="700" height="440" rx="0" fill="white" stroke="#000" stroke-width="2.5"/>
  
  <!-- 区块标题 -->
  <text x="400" y="60" font-size="24" font-weight="bold" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">区块 N</text>
  <line x1="50" y1="75" x2="750" y2="75" stroke="#000" stroke-width="2"/>

  <!-- 区块头 -->
  <rect x="80" y="100" width="640" height="100" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="100" y="125" font-size="21" font-weight="bold" fill="#000" font-family="Times New Roman, SimSun">区块头</text>
  <line x1="80" y1="135" x2="720" y2="135" stroke="#000" stroke-width="1"/>
  <text x="120" y="165" font-size="18" fill="#000" font-family="Times New Roman, SimSun">区块号、前区块哈希、数据哈希、时间戳</text>

  <!-- 区块数据 -->
  <rect x="80" y="220" width="640" height="180" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="100" y="245" font-size="21" font-weight="bold" fill="#000" font-family="Times New Roman, SimSun">区块数据</text>
  <line x1="80" y1="255" x2="720" y2="255" stroke="#000" stroke-width="1"/>
  
  <!-- 交易列表 -->
  <rect x="110" y="275" width="180" height="60" rx="0" fill="white" stroke="#000" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="200" y="312" font-size="18" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">交易 1</text>
  
  <rect x="310" y="275" width="180" height="60" rx="0" fill="white" stroke="#000" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="400" y="312" font-size="18" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">交易 2</text>
  
  <rect x="510" y="275" width="180" height="60" rx="0" fill="white" stroke="#000" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="600" y="312" font-size="18" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">交易 m</text>
  
  <text x="400" y="368" font-size="16" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">包含多笔交易记录</text>

  <!-- 区块元数据 -->
  <rect x="80" y="420" width="640" height="35" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="100" y="443" font-size="21" font-weight="bold" fill="#000" font-family="Times New Roman, SimSun">区块元数据</text>
  <text x="250" y="443" font-size="18" fill="#000" font-family="Times New Roman, SimSun">(签名、验证结果)</text>

</svg>

<div class="caption">图 X-X 区块的基本结构</div>

<!-- 区块链连接 -->
<h1 style="margin-top:40px;">图 X-X 区块链式连接</h1>

<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  
  <!-- Block N-1 -->
  <rect x="30" y="60" width="150" height="90" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="105" y="98" font-size="19" font-weight="bold" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">区块 N-1</text>
  <text x="105" y="125" font-size="16" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">哈希值: H(N-1)</text>

  <!-- Arrow -->
  <line x1="190" y1="105" x2="250" y2="105" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#000" />
    </marker>
  </defs>
  <text x="220" y="92" font-size="15" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">前区块哈希</text>

  <!-- Block N (Current) -->
  <rect x="260" y="60" width="150" height="90" rx="0" fill="white" stroke="#000" stroke-width="2.5"/>
  <text x="335" y="98" font-size="19" font-weight="bold" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">区块 N</text>
  <text x="335" y="125" font-size="16" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">哈希值: H(N)</text>

  <!-- Arrow -->
  <line x1="420" y1="105" x2="480" y2="105" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#000" />
    </marker>
  </defs>
  <text x="450" y="92" font-size="15" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">前区块哈希</text>

  <!-- Block N+1 -->
  <rect x="490" y="60" width="150" height="90" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="565" y="98" font-size="19" font-weight="bold" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">区块 N+1</text>
  <text x="565" y="125" font-size="16" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">哈希值: H(N+1)</text>

  <!-- Arrow -->
  <line x1="650" y1="105" x2="710" y2="105" stroke="#000" stroke-width="2" marker-end="url(#arrow3)"/>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#000" />
    </marker>
  </defs>
  <text x="680" y="92" font-size="15" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">...</text>

  <!-- 说明 -->
  <text x="400" y="30" font-size="16" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">通过哈希指针形成链式结构</text>

</svg>

<div class="caption">图 X-X 区块通过前区块哈希连接成链</div>

<!-- 防篡改原理 -->
<h1 style="margin-top:40px;">图 X-X 防篡改机制</h1>

<svg width="800" height="280" xmlns="http://www.w3.org/2000/svg">
  
  <!-- 正常情况 -->
  <text x="50" y="30" font-size="19" font-weight="bold" fill="#000" font-family="Times New Roman, SimSun">(a) 正常情况</text>
  
  <rect x="50" y="50" width="120" height="60" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="110" y="77" font-size="16" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">区块 N</text>
  <text x="110" y="98" font-size="15" fill="#000" text-anchor="middle" font-family="Courier New">Hash: abc123</text>
  
  <line x1="180" y1="80" x2="230" y2="80" stroke="#000" stroke-width="2" marker-end="url(#arrow4)"/>
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#000" />
    </marker>
  </defs>
  
  <rect x="240" y="50" width="120" height="60" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="300" y="77" font-size="16" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">区块 N+1</text>
  <text x="300" y="98" font-size="15" fill="#000" text-anchor="middle" font-family="Courier New">PrevHash: abc123</text>
  
  <text x="400" y="85" font-size="18" fill="#008000" font-family="Times New Roman, SimSun">✓ 哈希匹配</text>

  <!-- 篡改情况 -->
  <text x="50" y="170" font-size="19" font-weight="bold" fill="#000" font-family="Times New Roman, SimSun">(b) 数据被篡改</text>
  
  <rect x="50" y="190" width="120" height="60" rx="0" fill="#ffe0e0" stroke="#ff0000" stroke-width="2"/>
  <text x="110" y="217" font-size="16" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">区块 N (篡改)</text>
  <text x="110" y="238" font-size="15" fill="#ff0000" text-anchor="middle" font-family="Courier New">Hash: xyz789</text>
  
  <line x1="180" y1="220" x2="230" y2="220" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,3"/>
  
  <rect x="240" y="190" width="120" height="60" rx="0" fill="white" stroke="#000" stroke-width="1.5"/>
  <text x="300" y="217" font-size="16" fill="#000" text-anchor="middle" font-family="Times New Roman, SimSun">区块 N+1</text>
  <text x="300" y="238" font-size="15" fill="#000" text-anchor="middle" font-family="Courier New">PrevHash: abc123</text>
  
  <text x="400" y="225" font-size="18" fill="#ff0000" font-family="Times New Roman, SimSun">✗ 哈希失配</text>

</svg>

<div class="caption">图 X-X 区块链防篡改原理示意</div>

</div>
</body>
</html>
